targets:
  $default:
    sources:
      exclude:
        # Exclude the OpenAPI-generated path dependency from the root build graph.
        # Its own generated part files are produced by tools/openapi/generate.sh.
        - lib/data/services/api/generated/**
    builders:
      freezed:
        generate_for:
          include:
            - lib/domain/**/*.dart
            - lib/data/**/*.dart
          exclude:
            - lib/data/services/api/generated/**
      json_serializable:
        generate_for:
          include:
            - lib/domain/**/*.dart
            - lib/data/**/*.dart
          exclude:
            - lib/data/services/api/generated/**
      mockito|mockBuilder:
        # The wrapper mocks depend on the generated v6 API surface. Keep this
        # input in root codegen so OpenAPI operation/model changes cannot leave
        # a stale mocks.mocks.dart behind. Full root codegen with the generated
        # package excluded above is validated against the pinned FTL v6.7 client.
        generate_for:
          include:
            - test/data/services/api/wrappers/mocks.dart
