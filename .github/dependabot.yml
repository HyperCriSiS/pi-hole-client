# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # These majors currently require Android compileSdk 37. Keep them blocked
      # until the project deliberately moves beyond the compileSdk 36 / F-Droid
      # compatibility baseline.
      - dependency-name: "permission_handler"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "flutter_secure_storage"
        update-types:
          - "version-update:semver-major"
      # dynamic_color 2.x exposes material_ui ColorScheme values that are not
      # compatible with Flutter's material ColorScheme on the current baseline.
      - dependency-name: "dynamic_color"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Docusaurus 3.10.x still relies on the tsconfig baseUrl option removed by
      # TypeScript 7. Revisit this major together with the Docusaurus 4 migration.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    