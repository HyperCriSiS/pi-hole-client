name: Regenerate encoded OpenAPI paths once

on:
  push:
    branches:
      - roadmap/generated-path-encoding
    paths:
      - '.github/workflows/regenerate-generated-path-encoding.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: roadmap/generated-path-encoding

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Enable pnpm
        run: corepack enable

      - name: Get project dependencies
        run: flutter pub get

      - name: Prepare environment
        run: cp .env.sample .env

      - name: Regenerate pinned v6 client
        run: tools/openapi/generate.sh

      - name: Format regression test
        run: dart format test/data/services/api/generated/v6_path_encoding_test.dart

      - name: Verify generated path encoding
        run: |
          python3 tools/openapi/encode_path_parameters.py \
            lib/data/services/api/generated/v6/lib/src/api
          if git diff --quiet -- lib/data/services/api/generated/v6/lib/src/api; then
            echo 'Expected encoded generated API diff is missing.' >&2
            exit 1
          fi
          if grep -R -n -E '^[[:space:]]+[A-Za-z_][A-Za-z0-9_]*\.toString\(\),[[:space:]]*$' \
              lib/data/services/api/generated/v6/lib/src/api/*_api.dart; then
            echo 'Raw generated path parameter values remain.' >&2
            exit 1
          fi
          git diff --check

      - name: Run path encoding regression tests
        run: flutter test test/data/services/api/generated/v6_path_encoding_test.dart

      - name: Analyze project
        run: dart analyze

      - name: Commit regenerated output and remove one-shot workflow
        run: |
          git rm .github/workflows/regenerate-generated-path-encoding.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate encoded OpenAPI paths'
          git push
