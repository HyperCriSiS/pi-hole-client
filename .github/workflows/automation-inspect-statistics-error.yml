name: automation inspect statistics error state
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-statistics-error.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show shared error usage
        run: |
          grep -R -n -C 8 'ErrorMessage(' lib/ui | head -n 260 || true
          echo '=== widget declaration ==='
          grep -R -n -C 12 'class ErrorMessage' lib/ui || true
          echo '=== statistics target ==='
          sed -n '1,95p' lib/ui/statistics/widgets/statistics_list.dart