name: automation migrate statistics error state
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-statistics-error.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare test environment
        run: touch .env
      - name: Migrate StatisticsList error state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/ui/statistics/widgets/statistics_list.dart'); s=p.read_text()
          s=s.replace("import 'package:pi_hole_client/ui/core/ui/components/section_label.dart';", "import 'package:pi_hole_client/ui/core/ui/components/error_message.dart';\nimport 'package:pi_hole_client/ui/core/ui/components/section_label.dart';")
          old="""        child: Column(\n          mainAxisAlignment: MainAxisAlignment.center,\n          children: [\n            const Icon(Icons.error, size: 50, color: Colors.red),\n            const SizedBox(height: 50),\n            Text(\n              AppLocalizations.of(context)!.statsNotLoaded,\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                color: Theme.of(context).colorScheme.onSurfaceVariant,\n                fontSize: 22,\n              ),\n            ),\n          ],\n        ),"""
          new="""        child: ErrorMessage(\n          message: AppLocalizations.of(context)!.statsNotLoaded,\n          fontSize: 22,\n          fontColor: Theme.of(context).colorScheme.onSurfaceVariant,\n        ),"""
          if old not in s: raise SystemExit('target error block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: flutter pub get
      - run: flutter test test/ui/statistics/statistics_test.dart
      - name: Update roadmap and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md'); s=p.read_text()
          line='  - [x] Migrate `StatisticsList` error state to shared `ErrorMessage` and verify `statistics_test.dart`.\n'
          if line not in s:
            anchor='- [ ] #638'
            i=s.find(anchor)
            if i<0: raise SystemExit('roadmap #638 anchor missing')
            e=s.find('\n',i)+1
            s=s[:e]+line+s[e:]
          p.write_text(s)
          PY
          rm .github/workflows/automation-inspect-statistics-error.yml
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add lib/ui/statistics/widgets/statistics_list.dart ROADMAP.md .github/workflows/automation-inspect-statistics-error.yml
          git commit -m 'refactor: reuse shared error state in statistics'
          git push