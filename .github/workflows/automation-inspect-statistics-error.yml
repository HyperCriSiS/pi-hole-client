name: automation migrate statistics error state
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Migrate StatisticsList to shared ErrorMessage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/statistics/widgets/statistics_list.dart')
          s = p.read_text()
          imp = "import 'package:pi_hole_client/ui/core/ui/components/error_message.dart';\n"
          anchor = "import 'package:pi_hole_client/ui/core/l10n/generated/app_localizations.dart';\n"
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('localization import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)
          old = """      errorGenerator: () => SizedBox(\n        width: double.maxFinite,\n        height: 300,\n        child: Column(\n          mainAxisAlignment: MainAxisAlignment.center,\n          children: [\n            const Icon(Icons.error, size: 50, color: Colors.red),\n            const SizedBox(height: 50),\n            Text(\n              AppLocalizations.of(context)!.statsNotLoaded,\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                color: Theme.of(context).colorScheme.onSurfaceVariant,\n                fontSize: 22,\n              ),\n            ),\n          ],\n        ),\n      ),\n"""
          new = """      errorGenerator: () => SizedBox(\n        width: double.maxFinite,\n        height: 300,\n        child: ErrorMessage(\n          message: AppLocalizations.of(context)!.statsNotLoaded,\n        ),\n      ),\n"""
          if old not in s:
              raise SystemExit('expected StatisticsList error block not found')
          p.write_text(s.replace(old, new, 1))

          r = Path('ROADMAP.md')
          text = r.read_text()
          entry = '- [x] Migrate the StatisticsList error state to the shared `ErrorMessage` component and keep `statistics_test.dart` green.\n'
          if entry not in text:
              lines = text.splitlines(keepends=True)
              insert_at = None
              for i, line in enumerate(lines):
                  if '#638' in line and line.lstrip().startswith('- [ ]'):
                      insert_at = i + 1
                  if 'GroupsList' in line and line.lstrip().startswith('- [x]'):
                      insert_at = i + 1
              if insert_at is None:
                  raise SystemExit('ROADMAP #638 anchor not found')
              lines.insert(insert_at, entry)
              text = ''.join(lines)
          text = text.replace('**Not fully completed.** #604 and #404 are implemented and validated. #638 is the next preferred deterministic item.', '**Not fully completed.** #604 and #404 are implemented and validated. #638 is in progress; shared error-state migration is continuing incrementally.')
          r.write_text(text)
          PY
      - name: Run focused Flutter test
        run: |
          touch .env
          flutter pub get
          flutter test test/ui/statistics/statistics_test.dart
      - name: Commit validated migration and remove temporary workflow
        run: |
          rm .github/workflows/automation-inspect-statistics-error.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add lib/ui/statistics/widgets/statistics_list.dart ROADMAP.md .github/workflows/automation-inspect-statistics-error.yml
          git diff --cached --check
          git commit -m 'refactor: reuse shared error state in statistics'
          git push origin HEAD:dev
