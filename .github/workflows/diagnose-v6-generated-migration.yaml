name: Diagnose generated v6 migration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-v6-generated-migration.yaml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix generated API Success import ambiguity
        run: >-
          sed -i
          "s#import 'package:pihole_v6_api/pihole_v6_api.dart';#import 'package:pihole_v6_api/pihole_v6_api.dart' hide Success;#"
          test/data/repositories/api/v6/ftl_repository_test.dart

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare env file
        run: cp .env.sample .env

      - name: Generate Git commit hash
        run: dart run tools/generate_git_commit.dart

      - name: Run focused generated-v6 tests
        run: >-
          flutter test --reporter expanded
          test/data/services/api/wrappers/pihole_v6_service_test.dart
          test/data/repositories/api/v6/base_v6_sid_repository_test.dart
          test/data/repositories/api/v6/ftl_repository_test.dart

      - name: Commit validated import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/data/repositories/api/v6/ftl_repository_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: disambiguate generated API Success model"
          git push origin HEAD:dev
