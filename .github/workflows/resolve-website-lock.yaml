name: Resolve website lockfile

on:
  push:
    branches:
      - maintenance/node22-serialize-javascript
    paths:
      - 'website/package.json'

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve and validate website dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/node22-serialize-javascript

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Resolve lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify serialize-javascript resolution
        run: pnpm why serialize-javascript

      - name: Build website on declared Node floor
        run: pnpm build

      - name: Commit regenerated lockfile
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git commit -m 'chore(docs): regenerate pnpm lockfile'
          git push origin HEAD:maintenance/node22-serialize-javascript
