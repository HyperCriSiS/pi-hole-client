name: Resolve website lockfile

on:
  push:
    branches:
      - maintenance/docusaurus-3.10.2
    paths:
      - 'website/package.json'
      - '.github/workflows/resolve-website-lock.yaml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Resolve lockfile
        run: pnpm install --lockfile-only

      - name: Validate resolved install
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already resolved."
            exit 0
          fi
          git commit -m "chore(docs): resolve Docusaurus 3.10.2 lockfile"
          git push
