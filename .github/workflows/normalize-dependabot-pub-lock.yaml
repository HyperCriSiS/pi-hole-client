name: Normalize pub lockfile

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Open internal pub PR number"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve and validate pub PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail

          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "pull_request must be a numeric PR number" >&2
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"

          test "$state" = 'open' || {
            echo "PR #${PR_NUMBER} is not open" >&2
            exit 1
          }
          test "$base_ref" = 'main' || {
            echo "PR #${PR_NUMBER} does not target main" >&2
            exit 1
          }
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "PR #${PR_NUMBER} is not an internal repository branch" >&2
            exit 1
          }

          case "$author:$head_ref" in
            'dependabot[bot]':dependabot/pub/*)
              ;;
            "$GITHUB_REPOSITORY_OWNER":maintenance/pub/*)
              ;;
            *)
              echo "PR #${PR_NUMBER} is neither an approved Dependabot pub PR nor an owner-authored maintenance/pub PR" >&2
              exit 1
              ;;
          esac

          mapfile -t changed_files < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )
          for path in "${changed_files[@]}"; do
            case "$path" in
              pubspec.yaml|pubspec.lock) ;;
              *)
                echo "Refusing to normalize unexpected PR file: $path" >&2
                exit 1
                ;;
            esac
          done

          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pub PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup repository-pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Normalize pub lockfile
        run: flutter pub get

      - name: Validate normalization scope
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only)

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#changed_files[@]}" -ne 1 ] || [ "${changed_files[0]}" != 'pubspec.lock' ]; then
            printf 'Unexpected files changed by flutter pub get:\n' >&2
            printf '  %s\n' "${changed_files[@]}" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff -- pubspec.lock

      - name: Commit normalized lockfile
        if: steps.diff.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'ci: normalize pub lockfile with Flutter 3.44.1'
          git push origin "HEAD:refs/heads/${HEAD_REF}"
