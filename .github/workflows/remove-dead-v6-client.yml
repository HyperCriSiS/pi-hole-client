name: Stage dead handwritten v6 cleanup

on:
  push:
    branches:
      - maintenance/remove-dead-v6-client-methods

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/remove-dead-v6-client-methods
      - name: Remove unreachable handwritten methods and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          methods = [
              'postGroups', 'putGroups', 'postClients', 'putClients',
              'deleteClients', 'postDomains', 'putDomains', 'deleteDomains',
              'postLists', 'putLists', 'deleteInfoMessages',
              'deleteNetworkDevices', 'postActionFlushArp',
              'postActionFlushNetwork', 'postActionFlushLogs',
              'postActionRestartDns', 'getConfigElement', 'putConfigElement',
              'deleteConfigElement', 'deleteDhcpLeases',
          ]

          def match_balanced(text, start, opening, closing):
              depth = 0
              i = start
              state = 'code'
              quote = None
              triple = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'line-comment':
                      if c == '\n':
                          state = 'code'
                      i += 1
                      continue
                  if state == 'block-comment':
                      if c == '*' and n == '/':
                          state = 'code'
                          i += 2
                      else:
                          i += 1
                      continue
                  if state == 'string':
                      if triple:
                          if text.startswith(quote * 3, i):
                              state = 'code'
                              i += 3
                          else:
                              i += 1
                          continue
                      if c == '\\':
                          i += 2
                          continue
                      if c == quote:
                          state = 'code'
                      i += 1
                      continue
                  if c == '/' and n == '/':
                      state = 'line-comment'
                      i += 2
                      continue
                  if c == '/' and n == '*':
                      state = 'block-comment'
                      i += 2
                      continue
                  if c in "'\"":
                      quote = c
                      triple = text.startswith(c * 3, i)
                      state = 'string'
                      i += 3 if triple else 1
                      continue
                  if c == opening:
                      depth += 1
                  elif c == closing:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'unmatched {opening} at {start}')

          def remove_method(text, name):
              matches = list(re.finditer(
                  rf'^  (?:Future|Stream)<[^\n]+>\s+{name}\s*\(', text, re.M,
              ))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected one method, got {len(matches)}')
              start = matches[0].start()
              open_paren = text.find('(', matches[0].start(), matches[0].end())
              close_paren = match_balanced(text, open_paren, '(', ')')
              brace = text.find('{', close_paren)
              end = match_balanced(text, brace, '{', '}') + 1
              if end < len(text) and text[end] == '\n':
                  end += 1
              if name == 'postActionFlushArp':
                  annotation = (
                      "  @Deprecated(\n"
                      "    'Deprecated in Pi-hole FTL v6.3+. Use [postActionFlushNetwork] instead.',\n"
                      "  )\n"
                  )
                  if text[max(0, start - len(annotation)):start] == annotation:
                      start -= len(annotation)
              return text[:start] + text[end:]

          def remove_group(text, name):
              marker = f"  group('{name}', () {{"
              start = text.find(marker)
              if start < 0:
                  return text, False
              if text.find(marker, start + 1) >= 0:
                  raise RuntimeError(f'{name}: duplicate test group')
              open_paren = text.find('(', start)
              close_paren = match_balanced(text, open_paren, '(', ')')
              end = close_paren + 1
              while end < len(text) and text[end] in ' \t':
                  end += 1
              if end < len(text) and text[end] == ';':
                  end += 1
              if end < len(text) and text[end] == '\n':
                  end += 1
              return text[:start] + text[end:], True

          client_path = Path('lib/data/services/api/pihole_v6_api_client.dart')
          client = client_path.read_text()
          for name in methods:
              client = remove_method(client, name)
          client = client.replace(
              "import 'package:pi_hole_client/data/model/v6/action/action.dart' show Action;\n",
              '',
          )
          client = client.replace(
              "import 'package:pi_hole_client/utils/logger.dart';\n",
              '',
          )
          client = client.replace(
              "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\nimport 'package:pi_hole_client/data/model/v6/metrics/query.dart' show Queries;\n",
              "import 'package:pi_hole_client/data/model/v6/metrics/query.dart' show Queries;\nimport 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\n",
          )
          client_path.write_text(client)

          test_path = Path('test/data/services/api/pihole_v6_api_client_test.dart')
          tests = test_path.read_text()
          removed_groups = []
          for name in methods:
              tests, removed = remove_group(tests, name)
              if removed:
                  removed_groups.append(name)
          test_path.write_text(tests)

          for name in methods:
              prod_refs = []
              for path in Path('lib').rglob('*.dart'):
                  if path == client_path:
                      continue
                  if name in path.read_text():
                      prod_refs.append(str(path))
              if prod_refs:
                  raise RuntimeError(f'{name}: production references appeared: {prod_refs}')

          print(f'removed {len(methods)} unreachable client methods')
          print(f'removed {len(removed_groups)} obsolete direct-client test groups')
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Format and validate focused files
        shell: bash
        run: |
          flutter pub get
          cp .env.sample .env
          dart format lib/data/services/api/pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          dart analyze lib/data/services/api/pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          flutter test test/data/services/api/pihole_v6_api_client_test.dart
          git diff --check
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/data/services/api/pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove superseded handwritten v6 methods'
          git push origin HEAD:maintenance/remove-dead-v6-client-methods
