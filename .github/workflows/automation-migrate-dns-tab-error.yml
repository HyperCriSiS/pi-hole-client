name: automation migrate DnsTab error state
on:
  push:
    paths:
      - '.github/workflows/automation-migrate-dns-tab-error.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Migrate DnsTab error state and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/statistics/widgets/dns_tab.dart')
          s = p.read_text()
          import_line = "import 'package:pi_hole_client/ui/core/ui/components/error_message.dart';\n"
          anchor = "import 'package:pi_hole_client/ui/core/ui/components/section_label.dart';\n"
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('section_label import anchor missing')
              s = s.replace(anchor, import_line + anchor, 1)
          old = '''      errorGenerator: () => SizedBox(
        width: double.maxFinite,
        height: 300,
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const Icon(Icons.error, size: 50, color: Colors.red),
            const SizedBox(height: 50),
            Text(
              AppLocalizations.of(context)!.statsNotLoaded,
              textAlign: TextAlign.center,
              style: TextStyle(
                color: Theme.of(context).colorScheme.onSurfaceVariant,
                fontSize: 22,
              ),
            ),
          ],
        ),
      ),'''
          new = '''      errorGenerator: () => SizedBox(
        width: double.maxFinite,
        height: 300,
        child: ErrorMessage(
          message: AppLocalizations.of(context)!.statsNotLoaded,
          fontSize: 22,
          fontColor: Theme.of(context).colorScheme.onSurfaceVariant,
        ),
      ),'''
          if old not in s:
              raise SystemExit('expected DnsTab error block missing')
          p.write_text(s.replace(old, new, 1))

          r = Path('ROADMAP.md')
          roadmap = r.read_text()
          entry = '- [x] Migrate `DnsTab` statistics error state to the shared `ErrorMessage` component; `statistics_test.dart` remains green.\n'
          if entry not in roadmap:
              candidates = [
                  '- [x] Migrate `StatisticsList`',
                  '- [x] `StatisticsList`',
              ]
              lines = roadmap.splitlines(keepends=True)
              idx = next((i for i,l in enumerate(lines) if any(c in l for c in candidates)), None)
              if idx is None:
                  raise SystemExit('ROADMAP StatisticsList anchor missing')
              lines.insert(idx + 1, entry)
              r.write_text(''.join(lines))
          PY
          cp .env.sample .env
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/ui/statistics/widgets/dns_tab.dart
          flutter test test/ui/statistics/statistics_test.dart
          git diff --check
      - name: Commit verified migration
        run: |
          rm -f .github/workflows/automation-migrate-dns-tab-error.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ui/statistics/widgets/dns_tab.dart ROADMAP.md .github/workflows/automation-migrate-dns-tab-error.yml
          git commit -m 'refactor: reuse shared error state in DNS statistics'
          git push origin HEAD:dev
