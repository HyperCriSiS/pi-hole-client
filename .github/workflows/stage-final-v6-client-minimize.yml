name: Stage final v6 legacy client minimization

on:
  push:
    branches:
      - diagnostics/v6-final-client-minimize
    paths:
      - .github/workflows/stage-final-v6-client-minimize.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Remove remaining unreachable public legacy methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          methods = [
              'getAuth', 'deleteAuth', 'getAuthSessions', 'deleteAuthSession',
              'getHistory', 'getHistoryClient', 'getQueries', 'getStatsSummary',
              'getStatsUpstreams', 'getStatsTopDomains', 'getStatsTopClients',
              'getDnsBlocking', 'postDnsBlocking', 'getGroups', 'deleteGroups',
              'getClients', 'getDomains', 'getLists', 'deleteLists', 'getSearch',
              'getInfoClient', 'getInfoHost', 'getInfoMessages', 'getInfoMetrics',
              'getInfoSensors', 'getInfoSystem', 'getInfoVersion',
              'getNetworkDevices', 'patchConfig', 'getDhcpLeases',
          ]
          keep = {'postAuth', 'getInfoFtl', 'getNetworkGateway', 'postActionGravity'}

          def find_matching_brace(source: str, brace: int) -> int:
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(source):
                  c = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == quote:
                          quote = None
                  else:
                      if c in ("'", '"'):
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise RuntimeError('unclosed brace')

          def remove_method(source: str, name: str) -> str:
              m = re.search(rf'(?m)^  (?:Future|Stream)<[^\n]+>\s+{re.escape(name)}\s*\(', source)
              if m is None:
                  raise SystemExit(f'method not found: {name}')
              start = m.start()
              lines = source[:start].splitlines(keepends=True)
              while lines and lines[-1].strip().startswith('@'):
                  start -= len(lines.pop())
              body = re.search(r'\)\s+(?:async\*?|sync\*?)\s*\{', source[m.start():])
              if body is None:
                  raise SystemExit(f'body not found: {name}')
              brace = m.start() + body.end() - 1
              end = find_matching_brace(source, brace) + 1
              while end < len(source) and source[end] == '\n':
                  end += 1
              return source[:start] + source[end:]

          def remove_group(source: str, name: str) -> str:
              m = re.search(rf"(?m)^  group\('{re.escape(name)}',\s*\(\)\s*\{{", source)
              if m is None:
                  return source
              start = m.start()
              brace = source.find('{', m.start(), m.end())
              end_brace = find_matching_brace(source, brace)
              close = source.find(');', end_brace)
              if close < 0:
                  raise SystemExit(f'group close not found: {name}')
              end = close + 2
              while end < len(source) and source[end] == '\n':
                  end += 1
              return source[:start] + source[end:]

          client_path = Path('lib/data/services/api/pihole_v6_api_client.dart')
          fake_path = Path('testing/fakes/services/fake_pihole_v6_api_client.dart')
          test_path = Path('test/data/services/api/pihole_v6_api_client_test.dart')

          client = client_path.read_text()
          fake = fake_path.read_text()
          tests = test_path.read_text()
          for name in methods:
              client = remove_method(client, name)
              fake = remove_method(fake, name)
              tests = remove_group(tests, name)

          client_path.write_text(client)
          fake_path.write_text(fake)
          test_path.write_text(tests)

          public = []
          for line in client.splitlines():
              m = re.match(r'^  (?:Future|Stream)<.*>\s+([A-Za-z_]\w*)\s*\(', line)
              if m and not m.group(1).startswith('_'):
                  public.append(m.group(1))
          if set(public) != keep or len(public) != len(keep):
              raise SystemExit(f'unexpected public legacy surface: {public}')

          for name in methods:
              if re.search(rf'\b{re.escape(name)}\s*\(', fake):
                  raise SystemExit(f'stale fake method remains: {name}')
              if re.search(rf"group\('{re.escape(name)}'", tests):
                  raise SystemExit(f'stale direct client group remains: {name}')
          print('Remaining public legacy methods:', ', '.join(public))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Format and validate focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp .env.sample .env
          flutter pub get
          dart format \
            lib/data/services/api/pihole_v6_api_client.dart \
            testing/fakes/services/fake_pihole_v6_api_client.dart \
            test/data/services/api/pihole_v6_api_client_test.dart
          dart analyze \
            lib/data/services/api/pihole_v6_api_client.dart \
            testing/fakes/services/fake_pihole_v6_api_client.dart \
            test/data/services/api/pihole_v6_api_client_test.dart
          flutter test test/data/services/api/pihole_v6_api_client_test.dart
      - name: Commit only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/api/pihole_v6_api_client.dart \
            testing/fakes/services/fake_pihole_v6_api_client.dart \
            test/data/services/api/pihole_v6_api_client_test.dart
          git diff --cached --check
          git commit -m 'refactor: minimize handwritten v6 client surface'
          git push
