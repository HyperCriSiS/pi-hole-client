name: CNAME roadmap sync
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cname-roadmap-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          old = '  - [ ] Add focused v6 API/repository regression tests for reading, adding, updating and deleting CNAME records, including restart/error handling. Basic fetch/add/delete success and CRUD error paths were added in `3b9d9ac`; successful update/TTL parsing and explicit restart assertions remain before this item can be closed.'
          new = '  - [ ] Add focused v6 API/repository regression tests for reading, adding, updating and deleting CNAME records, including restart/error handling. Fetch/add/delete success and CRUD error paths are covered by `3b9d9ac`; successful update, TTL parsing/preservation and explicit DNS-restart assertions were added in `6f224932` and await the active Dart test run before this item is closed.'
          if old not in s:
              raise SystemExit('expected CNAME regression ROADMAP item not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/cname-roadmap-sync.yml
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add ROADMAP.md .github/workflows/cname-roadmap-sync.yml
          git diff --cached --check
          git commit -m 'docs: record pending CNAME regression validation'
          git push origin dev
