name: Stage roadmap uuid status sync

on:
  push:
    branches:
      - docs/record-sockjs-uuid-fix
    paths:
      - .github/workflows/stage-roadmap-uuid.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/record-sockjs-uuid-fix
      - name: Update roadmap security status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text()
          old = "- [x] Remediate all currently patchable Docusaurus/pnpm security advisories through reproducible lockfile refreshes, including the September `js-yaml`, `svgo`, `joi`, `colord`, `@swc/html`, `qs`, `postcss`, `body-parser` and `webpack-dev-server` fixes; the remaining two `image-size` high-severity advisories have no patched release and are bounded by the existing 15-minute docs-build timeout. Keep the transitive `uuid` major-version path separate rather than forcing a potentially incompatible global override."
          new = "- [x] Remediate all currently patchable Docusaurus/pnpm security advisories through reproducible lockfile refreshes, including the September `js-yaml`, `svgo`, `joi`, `colord`, `@swc/html`, `qs`, `postcss`, `body-parser` and `webpack-dev-server` fixes. The transitive `webpack-dev-server -> sockjs -> uuid` alert is also fixed with a parent-scoped `sockjs>uuid=11.1.1` override after validating SockJS CommonJS loading, `uuid.v4()`, frozen install, lint/typecheck, production build and a live Docusaurus dev-server smoke test; no global UUID override is used. The only remaining open Dependabot alerts are the two `image-size` high-severity advisories, which have no patched release and are bounded by the existing 15-minute docs-build timeout."
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -F 'sockjs>uuid=11.1.1' ROADMAP.md
      - name: Commit roadmap update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs: record scoped SockJS uuid fix'
          git push
