name: Stage docs security dependency refresh

on:
  push:
    branches:
      - maintenance/patch-docs-security-2026-09
    paths:
      - '.github/workflows/stage-docs-security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          pnpm --version
      - name: Patch overrides and regenerate lockfile
        working-directory: website
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const updates = {
            '@swc/html': '1.15.47',
            'body-parser': '1.20.6',
            'colord': '2.9.4',
            'joi': '17.13.6',
            'js-yaml': '4.3.2',
            'postcss': '8.5.23',
            'qs': '6.16.0',
            'svgo': '3.3.5',
            'webpack-dev-server': '5.2.6',
          };
          pkg.pnpm.overrides = Object.fromEntries(
            Object.entries({...pkg.pnpm.overrides, ...updates})
              .sort(([a], [b]) => a.localeCompare(b)),
          );
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Verify patched resolutions
        working-directory: website
        run: |
          set -euo pipefail
          grep -q "js-yaml@4.3.2" pnpm-lock.yaml
          grep -q "svgo@3.3.5" pnpm-lock.yaml
          grep -q "joi@17.13.6" pnpm-lock.yaml
          grep -q "colord@2.9.4" pnpm-lock.yaml
          grep -q "@swc/html@1.15.47" pnpm-lock.yaml
          grep -q "qs@6.16.0" pnpm-lock.yaml
          grep -q "postcss@8.5.23" pnpm-lock.yaml
          grep -q "body-parser@1.20.6" pnpm-lock.yaml
          grep -q "webpack-dev-server@5.2.6" pnpm-lock.yaml
      - name: Build docs
        working-directory: website
        run: timeout 15m pnpm build
      - name: Commit regenerated dependency files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/package.json website/pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'chore(docs): patch vulnerable transitive dependencies'
          git push
