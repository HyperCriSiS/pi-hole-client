name: Temporary #397 validation

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-397.yaml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused desktop autocomplete fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('lib/ui/core/ui/components/auto_complate_field.dart')
          text = component.read_text()
          old = """                  // Suggestions list
                  _buildSuggestions(items),
"""
          new = """                  // Keep desktop mouse interactions with suggestions and their
                  // scrollbar inside the text field's tap group.
                  TextFieldTapRegion(child: _buildSuggestions(items)),
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one autocomplete suggestions block, found {text.count(old)}')
          component.write_text(text.replace(old, new, 1))

          test = Path('test/widgets/components/auto_complete_field_test.dart')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''import 'dart:ui' show PointerDeviceKind;

import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:pi_hole_client/ui/core/ui/components/auto_complate_field.dart';

void main() {
  testWidgets(
    'mouse tap on a suggestion selects it without premature focus loss',
    (tester) async {
      final controller = TextEditingController();
      addTearDown(controller.dispose);

      await tester.pumpWidget(
        MaterialApp(
          home: Scaffold(
            body: Center(
              child: SizedBox(
                width: 400,
                child: AutoCompleteField<String>(
                  items: const ['192.168.1.10', '192.168.1.20'],
                  controller: controller,
                  onChanged: (_) {},
                  textOf: (item) => item,
                  labelText: 'IP Address',
                  isAnimated: false,
                ),
              ),
            ),
          ),
        ),
      );

      await tester.tap(
        find.byType(TextField),
        kind: PointerDeviceKind.mouse,
      );
      await tester.pump();
      expect(find.text('192.168.1.10'), findsOneWidget);

      await tester.tap(
        find.text('192.168.1.10'),
        kind: PointerDeviceKind.mouse,
      );
      await tester.pumpAndSettle();

      expect(controller.text, '192.168.1.10');
      expect(find.text('192.168.1.20'), findsNothing);
    },
  );

  testWidgets('mouse tap outside still dismisses suggestions', (tester) async {
    final controller = TextEditingController();
    addTearDown(controller.dispose);

    await tester.pumpWidget(
      MaterialApp(
        home: Scaffold(
          body: Column(
            children: [
              SizedBox(
                width: 400,
                child: AutoCompleteField<String>(
                  items: const ['192.168.1.10', '192.168.1.20'],
                  controller: controller,
                  onChanged: (_) {},
                  textOf: (item) => item,
                  labelText: 'IP Address',
                  isAnimated: false,
                ),
              ),
              const TextButton(onPressed: null, child: Text('Outside')),
            ],
          ),
        ),
      ),
    );

    await tester.tap(
      find.byType(TextField),
      kind: PointerDeviceKind.mouse,
    );
    await tester.pump();
    expect(find.text('192.168.1.10'), findsOneWidget);

    await tester.tap(find.text('Outside'), kind: PointerDeviceKind.mouse);
    await tester.pump();

    expect(find.text('192.168.1.10'), findsNothing);
  });
}
''')
          PY

          dart format \
            lib/ui/core/ui/components/auto_complate_field.dart \
            test/widgets/components/auto_complete_field_test.dart

      - name: Run focused tests
        run: |
          flutter test test/widgets/components/auto_complete_field_test.dart
          flutter test test/widgets/screens/settings/server_settings/advanced_settings/local_dns_screen_test.dart

      - name: Validate diff
        run: git diff --check

      - name: Update roadmap after successful validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          lines = roadmap.read_text().splitlines()
          matches = [
              i for i, line in enumerate(lines)
              if '#397' in line and '- [ ]' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one open #397 checkbox, found {len(matches)}')

          index = matches[0]
          lines[index] = lines[index].replace('- [ ]', '- [x]', 1)
          evidence = (
              '  - Verifiziert: Die gemeinsame `AutoCompleteField`-Komponente hält '
              'Mausinteraktionen mit Vorschlägen und deren Scrollbar via '
              '`TextFieldTapRegion` in derselben Tap-Gruppe; fokussierter Mouse-Regressionstest '
              'und Local-DNS-Widgettests erfolgreich.'
          )
          lines.insert(index + 1, evidence)

          for i, line in enumerate(lines):
              lowered = line.lower()
              if '#397' in line and ('nächster' in lowered or 'next' in lowered):
                  lines[i] = line.replace('#397', '#442')

          roadmap.write_text('\n'.join(lines) + '\n')
          PY

          echo '--- ROADMAP #397/#442 after validation ---'
          grep -n -E '#397|#442|Abschlussstatus|abschlussstatus' ROADMAP.md || true
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/ui/core/ui/components/auto_complate_field.dart \
            test/widgets/components/auto_complete_field_test.dart \
            ROADMAP.md
          git commit -m 'fix: preserve autocomplete focus on desktop'
          git push origin HEAD:dev
