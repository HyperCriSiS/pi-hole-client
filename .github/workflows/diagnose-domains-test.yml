name: Diagnose full Dart suite without coverage

on:
  push:
    branches:
      - roadmap/generated-path-encoding

permissions:
  contents: read

jobs:
  full-no-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Get dependencies
        run: flutter pub get
      - name: Copy .env file
        run: cp .env.sample .env
      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart
      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run full coverage tool
        run: dart run full_coverage
      - name: Run full suite without coverage
        run: xvfb-run flutter test --reporter expanded
