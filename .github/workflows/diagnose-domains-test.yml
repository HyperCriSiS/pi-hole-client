name: Diagnose changed path migration tests

on:
  push:
    branches:
      - roadmap/generated-path-encoding

permissions:
  contents: read

jobs:
  changed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Get dependencies
        run: flutter pub get
      - name: Copy .env file
        run: cp .env.sample .env
      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart
      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run changed migration tests with default concurrency
        run: |
          xvfb-run flutter test \
            test/data/repositories/api/v6/cname_repository_contract_test.dart \
            test/data/repositories/api/v6/local_dns_repository_generated_retry_test.dart \
            test/data/repositories/api/v6/local_dns_repository_test.dart \
            test/data/services/api/generated/v6_path_encoding_test.dart \
            --reporter expanded
