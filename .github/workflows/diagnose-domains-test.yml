name: Diagnose UI test suite

on:
  push:
    branches:
      - roadmap/generated-path-encoding

permissions:
  contents: read

jobs:
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-domains
            paths: test/ui/app_logs test/ui/core test/ui/domains
          - name: home-logs
            paths: test/ui/home test/ui/logs
          - name: servers-settings
            paths: test/ui/servers test/ui/settings
          - name: shell-statistics
            paths: test/ui/shell test/ui/statistics
    name: ui-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Get dependencies
        run: flutter pub get
      - name: Copy .env file
        run: cp .env.sample .env
      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart
      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run UI group with coverage and default concurrency
        run: xvfb-run flutter test ${{ matrix.paths }} --coverage --reporter expanded
