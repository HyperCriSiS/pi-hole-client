name: Diagnose full Dart suite serially

on:
  push:
    branches:
      - roadmap/generated-path-encoding

permissions:
  contents: read

jobs:
  serial-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y lcov libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Get dependencies
        run: flutter pub get
      - name: Copy .env file
        run: cp .env.sample .env
      - name: Validate mock API server package
        working-directory: mock_api_server
        run: |
          dart pub get
          dart analyze
      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart
      - name: Generate files
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format .
          dart analyze
      - name: Run full coverage tool
        run: dart run full_coverage
      - name: Run full suite serially
        run: xvfb-run flutter test --coverage --concurrency=1 --reporter expanded
