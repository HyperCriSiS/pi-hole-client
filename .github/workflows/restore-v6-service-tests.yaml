name: Restore v6 service regression coverage

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/restore-v6-service-tests.yaml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore previous service test coverage and add SID assertion
        shell: bash
        run: |
          git checkout 8a0e3cb5972cfbd58a1e1d557ce6700f60e4d99e -- test/data/services/api/wrappers/pihole_v6_service_test.dart
          python - <<'PY'
          from pathlib import Path

          path = Path('test/data/services/api/wrappers/pihole_v6_service_test.dart')
          content = path.read_text()
          needle = """    service = PiholeV6Service(api: mockApi);\n  });\n\n"""
          replacement = """    service = PiholeV6Service(api: mockApi);\n  });\n\n  test('setSid configures the generated x_header_sid API key', () {\n    service.setSid('sid-123');\n\n    verify(mockApi.setApiKey('x_header_sid', 'sid-123')).called(1);\n  });\n\n"""
          if content.count(needle) != 1:
              raise SystemExit('Expected service setup anchor exactly once')
          path.write_text(content.replace(needle, replacement))
          PY

      - name: Commit restored test coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/data/services/api/wrappers/pihole_v6_service_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: restore generated service regression coverage"
          git push origin HEAD:dev
