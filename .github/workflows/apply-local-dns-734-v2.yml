name: Apply Local DNS 734 port v2
on:
  push:
    branches: [feat/local-dns-multi-hostnames]
    paths: [.github/workflows/apply-local-dns-734-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply corrected transform
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/apply-local-dns-734.yml").read_text()
          begin = "          python3 <<'PY'\n"
          end = "\n          PY\n\n      - name: Set up Flutter"
          if source.count(begin) != 1 or source.count(end) != 1:
              raise SystemExit("could not locate transform script")
          script = source.split(begin, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace(r"\\\\.", r"\\.").replace(r"\\\\s+", r"\\s+")
          compile(script, "<local-dns-734-transform>", "exec")
          exec(script, {})
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Generate localizations and format
        shell: bash
        run: |
          flutter gen-l10n
          dart format \
            lib/utils/validators.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/add_local_dns_modal.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/edit_local_dns_modal.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_screen.dart \
            test/utils/validators_test.dart \
            test/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel_test.dart \
            test/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_widgets_test.dart
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_TRIAGE.md lib test
          git commit -m "feat(local-dns): support multiple hostnames and duplicates"
          git push origin "HEAD:$GITHUB_REF_NAME"
