name: Stage image-size package inspection

on:
  push:
    branches:
      - maintenance/harden-image-size-dos
    paths:
      - .github/workflows/stage-image-size-inspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.30.1 --activate
      - name: Install frozen graph
        run: pnpm install --frozen-lockfile
      - name: Extract published image-size package for patching
        run: |
          rm -rf .pnpm-patch
          pnpm patch image-size@2.0.2 --edit-dir .pnpm-patch/image-size
          echo '--- files ---'
          find .pnpm-patch/image-size -maxdepth 3 -type f -print | sort
          echo '--- zero/progress candidates ---'
          grep -R -n -E 'imageOffset|currentOffset|jxlpBox|box\.size|fileLength' .pnpm-patch/image-size/dist | head -n 160 || true
