name: Temporary v6 filter repository fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/tmp-v6-filter-repository-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch repository compatibility and fake client
        shell: python
        run: |
          from pathlib import Path
          import re

          metrics = Path('lib/data/repositories/api/v6/metrics_repository.dart')
          text = metrics.read_text()
          old = '''    int? cursor,\n    V6QueryFilter? filter,\n'''
          new = '''    int? cursor,\n    int? start,\n    V6QueryFilter? filter,\n'''
          if old not in text:
              raise SystemExit('MetricsRepositoryV6 signature pattern not found')
          text = text.replace(old, new, 1)
          old = '''          cursor: cursor,\n          filter: filter,\n'''
          new = '''          cursor: cursor,\n          start: start,\n          filter: filter,\n'''
          if old not in text:
              raise SystemExit('MetricsRepositoryV6 forwarding pattern not found')
          metrics.write_text(text.replace(old, new, 1))

          fake = Path('testing/fakes/services/fake_pihole_v6_api_client.dart')
          text = fake.read_text()
          query_filter_import = "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\n"
          if query_filter_import not in text:
              marker = "import 'package:pi_hole_client/data/services/api/pihole_v6_api_client.dart';\n"
              if marker not in text:
                  matches = list(re.finditer(r"import 'package:pi_hole_client/data/model/v6/metrics/[^']+';\n", text))
                  if not matches:
                      raise SystemExit('Could not locate an import insertion point in fake client')
                  match = matches[-1]
                  text = text[:match.end()] + query_filter_import + text[match.end():]
              else:
                  text = text.replace(marker, query_filter_import + marker, 1)

          method = re.compile(
              r'(Future<Result<Queries>>\s+getQueries\(\s*String sid,\s*\{.*?\n\s*int\? start,)(\s*\n\s*\}\)\s+async\s*\{)',
              re.S,
          )
          match = method.search(text)
          if not match:
              raise SystemExit('FakePiholeV6ApiClient.getQueries signature pattern not found')
          if 'V6QueryFilter? filter' not in match.group(0):
              replacement = match.group(1) + '\n    V6QueryFilter? filter,' + match.group(2)
              text = text[:match.start()] + replacement + text[match.end():]
          fake.write_text(text)

      - name: Prepare test environment
        run: |
          if [ ! -f .env ]; then
            printf 'SENTRY_DSN=\n' > .env
          fi
          flutter pub get
      - name: Run focused v6 filter regression suite
        run: >-
          flutter test
          test/data/model/v6/metrics/query_filter_test.dart
          test/data/repositories/api/v6/metrics_repository_test.dart
          test/data/services/api/pihole_v6_api_client_test.dart
      - name: Update roadmap after successful validation
        shell: python
        run: |
          from pathlib import Path
          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          old = '- [ ] Thread `V6QueryFilter` through `MetricsRepositoryV6` and map the Logs screen\'s existing v6 filter state to server-side request filters with parity/regression tests.'
          new = '''- [x] Thread `V6QueryFilter` through `MetricsRepositoryV6` while preserving the shared pagination contract (`start` included); focused v6 model/repository/API regression tests validate the integration.\n- [ ] Map the Logs screen's existing v6 filter state to server-side request filters, pushing only semantically equivalent filters and retaining client-side handling for complex/multi-value cases; add parity/regression tests.'''
          if old not in text:
              raise SystemExit('Expected ROADMAP v6 filter progress line not found')
          roadmap.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-v6-filter-repository-fix.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add lib/data/repositories/api/v6/metrics_repository.dart testing/fakes/services/fake_pihole_v6_api_client.dart ROADMAP.md .github/workflows/tmp-v6-filter-repository-fix.yml
          git diff --cached --check
          git commit -m 'fix: preserve v6 query pagination contract'
          git push origin dev
