name: Validate DnsTab cleanup
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Revert validation side effects and sync roadmap
        shell: bash
        run: |
          git checkout 024b8d4618d975840a197179ea55ebbda30a29a7^ -- analysis_options.yaml pubspec.lock
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          old = '- [ ] Migrate the next verified duplicated statistics error state (`DnsTab`) to `ErrorMessage` and keep the statistics regression suite green.'
          new = '- [ ] Migrate the next verified duplicated statistics error state (`StatisticsQueriesServersTab`) to `ErrorMessage` and keep the statistics regression suite green.'
          if old not in s:
              raise SystemExit('stale DnsTab roadmap line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cp .env.sample .env
          flutter pub get
          flutter test test/ui/statistics/statistics_test.dart
          git checkout -- pubspec.lock
          git diff --check
      - name: Commit verified cleanup
        shell: bash
        run: |
          rm -f .github/workflows/automation-clean-dns-tab-side-effects.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean DnsTab validation side effects'
          git push origin HEAD:dev
