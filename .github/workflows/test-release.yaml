name: Compile and release test build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'UPSTREAM_TRIAGE.md'
      - 'test/**'
      - 'testing/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'UPSTREAM_TRIAGE.md'
      - 'test/**'
      - 'testing/**'
  workflow_dispatch:

# Release validation can be expensive; superseded PR runs should not keep consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  get-version:
    name: Extract Version from pubspec.yaml
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-v')
    outputs:
      VERSION_NAME: ${{ steps.extract_version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ steps.extract_version.outputs.VERSION_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION_FULL | cut -d '+' -f 1)
          VERSION_NUMBER=$(echo $VERSION_FULL | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "Extracted Version Name: $VERSION_NAME"
          echo "Extracted Version Number: $VERSION_NUMBER"

  build-android:
    name: Build test Android .apk and .aab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: get-version
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
      ANDROID_AAB_RELEASE_PATH: build/app/outputs/bundle/release
      ANDROID_APK_RELEASE_PATH: build/app/outputs/apk/release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - run: flutter clean
      - run: flutter pub get

      - name: Copy .env file
        run: cp .env.sample .env

      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_JKS_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: mv $ANDROID_APK_RELEASE_PATH/app-release.apk PiHoleClient_${{ env.VERSION_NAME }}_Android.apk

      - name: Rename AAB
        run: mv $ANDROID_AAB_RELEASE_PATH/app-release.aab PiHoleClient_${{ env.VERSION_NAME }}_Android.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            PiHoleClient_${{ env.VERSION_NAME }}_Android.apk
            PiHoleClient_${{ env.VERSION_NAME }}_Android.aab

  build-android-source:
    name: Build unsigned Android source APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Audit Android package identity
        run: bash tools/identity/audit_android_identity.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - run: flutter clean
      - run: flutter pub get

      - name: Verify lockfile stability
        run: git diff --exit-code -- pubspec.lock

      - name: Copy .env file
        run: cp .env.sample .env

      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Remove release signing overrides
        run: |
          rm -f android/key.properties android/app/keystore.jks

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Verify unsigned release artifact
        run: |
          APK="$(find build/app/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          # apksigner reports signer count 0 for an unsigned APK.
          SIGNERS="$(apksigner verify --print-certs "$APK" 2>&1 || true)"
          if echo "$SIGNERS" | grep -q '^Signer #'; then
            echo "::error::Source-build APK is signed; expected an unsigned release artifact."
            exit 1
          fi

          echo "Verified unsigned release APK: $APK"

  test-build-google-play:
    name: Release Android test build to the Google Play Store
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Release app to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.tsutsu3.pi_hole_client
          releaseFiles: PiHoleClient_${{ env.VERSION_NAME }}_Android.aab
          track: internal
          status: completed

  bump-version:
    name: Bump version for production release
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    if: startsWith(github.head_ref, 'release-v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version in pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.get-version.outputs.VERSION_NAME }}+${{ needs.get-version.outputs.VERSION_NUMBER }}/" pubspec.yaml

      - name: Commit and push version bump
        run: |
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: bump version to ${{ needs.get-version.outputs.VERSION_NAME }}+${{ needs.get-version.outputs.VERSION_NUMBER }}"
            git push origin HEAD:${{ github.head_ref }}
          fi
