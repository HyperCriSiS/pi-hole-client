name: Test release

on:
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'UPSTREAM_TRIAGE.md'
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'UPSTREAM_TRIAGE.md'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Copy .env.sample
        run: cp .env.sample .env

      - name: Generate git commit
        run: dart run tools/generate_git_commit.dart

      - name: Build Linux
        run: flutter build linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Copy .env.sample
        shell: bash
        run: cp .env.sample .env

      - name: Generate git commit
        run: dart run tools/generate_git_commit.dart

      - name: Build Windows
        run: flutter build windows

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Copy .env.sample
        run: cp .env.sample .env

      - name: Generate git commit
        run: dart run tools/generate_git_commit.dart

      - name: Build Android
        run: flutter build apk --debug

  build-android-source:
    name: Build unsigned Android source APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test Android identity migration helper
        run: python3 tools/identity/test_migrate_android_identity.py

      - name: Test F-Droid application ID collision helper
        run: python3 tools/identity/test_check_fdroid_appid_collision.py

      - name: Audit Android package identity
        run: bash tools/identity/audit_android_identity.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Copy .env.sample
        run: cp .env.sample .env

      - name: Generate git commit
        run: dart run tools/generate_git_commit.dart

      - name: Prepare F-Droid source build
        run: dart run tools/prepare_fdroid_source_build.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned Android release APK
        run: flutter build apk --release

      - name: Verify APK is unsigned
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          if apksigner verify "$APK"; then
            echo "Expected unsigned APK, but apksigner accepted a signature." >&2
            exit 1
          fi

  release-google-play:
    name: Release to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Copy .env.sample
        run: cp .env.sample .env

      - name: Generate git commit
        run: dart run tools/generate_git_commit.dart

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Release app to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.tsutsu3.pi_hole_client
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
