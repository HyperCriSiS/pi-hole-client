name: automation inspect statistics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show StatisticsList and focused test
        shell: bash
        run: |
          echo '=== statistics_list.dart ==='
          sed -n '1,260p' lib/ui/statistics/widgets/statistics_list.dart
          echo '=== statistics_test.dart ==='
          sed -n '1,320p' test/ui/statistics/statistics_test.dart
          echo '=== shared error widget imports ==='
          grep -R -n "ErrorMessage" lib/ui | head -80
