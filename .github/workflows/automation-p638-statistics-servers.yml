name: automation #638 statistics servers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect and migrate duplicated error state
        shell: bash
        run: |
          set -euo pipefail
          cp .env.sample .env
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/statistics/widgets/statistics_queries_servers_tab.dart')
          s = p.read_text()
          print(s)
          if "ErrorMessage" not in s:
              # Add shared widget import near other core widget imports.
              lines = s.splitlines()
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      insert_at = i + 1
              lines.insert(insert_at, "import 'package:pi_hole_client/ui/core/widgets/error_message.dart';")
              s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          # Replace common duplicated Column/Icon/Text error layout conservatively.
          import re
          patterns = [
              r"Column\(\s*mainAxisAlignment:\s*MainAxisAlignment\.center,\s*children:\s*\[\s*Icon\(Icons\.error[^\)]*\),\s*const SizedBox\([^\)]*\),\s*Text\(([^,\n]+),[^\)]*\)\s*,?\s*\]\s*\)",
              r"Center\(\s*child:\s*Column\(\s*mainAxisAlignment:\s*MainAxisAlignment\.center,\s*children:\s*\[\s*Icon\(Icons\.error[^\)]*\),\s*[^\[]*?Text\(([^,\n]+),[^\)]*\)\s*,?\s*\]\s*\)\s*\)"
          ]
          original = s
          for pat in patterns:
              s2, n = re.subn(pat, lambda m: f"ErrorMessage(message: {m.group(1).strip()})", s, count=1, flags=re.S)
              if n:
                  s = s2
                  break
          if s == original:
              raise SystemExit('Could not identify duplicated error layout safely')
          p.write_text(s)
          PY
          dart format lib/ui/statistics/widgets/statistics_queries_servers_tab.dart
          flutter pub get
          flutter test test/ui/statistics/statistics_test.dart
          git diff --check
          git diff -- lib/ui/statistics/widgets/statistics_queries_servers_tab.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/statistics/widgets/statistics_queries_servers_tab.dart
          git commit -m 'refactor: reuse shared error state in query servers tab'
          git push origin HEAD:dev
