name: Stage roadmap status sync

on:
  push:
    branches:
      - docs/sync-roadmap-v6-boundary
    paths:
      - .github/workflows/stage-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sync-roadmap-v6-boundary
      - name: Sync roadmap and upstream triage
        run: |
          python - <<'PY'
          from pathlib import Path

          road_path = Path('ROADMAP.md')
          tri_path = Path('UPSTREAM_TRIAGE.md')
          road = road_path.read_text()
          tri = tri_path.read_text()

          old = '- [ ] #639 / #352: incrementally improve Pi-hole v6 API support and server-side log filtering with parity tests; retain handwritten transport only for explicit compatibility/schema/behavior gaps that the generated client cannot yet preserve.'
          new = '- [ ] #639: incrementally improve Pi-hole v6 API support with parity tests; retain handwritten transport only for explicit compatibility/schema/behavior gaps that the generated client cannot yet preserve.'
          assert old in road
          road = road.replace(old, new, 1)

          anchor = "  - [x] Push exactly one active client selection server-side: valid IPv4/IPv6 literals use `client_ip`, while a hostname uses FTL's exact `client_name` parameter. The all-selected state and multi-client selections remain client-side; focused model/repository/ViewModel regression coverage preserves that boundary."
          assert anchor in road
          road = road.replace(anchor, anchor + "\n  - [x] Complete #352 for the current Logs UI's semantically safe server-side scope: time bounds, exact domain, one concrete status, and exactly one active client are pushed to FTL; free-text substring search and multi/grouped selections intentionally remain local because the API does not offer semantically equivalent filters, and the current UI has no independent `type`/`reply` state.", 1)

          old = '- [x] Enforce that bounded handwritten-v6 boundary in CI: only Actions (gravity streaming), FTL compatibility and detailed Network may receive the legacy `PiholeV6ApiClient`; `V6SessionCache`/`V6SessionCacheStore` retain only their nullable compatibility test seam while production factory wiring is asserted to bind the generated service. The path-filtered architecture audit fails if the legacy client boundary expands again.'
          new = '- [x] Enforce that bounded handwritten-v6 boundary in CI: only Actions (gravity streaming), FTL compatibility and detailed Network may receive the legacy `PiholeV6ApiClient`; `V6SessionCache`/`V6SessionCacheStore` retain only their nullable compatibility test seam while production factory wiring is asserted to bind the generated service. The audit also locks the legacy client\'s public surface to lifecycle `close()` plus `postAuth`, `getInfoFtl`, `getNetworkGateway` and `postActionGravity`, so removed handwritten endpoints cannot silently return.'
          assert old in road
          road = road.replace(old, new, 1)

          old = '- [x] Remediate all currently patchable Docusaurus/pnpm high-severity Dependabot alerts through updates generated from the current `main` dependency graph; the remaining two `image-size` high-severity advisories have no patched release and are bounded by the existing 15-minute docs-build timeout.'
          new = '- [x] Remediate all currently patchable Docusaurus/pnpm security advisories through reproducible lockfile refreshes, including the September `js-yaml`, `svgo`, `joi`, `colord`, `@swc/html`, `qs`, `postcss`, `body-parser` and `webpack-dev-server` fixes; the remaining two `image-size` high-severity advisories have no patched release and are bounded by the existing 15-minute docs-build timeout. Keep the transitive `uuid` major-version path separate rather than forcing a potentially incompatible global override.'
          assert old in road
          road = road.replace(old, new, 1)

          old = 'A path-filtered architecture guard now prevents the handwritten-client boundary from expanding beyond the documented holds. Remaining handwritten production transport is limited to `/api/info/ftl`, detailed `/api/network/gateway`, and gravity streaming because of documented compatibility/schema/behavior blockers. #352 now pushes exact domain, single concrete status, one literal client IP, or one hostname (`client_name`) server-side while multi-value/grouped filters remain local.'
          new = "A path-filtered architecture guard now prevents both the handwritten-client consumer boundary and its public method surface from expanding beyond the documented holds. Remaining handwritten production transport is limited to `/api/info/ftl`, detailed `/api/network/gateway`, and gravity streaming because of documented compatibility/schema/behavior blockers. #352 is complete for the current Logs UI's semantically safe server-side scope: time bounds, exact domain, one concrete status, one literal client IP, or one hostname (`client_name`) are server-side where applicable, while substring and multi/grouped filters remain local to preserve semantics."
          assert old in road
          road = road.replace(old, new, 1)

          lines = tri.splitlines()
          out = []
          for line in lines:
              if line.startswith('| #639 | Pi-hole v6 API |'):
                  line = "| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration covers the parity-verified info paths including `/api/info/client`, history/stats, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions including the pre-v6.3 network→ARP fallback, DHCP, DNS blocking, DNS query-logging config reads, complete Local DNS/CNAME config CRUD, and all auth/session transport. The unauthenticated auth capability probe uses an isolated generated transport without mutating shared SID state; generated `POST /auth` session creation/renewal preserves TOTP through an isolated compatibility interceptor because pinned FTL v6.7 omits TOTP from the request schema. The generated client is reproducibly refreshed to pinned FTL v6.7 (`fa65a88f8cdef1013594d4de14108077954faea4`) with pinned Redocly/OpenAPI Generator tooling, deterministic formatting and URI-component-safe generated path parameters. CI now enforces both dimensions of the handwritten boundary: only Actions, FTL and detailed Network may receive `PiholeV6ApiClient`, and the legacy client's public surface is fixed to lifecycle `close()` plus `postAuth`, `getInfoFtl`, `getNetworkGateway` and `postActionGravity`. Production keeps only `/api/info/ftl`, detailed network gateway and gravity streaming handwritten; `postAuth` remains solely as the nullable session-cache compatibility test seam. The three production holds remain justified because the FTL counter union is absent from the schema, generated gateway/interface models lose detailed interface/route fields required by the app, and gravity's generated endpoint does not preserve the current streaming progress contract. |"
              elif line.startswith('| #352 | v6 server-side log filtering |'):
                  line = "| #352 | v6 server-side log filtering | **Implemented for the current UI's semantically safe server-side scope in `main`.** v6 query-log requests send their time bounds and push exact domain, one concrete status, and exactly one active client selection (`client_ip` for IPv4/IPv6 literals or `client_name` for a hostname) server-side. Free-text substring search, multi-status/grouped selections and multiple/all-selected clients remain local because FTL has no semantically equivalent filter for those states; the current Logs UI exposes no independent `type` or `reply` filter state. v5 remains fully local. |"
              elif line.startswith('6. #639/#352:'):
                  line = "6. #639 generated-v6 migration remains active on `main`; #352 is complete for the current UI's semantically safe server-side scope. The reproducibly pinned FTL v6.7 snapshot uses deterministic formatting and URI-component-safe generated path parameters, and CI guards both legacy-client consumers and the public legacy method surface from expanding. Only `/api/info/ftl`, detailed network gateway and gravity streaming remain production compatibility/schema/behavior holds. #570 is complete with generated v6 Local DNS/CNAME CRUD. #134 source-build work and the identity migration helper are CI-validated, but downstream submission remains blocked on choosing the required independent-fork product identity."
              out.append(line)
          tri = '\n'.join(out) + '\n'

          road_path.write_text(road)
          tri_path.write_text(tri)
          PY
      - name: Verify expected status markers
        run: |
          grep -F "Complete #352 for the current Logs UI's semantically safe server-side scope" ROADMAP.md
          grep -F "public surface to lifecycle \`close()\` plus \`postAuth\`" ROADMAP.md
          grep -F "Implemented for the current UI's semantically safe server-side scope" UPSTREAM_TRIAGE.md
          grep -F "Only \`/api/info/ftl\`, detailed network gateway and gravity streaming remain" UPSTREAM_TRIAGE.md
      - name: Commit synchronized docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md UPSTREAM_TRIAGE.md
          git diff --cached --check
          git commit -m 'docs: sync v6 roadmap and triage status'
          git push
