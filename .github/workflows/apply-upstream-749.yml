name: Apply upstream widget server-sync fix

on:
  push:
    branches:
      - upstream/widget-server-sync-20260925

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/widget-server-sync-20260925

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply selective upstream #749 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/749.patch <<'PATCH'
--- a/android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/MainActivity.kt
