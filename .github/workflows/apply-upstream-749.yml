name: Apply upstream widget server-sync fix

on:
  push:
    branches:
      - upstream/widget-server-sync-20260925

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/widget-server-sync-20260925
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply production and Dart regression hunks from upstream #749
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit=862a3c1959cfaf84e456ac9d3daa2ddc8b4865cb
          git fetch --no-tags https://github.com/tsutsu3/pi-hole-client.git "$upstream_commit"
          git diff "$upstream_commit^" "$upstream_commit" --             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/MainActivity.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/data/WidgetPrefs.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerBlockingStatusWorker.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerPaddWorker.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerToggleWorker.kt             lib/ui/core/view_models/servers_viewmodel.dart             lib/utils/widget_channel.dart             test/ui/core/view_models/servers_viewmodel_test.dart             > /tmp/upstream-749.patch
          git apply --3way /tmp/upstream-749.patch

      - name: Add fork-compatible widget platform test hook
        shell: python
        run: |
          from pathlib import Path
          path = Path("lib/utils/widget_channel.dart")
          text = path.read_text()
          if "debugIsSupportedOverride" not in text:
              text = text.replace(
                  "import 'dart:io';\n\nimport 'package:flutter/services.dart';",
                  "import 'dart:io';\n\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter/services.dart';",
                  1,
              )
              text = text.replace(
                  "  static bool _isSupported() => Platform.isAndroid;",
                  "  @visibleForTesting\n"
                  "  static bool? debugIsSupportedOverride;\n\n"
                  "  static bool _isSupported() => debugIsSupportedOverride ?? Platform.isAndroid;",
                  1,
              )
          if "debugIsSupportedOverride" not in text:
              raise SystemExit("could not add WidgetChannel test hook")
          path.write_text(text)

      - name: Validate selective port
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          cp .env.sample .env
          dart format lib/ui/core/view_models/servers_viewmodel.dart lib/utils/widget_channel.dart test/ui/core/view_models/servers_viewmodel_test.dart
          flutter test test/ui/core/view_models/servers_viewmodel_test.dart
          cd android
          ./gradlew :app:compileDebugKotlin

      - name: Commit port and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-upstream-749.yml
          git add             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/MainActivity.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/data/WidgetPrefs.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerBlockingStatusWorker.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerPaddWorker.kt             android/app/src/main/kotlin/io/github/tsutsu3/pi_hole_client/widget/worker/ServerToggleWorker.kt             lib/ui/core/view_models/servers_viewmodel.dart             lib/utils/widget_channel.dart             test/ui/core/view_models/servers_viewmodel_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(widget): keep widgets synced with server changes"
          git push origin HEAD:upstream/widget-server-sync-20260925
