name: Temporary v6 client filter inspection

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-v6-log-filter-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect client filter state
        run: |
          echo '===== LogsViewModel client references ====='
          grep -n -E -A6 -B6 'client|Client' lib/ui/logs/view_models/logs_viewmodel.dart | head -n 260
          echo '===== Filters v6 ====='
          cat lib/ui/logs/view_models/filters/filters_v6.dart
          echo '===== Client filter widget ====='
          cat lib/ui/logs/widgets/clients_filters_modal.dart
          echo '===== Relevant test helpers ====='
          grep -n -E -A8 -B8 'client|Client|applyFilterAndLoad|_buildVm' test/ui/logs/view_models/logs_viewmodel_test.dart | head -n 420
