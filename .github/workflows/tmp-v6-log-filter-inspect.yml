name: Temporary v6 client filter inspection

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-v6-log-filter-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect IP validation helpers
        run: |
          grep -RInE 'InternetAddress|IPv4|IPv6|isIp|isIP|ipAddress|validate.*ip|RegExp.*[Ii][Pp]' lib test | head -n 400 || true
          echo '===== pubspec environment ====='
          grep -n -A8 '^environment:' pubspec.yaml
          echo '===== workflow list ====='
          ls .github/workflows
