name: Temporary v6 log filter inspection

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-v6-log-filter-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect pagination and view model
        shell: bash
        run: |
          echo '=== logs_pagination_service_test.dart ==='
          cat test/domain/services/logs_pagination_service_test.dart
          echo '=== logs_viewmodel imports + reset calls ==='
          sed -n '1,90p' lib/ui/logs/view_models/logs_viewmodel.dart
          grep -n -A10 -B10 '_paginationService.*reset' lib/ui/logs/view_models/logs_viewmodel.dart
