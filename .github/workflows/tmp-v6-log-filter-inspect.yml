name: Temporary v6 client filter inspection
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/tmp-v6-log-filter-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          grep -n -E -A12 -B12 'clientSelected|selectedClient|ClientSelected|setClient|clientFilter|clientsFilter|totalClients|_clients|clients' lib/ui/logs/view_models/logs_viewmodel.dart | head -n 700
          echo '===== filters interface/v6 ====='
          grep -n -E -A12 -B12 'client|Client' lib/ui/logs/view_models/filters/filters_interface.dart lib/ui/logs/view_models/filters/filters_v6.dart | head -n 700
