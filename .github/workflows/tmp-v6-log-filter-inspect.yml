name: Temporary v6 log filter inspection

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-v6-log-filter-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant sources
        shell: bash
        run: |
          echo '=== ROADMAP.md ==='
          cat ROADMAP.md
          echo '=== query_filter.dart ==='
          cat lib/data/model/v6/metrics/query_filter.dart
          echo '=== metrics_repository_v6 fetchQueries ==='
          grep -R -n -A40 -B10 'Future.*fetchQueries' lib/data/repositories/api/v6 || true
          echo '=== metrics_repository_v5 fetchQueries ==='
          grep -R -n -A35 -B10 'Future.*fetchQueries' lib/data/repositories/api/v5 || true
          echo '=== query status model ==='
          cat lib/domain/model/query_status.dart
          echo '=== query types/status definitions ==='
          sed -n '1,260p' lib/domain/model/query_types.dart
          echo '=== LogsViewModel core ==='
          sed -n '1,620p' lib/ui/logs/view_models/logs_viewmodel.dart
          echo '=== Logs pagination tests ==='
          cat test/domain/services/logs_pagination_service_test.dart
          echo '=== LogsViewModel filter-related tests ==='
          grep -n -A35 -B20 -E 'setSelectedDomain|setSelectedClients|setStatusSelected|applyFilterAndLoad|RequestStatus' test/ui/logs/view_models/logs_viewmodel_test.dart || true
          echo '=== MetricsRepository implementations/fakes ==='
          grep -R -l 'implements MetricsRepository' lib test | sort
