name: Temporary v6 client filter inspection
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/tmp-v6-log-filter-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          grep -n -A20 -B20 "lastFilter" test/ui/logs/view_models/logs_viewmodel_test.dart || true
          grep -n -A30 -B20 "_buildServerQueryFilter" lib/ui/logs/view_models/logs_viewmodel.dart || true
          grep -n -A15 -B15 "setClientsFilter" lib/ui/logs/view_models/logs_viewmodel.dart || true
