name: Temporary v6 log filter migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-v6-log-filter-inspect.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare test environment
        run: |
          cp .env.example .env
          flutter pub get
      - name: Apply safe server-side v6 log filters
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def ensure_import(path, import_line):
              text = read(path)
              if import_line in text:
                  return
              lines = text.splitlines(keepends=True)
              import_indexes = [i for i, line in enumerate(lines) if line.startswith('import ')]
              if not import_indexes:
                  raise SystemExit(f'{path}: no import block found')
              lines.insert(import_indexes[-1] + 1, import_line + '\n')
              write(path, ''.join(lines))

          # Keep the v6 mapping in FiltersV6 so the shared Logs filter contract
          # remains API-version agnostic.
          filters_path = 'lib/ui/logs/view_models/filters/filters_v6.dart'
          ensure_import(filters_path, "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';")
          text = read(filters_path)
          if 'V6QueryFilter? get serverQueryFilter' not in text:
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('FiltersV6 class terminator not found')
              getter = '''

  /// Returns only filters that `/api/queries` can represent exactly.
  ///
  /// Domain equality and one concrete v6 status are safe to push down. Client
  /// selections and status groups keep their existing client-side semantics.
  V6QueryFilter? get serverQueryFilter {
    String? status;
    if (_statusSelected.length == 1) {
      final selected = _statusSelected.single;
      for (final queryStatus in queryStatusesV6) {
        if (queryStatus.index == selected) {
          status = queryStatus.key;
          break;
        }
      }
    }

    final filter = V6QueryFilter(domain: _selectedDomain, status: status);
    return filter.toQueryParameters().isEmpty ? null : filter;
  }
'''
              write(filters_path, text[:pos] + getter + text[pos:])

          # Widen the common repository contract. V5 accepts the optional v6
          # filter and intentionally ignores it.
          interface_path = 'lib/data/repositories/api/interfaces/metrics_repository.dart'
          ensure_import(interface_path, "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';")
          text = read(interface_path)
          if 'V6QueryFilter? filter' not in text:
              old = '''    int? cursor,
    int? start,
  });'''
              new = '''    int? cursor,
    int? start,
    V6QueryFilter? filter,
  });'''
              if text.count(old) != 1:
                  raise SystemExit('MetricsRepository fetchQueries signature not found uniquely')
              write(interface_path, text.replace(old, new, 1))

          v5_path = 'lib/data/repositories/api/v5/metrics_repository.dart'
          ensure_import(v5_path, "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';")
          text = read(v5_path)
          if 'V6QueryFilter? filter' not in text:
              old = '''    int? cursor,
    int? start,
  }) async {'''
              new = '''    int? cursor,
    int? start,
    V6QueryFilter? filter,
  }) async {'''
              if text.count(old) != 1:
                  raise SystemExit('MetricsRepositoryV5 fetchQueries signature not found uniquely')
              write(v5_path, text.replace(old, new, 1))

          # Preserve the exact server filter across pagination pages.
          pagination_path = 'lib/domain/services/logs_pagination_service.dart'
          ensure_import(pagination_path, "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';")
          text = read(pagination_path)
          if 'V6QueryFilter? _filter;' not in text:
              anchor = '  int _currentOffset = 0;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('LogsPaginationService offset field anchor not found uniquely')
              text = text.replace(anchor, anchor + '  V6QueryFilter? _filter;\n', 1)
          old_reset = '''  void reset(DateTime start, DateTime until) {
    _startTime = start;
    _endTime = until;
    _finished = LoadStatus.loading;
    _fixedCursor = null;
    _currentOffset = 0;
  }'''
          new_reset = '''  void reset(DateTime start, DateTime until, {V6QueryFilter? filter}) {
    _startTime = start;
    _endTime = until;
    _finished = LoadStatus.loading;
    _fixedCursor = null;
    _currentOffset = 0;
    _filter = filter;
  }'''
          if old_reset in text:
              text = text.replace(old_reset, new_reset, 1)
          elif 'void reset(DateTime start, DateTime until, {V6QueryFilter? filter})' not in text:
              raise SystemExit('LogsPaginationService reset method anchor not found')
          fetch_anchor = '''      cursor: _fixedCursor,
      start: _currentOffset,
    );'''
          if 'filter: _filter,' not in text:
              if text.count(fetch_anchor) != 1:
                  raise SystemExit('LogsPaginationService fetch anchor not found uniquely')
              text = text.replace(fetch_anchor, '''      cursor: _fixedCursor,
      start: _currentOffset,
      filter: _filter,
    );''', 1)
          write(pagination_path, text)

          # Every fresh v6 pagination window captures the current safe pushdown.
          vm_path = 'lib/ui/logs/view_models/logs_viewmodel.dart'
          text = read(vm_path)
          reset_replacements = [
              ('    _paginationService!.reset(start, now);', '''    _paginationService!.reset(
      start,
      now,
      filter: _filters is FiltersV6
          ? (_filters as FiltersV6).serverQueryFilter
          : null,
    );'''),
              ('      _paginationService!.reset(startTime, endTime);', '''      _paginationService!.reset(
        startTime,
        endTime,
        filter: _filters is FiltersV6
            ? (_filters as FiltersV6).serverQueryFilter
            : null,
      );'''),
              ('    _paginationService!.reset(start, end);', '''    _paginationService!.reset(
      start,
      end,
      filter: _filters is FiltersV6
          ? (_filters as FiltersV6).serverQueryFilter
          : null,
    );'''),
          ]
          if 'serverQueryFilter' not in text:
              for old, new in reset_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'LogsViewModel reset anchor count {count}: {old!r}')
                  text = text.replace(old, new, 1)
              write(vm_path, text)

          # Update repository fakes for the widened contract.
          fake_paths = [
              'test/domain/services/logs_pagination_service_test.dart',
              'test/domain/services/live_logs_service_test.dart',
          ]
          for path in fake_paths:
              ensure_import(path, "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';")
              text = read(path)
              if 'V6QueryFilter? filter' not in text:
                  old = '''    int? cursor,
    int? start,
  }) async {'''
                  new = '''    int? cursor,
    int? start,
    V6QueryFilter? filter,
  }) async {'''
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: fake fetchQueries signature count {text.count(old)}')
                  write(path, text.replace(old, new, 1))

          # Prove the filter is retained on every v6 pagination request.
          pagination_test = 'test/domain/services/logs_pagination_service_test.dart'
          text = read(pagination_test)
          if 'V6QueryFilter? lastFilter;' not in text:
              anchor = '''  /// The `cursor` argument from the most recent [fetchQueries] call.
  int? lastCursor;
'''
              if text.count(anchor) != 1:
                  raise SystemExit('pagination fake lastCursor anchor missing')
              text = text.replace(anchor, anchor + '''
  /// The server filter from the most recent [fetchQueries] call.
  V6QueryFilter? lastFilter;
''', 1)
          if 'lastFilter = filter;' not in text:
              anchor = '''    lastStart = start;
    lastCursor = cursor;
'''
              if text.count(anchor) != 1:
                  raise SystemExit('pagination fake assignment anchor missing')
              text = text.replace(anchor, anchor + '    lastFilter = filter;\n', 1)
          if 'forwards exact v6 filter across pagination pages' not in text:
              anchor = "    test('single page (fewer than pageSize) transitions to loaded', () async {"
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('pagination test insertion anchor missing')
              new_test = '''    test('forwards exact v6 filter across pagination pages', () async {
      const pageSize = 1;
      const filter = V6QueryFilter(domain: 'example.com', status: 'FORWARDED');
      final repo = _FakeMetricsRepository([
        Success(_v6Logs([_log(1)], cursor: 77, recordsFiltered: 2)),
        Success(_v6Logs([_log(2)], cursor: 77, recordsFiltered: 2)),
      ]);
      final svc = LogsPaginationService(repository: repo, pageSize: pageSize);

      svc.reset(start, end, filter: filter);
      await svc.loadNextPage();
      expect(repo.lastFilter, same(filter));
      expect(repo.lastStart, 0);
      expect(repo.lastCursor, null);

      await svc.loadNextPage();
      expect(repo.lastFilter, same(filter));
      expect(repo.lastStart, 1);
      expect(repo.lastCursor, 77);
    });

'''
              text = text[:pos] + new_test + text[pos:]
          write(pagination_test, text)

          # Parity tests: exact values push down, OR/multi-status stays client-side.
          filters_test = 'test/ui/logs/view_models/filters/filters_v6_test.dart'
          text = read(filters_test)
          if 'serverQueryFilter is null for default multi-status selection' not in text:
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('FiltersV6 test terminator missing')
              tests = '''

  test('serverQueryFilter is null for default multi-status selection', () {
    expect(filters.serverQueryFilter, isNull);
  });

  test('serverQueryFilter maps an exact domain', () {
    filters.setSelectedDomain('example.com');

    expect(filters.serverQueryFilter?.toQueryParameters(), {
      'domain': 'example.com',
    });
  });

  test('serverQueryFilter maps exactly one v6 status', () {
    filters.setStatusSelected([2]);

    expect(filters.serverQueryFilter?.toQueryParameters(), {
      'status': 'FORWARDED',
    });
  });

  test('serverQueryFilter keeps multi-status selection client-side', () {
    filters.setStatusSelected([1, 2]);

    expect(filters.serverQueryFilter, isNull);
  });

  test('serverQueryFilter pushes domain but not multi-status selection', () {
    filters.setSelectedDomain('example.com');
    filters.setStatusSelected([1, 2]);

    expect(filters.serverQueryFilter?.toQueryParameters(), {
      'domain': 'example.com',
    });
  });
'''
              text = text[:pos] + tests + text[pos:]
              write(filters_test, text)

          # Advance only the portions the implementation and tests prove.
          roadmap = 'ROADMAP.md'
          text = read(roadmap)
          old = '''- [ ] Bestehenden Logs-v6-Filterzustand auf die serverseitigen `domain`, `client_ip`, `status`, `type` und `reply`-Parameter abbilden, ohne v6-Details in das gemeinsame Logs-UI-Modell zu leaken.
- [ ] Nur semantisch aequivalente Filter serverseitig pushen; Mehrfachauswahl-/Komplexfilter, die der FTL-Endpunkt nicht 1:1 darstellen kann, behalten ihre aktuelle clientseitige Semantik.
- [ ] Paritaetstests fuer leere Filter, Einzelwerte, Mehrfachauswahl-Fallback und Pagination hinzufuegen.
'''
          new = '''- [ ] Bestehenden Logs-v6-Filterzustand auf die serverseitigen `domain`, `client_ip`, `status`, `type` und `reply`-Parameter abbilden, ohne v6-Details in das gemeinsame Logs-UI-Modell zu leaken.
  - [x] Domain und exakt einen v6-Status serverseitig pushen; das gemeinsame Logs-UI-Modell bleibt unveraendert und der bestehende clientseitige Paritaetsfilter bleibt aktiv.
  - [ ] Client-Auswahl nur als `client_ip` pushen, wenn die bestehende UI-Auswahl 1:1 auf eine IP aufgeloest werden kann; andernfalls clientseitig lassen.
  - [ ] `type`/`reply` gegen den bestehenden Logs-Filterzustand pruefen und Nicht-Anwendbarkeit dokumentieren, falls dort keine entsprechenden UI-Filter existieren.
- [x] Nur semantisch aequivalente Filter serverseitig pushen; Mehrfachauswahl-/Komplexfilter, die der FTL-Endpunkt nicht 1:1 darstellen kann, behalten ihre aktuelle clientseitige Semantik. Domain und exakt ein v6-Status werden gepusht; Statusgruppen und Mehrfachauswahl bleiben clientseitig.
- [x] Paritaetstests fuer leere Filter, Einzelwerte, Mehrfachauswahl-Fallback und Pagination hinzufuegen.
'''
          if text.count(old) != 1:
              raise SystemExit(f'ROADMAP v6 filter section count {text.count(old)}')
          write(roadmap, text.replace(old, new, 1))
          PY
      - name: Format and validate
        run: |
          dart format \
            lib/ui/logs/view_models/filters/filters_v6.dart \
            lib/data/repositories/api/interfaces/metrics_repository.dart \
            lib/data/repositories/api/v5/metrics_repository.dart \
            lib/domain/services/logs_pagination_service.dart \
            lib/ui/logs/view_models/logs_viewmodel.dart \
            test/domain/services/logs_pagination_service_test.dart \
            test/domain/services/live_logs_service_test.dart \
            test/ui/logs/view_models/filters/filters_v6_test.dart
          flutter test test/ui/logs/view_models/filters/filters_v6_test.dart
          flutter test test/domain/services/logs_pagination_service_test.dart
          flutter test test/domain/services/live_logs_service_test.dart
          flutter test test/ui/logs/view_models/logs_viewmodel_test.dart
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md lib test
          git diff --cached --check
          git commit -m 'feat: push safe v6 log filters server-side'
          git push origin HEAD:dev
