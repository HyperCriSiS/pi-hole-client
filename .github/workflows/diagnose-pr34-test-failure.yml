name: Apply isolated history clients roadmap sync

on:
  push:
    branches:
      - diagnostics/pr34-test-failure

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/roadmap-history-clients-complete
          fetch-depth: 0

      - name: Apply exact roadmap update
        shell: python
        run: |
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()
          old = "- [ ] Keep `/api/history/clients` on the handwritten client until `PiholeV6Service.getHistoryClients` forwards the existing `N`/count parameter; generated response-model parity is otherwise verified, so fix parameter forwarding separately before migrating the repository call."
          new = "- [x] Migrate `/api/history/clients` to the generated service after adding explicit `N`/count forwarding; preserve default/custom/null count semantics, the proven legacy domain mapper via generated-JSON roundtrip, and shared SID renewal/retry behavior. The full Dart suite, unsigned Android source APK, CodeQL/static analysis and zero open code-scanning alerts are green on the final PR #34 candidate."
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one roadmap target, found {text.count(old)}')
          path.write_text(text.replace(old, new))

      - name: Validate diff
        run: |
          git diff --check
          git diff -- ROADMAP.md

      - name: Commit and push roadmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs: mark history clients migration complete"
          git push origin HEAD:maintenance/roadmap-history-clients-complete
