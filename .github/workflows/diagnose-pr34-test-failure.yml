name: Apply isolated PR 34 test stub fix

on:
  push:
    branches:
      - diagnostics/pr34-test-failure

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feature/generated-history-clients-migration-current
          fetch-depth: 0

      - name: Apply exact test stub fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/data/services/api/wrappers/pihole_v6_service_test.dart')
          text = path.read_text()
          old = """        when(\n          mockMetricsApi.getClientMetrics(),\n        ).thenAnswer((_) async => dioResponse(mockResponse));\n\n        final result = await service.getHistoryClients();\n\n        expect(result.isSuccess(), true);\n        expect(result.getOrNull(), mockResponse);\n"""
          new = """        when(\n          mockMetricsApi.getClientMetrics(N: 10),\n        ).thenAnswer((_) async => dioResponse(mockResponse));\n\n        final result = await service.getHistoryClients();\n\n        expect(result.isSuccess(), true);\n        expect(result.getOrNull(), mockResponse);\n        verify(mockMetricsApi.getClientMetrics(N: 10)).called(1);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new))

      - name: Validate diff
        run: |
          git diff --check
          git diff -- test/data/services/api/wrappers/pihole_v6_service_test.dart

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/data/services/api/wrappers/pihole_v6_service_test.dart
          git commit -m "test: align history client wrapper stub"
          git push origin HEAD:feature/generated-history-clients-migration-current
