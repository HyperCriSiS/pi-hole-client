name: Diagnose PR 34 test failure

on:
  push:
    branches:
      - diagnostics/pr34-test-failure

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: data
            target: test/data
          - name: domain
            target: test/domain
          - name: routing
            target: test/routing
          - name: ui
            target: test/ui
          - name: utils
            target: test/utils
          - name: widgets
            target: test/widgets
          - name: full-coverage
            target: test/full_coverage_test.dart
    name: diagnose-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Get dependencies
        run: flutter pub get

      - name: Copy .env file
        run: cp .env.sample .env

      - name: Generate git commit file
        run: dart run tools/generate_git_commit.dart

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run full coverage tool
        run: dart run full_coverage

      - name: Run test area fail-fast
        run: xvfb-run flutter test --coverage --fail-fast --reporter expanded "${{ matrix.target }}"
