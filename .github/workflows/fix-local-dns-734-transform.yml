name: Fix Local DNS 734 transform escaping
on:
  push:
    branches: [feat/local-dns-multi-hostnames]
    paths: [.github/workflows/fix-local-dns-734-transform.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaping
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/apply-local-dns-734.yml")
          s = p.read_text()
          old_dot, new_dot = r"\\\\.", r"\\."
          old_ws, new_ws = r"\\\\s+", r"\\s+"
          if s.count(old_dot) != 3 or s.count(old_ws) != 1:
              raise SystemExit(
                  f"unexpected escape counts: dot={s.count(old_dot)} ws={s.count(old_ws)}"
              )
          p.write_text(s.replace(old_dot, new_dot).replace(old_ws, new_ws))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-local-dns-734.yml
          git commit -m "chore: fix local dns transform escaping"
          git push origin "HEAD:$GITHUB_REF_NAME"
