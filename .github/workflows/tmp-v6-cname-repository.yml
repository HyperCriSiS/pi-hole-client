name: Temporary v6 CNAME repository implementation

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/tmp-v6-cname-repository.yml'

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Implement v6 CNAME repository operations
        shell: python
        run: |
          from pathlib import Path

          model = Path('lib/domain/model/local_dns/cname_record.dart')
          model.write_text('''class CnameRecord {
            const CnameRecord({
              required this.alias,
              required this.target,
              this.ttl,
            });

            final String alias;
            final String target;
            final int? ttl;

            @override
            bool operator ==(Object other) =>
                identical(this, other) ||
                other is CnameRecord &&
                    other.alias == alias &&
                    other.target == target &&
                    other.ttl == ttl;

            @override
            int get hashCode => Object.hash(alias, target, ttl);
          }
          ''')

          interface = Path('lib/data/repositories/api/interfaces/cname_repository.dart')
          interface.write_text('''import 'package:pi_hole_client/domain/model/local_dns/cname_record.dart';
          import 'package:result_dart/result_dart.dart';

          abstract interface class CnameRepository {
            Future<Result<List<CnameRecord>>> fetchCnameRecords();

            Future<Result<Unit>> addCnameRecord({required CnameRecord record});

            Future<Result<Unit>> updateCnameRecord({
              required CnameRecord oldRecord,
              required CnameRecord record,
            });

            Future<Result<Unit>> deleteCnameRecord({required CnameRecord record});
          }
          ''')

          path = Path('lib/data/repositories/api/v6/local_dns_repository.dart')
          text = path.read_text()

          import_marker = "import 'package:pi_hole_client/data/model/v6/config/config.dart';\n"
          cname_imports = (
              "import 'package:pi_hole_client/data/repositories/api/interfaces/cname_repository.dart';\n"
              "import 'package:pi_hole_client/domain/model/local_dns/cname_record.dart';\n"
          )
          if cname_imports not in text:
              if import_marker not in text:
                  raise SystemExit('LocalDnsRepositoryV6 import marker not found')
              text = text.replace(import_marker, import_marker + cname_imports, 1)

          old_class = '''class LocalDnsRepositoryV6 extends BaseV6SidRepository
              implements LocalDnsRepository {'''
          new_class = '''class LocalDnsRepositoryV6 extends BaseV6SidRepository
              implements LocalDnsRepository, CnameRepository {'''
          if old_class in text:
              text = text.replace(old_class, new_class, 1)
          elif new_class not in text:
              raise SystemExit('LocalDnsRepositoryV6 declaration not found')

          insertion_marker = '  List<LocalDns> _parseHosts(List<String>? hosts) {'
          methods = r'''  @override
          Future<Result<List<CnameRecord>>> fetchCnameRecords() async {
            return runWithResultRetry<List<CnameRecord>>(
              action: () async {
                final sid = await getSid();
                final result = await _client.getConfigElement(
                  sid,
                  element: 'dns/cnameRecords',
                );
                return result.map(
                  (config) => _parseCnameRecords(config.config?.dns?.cnameRecords),
                );
              },
              onRetry: (_, e) => renewSidIfExpired(e),
            );
          }

          @override
          Future<Result<Unit>> addCnameRecord({required CnameRecord record}) async {
            return runWithResultRetry<Unit>(
              action: () async {
                final sid = await getSid();
                return _client.putConfigElement(
                  sid,
                  element: 'dns/cnameRecords',
                  value: _serializeCnameRecord(record),
                  isRestart: true,
                );
              },
              onRetry: (_, e) => renewSidIfExpired(e),
            );
          }

          @override
          Future<Result<Unit>> deleteCnameRecord({required CnameRecord record}) async {
            return runWithResultRetry<Unit>(
              action: () async {
                final sid = await getSid();
                return _client.deleteConfigElement(
                  sid,
                  element: 'dns/cnameRecords',
                  value: _serializeCnameRecord(record),
                  isRestart: true,
                );
              },
              onRetry: (_, e) => renewSidIfExpired(e),
            );
          }

          @override
          Future<Result<Unit>> updateCnameRecord({
            required CnameRecord oldRecord,
            required CnameRecord record,
          }) async {
            return runWithResultRetry<Unit>(
              action: () async {
                final sid = await getSid();
                final configResult = await _client.getConfigElement(
                  sid,
                  element: 'dns/cnameRecords',
                );
                final config = configResult.getOrThrow();
                final records = List<String>.from(
                  config.config?.dns?.cnameRecords ?? const <String>[],
                );

                final oldIndex = records.indexWhere(
                  (entry) => _parseCnameRecord(entry) == oldRecord,
                );
                if (oldIndex == -1) {
                  throw Exception(
                    'CNAME record ${_serializeCnameRecord(oldRecord)} not found',
                  );
                }
                records[oldIndex] = _serializeCnameRecord(record);

                final patchResult = await _client.patchConfig(
                  sid,
                  body: ConfigData(dns: Dns(cnameRecords: records)),
                  isRestart: true,
                );
                return patchResult.map((_) => unit);
              },
              onRetry: (_, e) => renewSidIfExpired(e),
            );
          }

          String _serializeCnameRecord(CnameRecord record) {
            final base = '${record.alias},${record.target}';
            return record.ttl == null ? base : '$base,${record.ttl}';
          }

          CnameRecord _parseCnameRecord(String entry) {
            final parts = entry.split(',').map((part) => part.trim()).toList();
            return CnameRecord(
              alias: parts.isNotEmpty ? parts[0] : '',
              target: parts.length > 1 ? parts[1] : '',
              ttl: parts.length > 2 ? int.tryParse(parts[2]) : null,
            );
          }

          List<CnameRecord> _parseCnameRecords(List<String>? records) {
            if (records == null || records.isEmpty) return const [];
            return records.map(_parseCnameRecord).toList();
          }

'''
          if 'Future<Result<List<CnameRecord>>> fetchCnameRecords()' not in text:
              if insertion_marker not in text:
                  raise SystemExit('LocalDnsRepositoryV6 insertion marker not found')
              text = text.replace(insertion_marker, methods + insertion_marker, 1)

          path.write_text(text)

      - name: Prepare test environment
        run: |
          if [ ! -f .env ]; then
            printf 'SENTRY_DSN=\n' > .env
          fi
          flutter pub get
      - name: Format and validate
        run: |
          dart format lib/domain/model/local_dns/cname_record.dart lib/data/repositories/api/interfaces/cname_repository.dart lib/data/repositories/api/v6/local_dns_repository.dart
          git diff --check
          flutter test test/data/repositories/api/v6/local_dns_repository_test.dart
          flutter analyze lib/domain/model/local_dns/cname_record.dart lib/data/repositories/api/interfaces/cname_repository.dart lib/data/repositories/api/v6/local_dns_repository.dart
      - name: Update roadmap after successful validation
        shell: python
        run: |
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text()
          old = '- [ ] Add v6 CNAME repository/domain operations over `dns/cnameRecords`; keep v5 behavior explicitly `NotSupported` rather than inventing unsupported parity.'
          new = '- [x] Add v6 CNAME repository/domain operations over `dns/cnameRecords`, preserving optional TTL values and the shared v6 session/retry path; v5 remains unchanged and unsupported.'
          if old not in text:
              raise SystemExit('Expected ROADMAP CNAME implementation line not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/tmp-v6-cname-repository.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add lib/domain/model/local_dns/cname_record.dart lib/data/repositories/api/interfaces/cname_repository.dart lib/data/repositories/api/v6/local_dns_repository.dart ROADMAP.md .github/workflows/tmp-v6-cname-repository.yml
          git diff --cached --check
          git commit -m 'feat: add v6 CNAME repository operations'
          git push origin dev
