name: Test current ESLint 9 website stack

on:
  push:
    branches:
      - maintenance/eslint9-current
    paths:
      - .github/workflows/try-eslint9.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Update ESLint within major 9
        working-directory: website
        run: pnpm add --save-dev 'eslint@^9'
      - name: Validate website
        working-directory: website
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Verify scoped dependency diff
        run: |
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' website/package.json website/pnpm-lock.yaml | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected ESLint update changes:"
            git status --short
            exit 1
          fi
      - name: Commit validated ESLint update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package.json website/pnpm-lock.yaml
          git commit -m "chore(deps-dev): upgrade website to ESLint 9"
          git push
