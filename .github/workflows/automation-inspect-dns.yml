name: automation inspect dns error state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show DnsTab error block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/ui/statistics/widgets/dns_tab.dart')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines,1):
              if 'Icons.error' in line or 'ErrorMessage' in line:
                  a=max(1,i-20); b=min(len(lines),i+30)
                  print(f'--- lines {a}-{b} ---')
                  for n in range(a,b+1): print(f'{n:04d}: {lines[n-1]}')
          print('--- imports ---')
          for n,line in enumerate(lines[:40],1): print(f'{n:04d}: {line}')
          PY