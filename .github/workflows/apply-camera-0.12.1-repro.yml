name: Generate camera 0.12.1 lockfile

on:
  push:
    branches:
      - maintenance/camera-0.12.1-repro
    paths:
      - .github/workflows/apply-camera-0.12.1-repro.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1
      - name: Update camera with pinned resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          old = '  camera: 0.11.2+1\n'
          new = '  camera: 0.12.1\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one camera pin, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          flutter pub get
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' pubspec.lock pubspec.yaml | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected resolver changes:"
            git status --short
            exit 1
          fi
      - name: Commit dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock
          git commit -m "chore(deps): bump camera to 0.12.1"
          git push
