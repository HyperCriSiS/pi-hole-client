name: Harden Android identity migrator

on:
  push:
    branches:
      - roadmap/android-identity-migrator
    paths:
      - .github/workflows/apply-identity-migrator-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch helper and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match")
              p.write_text(text.replace(old, new, 1))
          replace_once(
              'tools/identity/migrate_android_identity.py',
              '    planned_text = "\\n".join(write.content for write in writes)\n    planned_text += "\\n" + "\\n".join(move.content for move in moves)\n    if current.application_id in planned_text:\n',
              '    runtime_writes = [write for write in writes if write.path != config]\n    planned_text = "\\n".join(write.content for write in runtime_writes)\n    planned_text += "\\n" + "\\n".join(move.content for move in moves)\n    if current.application_id in planned_text:\n',
          )
          replace_once(
              'tools/identity/test_migrate_android_identity.py',
              'import tempfile\nimport unittest\n',
              'import tempfile\nimport unittest\nimport sys\n',
          )
          replace_once(
              'tools/identity/test_migrate_android_identity.py',
              'module = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(module)\n',
              'module = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = module\nSPEC.loader.exec_module(module)\n',
          )
          PY
      - name: Validate helper
        shell: bash
        run: |
          python3 tools/identity/test_migrate_android_identity.py
          python3 tools/identity/migrate_android_identity.py --application-id io.github.example.pi_hole_client --app-label "Example Pi-hole client" --resource-app-name "Example Pi-hole"
          git diff --check
      - name: Commit helper changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/identity/migrate_android_identity.py tools/identity/test_migrate_android_identity.py
          git commit -m "feat: validate Android identity migration helper"
          git push
