name: Temporary OpenAPI v6.7 refresh

on:
  push:
    branches:
      - roadmap/openapi-v67-refresh
    paths:
      - 'tools/openapi/**'
      - '.github/workflows/tmp-openapi-v67-refresh.yml'

permissions:
  contents: write

concurrency:
  group: openapi-v67-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v7
        with:
          ref: roadmap/openapi-v67-refresh
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Resolve project dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          cp .env.sample .env

      - name: Bundle pinned FTL v6.7 spec
        run: |
          chmod +x tools/openapi/bundle-spec.sh tools/openapi/generate.sh
          bash tools/openapi/bundle-spec.sh
          cp tools/openapi/spec/upstream-bundled.yaml tools/openapi/spec/bundled.yaml

      - name: Regenerate v6 API client
        run: bash tools/openapi/generate.sh

      - name: Normalize generated Dart
        run: dart format .

      - name: Commit deterministic refresh
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Pinned FTL v6.7 refresh produced no repository changes.'
            exit 0
          fi
          git commit -m 'api: refresh generated v6 client from pinned FTL v6.7'
          git push origin HEAD:roadmap/openapi-v67-refresh
