name: Focused PR Test Diagnostic

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare env file
        run: cp .env.sample .env

      - name: Generate Git commit hash
        run: dart run tools/generate_git_commit.dart

      - name: Run focused failing tests
        run: |
          flutter test --reporter expanded \
            test/ui/settings/about/about_screens_test.dart \
            test/ui/shell/base_test.dart \
            test/ui/shell/pi_hole_client_test.dart
