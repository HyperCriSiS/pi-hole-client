name: Diagnose Local DNS

on:
  push:
    branches: [dev]
    paths:
      - 'lib/ui/settings/server_settings/advanced_settings/local_dns/**'
      - 'test/ui/settings/server_settings/advanced_settings/local_dns/**'
      - '.github/workflows/diagnose-local-dns.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-dns-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Install dependencies
        run: flutter pub get

      - name: Create test environment file
        run: touch .env

      - name: Run Local DNS tests
        run: flutter test test/ui/settings/server_settings/advanced_settings/local_dns --reporter expanded
