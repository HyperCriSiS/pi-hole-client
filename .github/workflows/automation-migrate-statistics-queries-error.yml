name: Automation migrate statistics queries error state
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-migrate-statistics-queries-error.yml
      - .github/automation/migrate_statistics_queries_error.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare migration
        run: python3 .github/automation/migrate_statistics_queries_error.py migrate
      - name: Run focused Flutter test
        run: |
          cp .env.sample .env
          flutter pub get
          flutter test test/ui/statistics/statistics_test.dart
      - name: Mark validated roadmap item
        run: python3 .github/automation/migrate_statistics_queries_error.py roadmap
      - name: Commit validated migration
        run: |
          rm .github/workflows/automation-migrate-statistics-queries-error.yml
          rm .github/automation/migrate_statistics_queries_error.py
          git checkout -- pubspec.lock analysis_options.yaml || true
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add lib/ui/statistics/widgets/statistics_queries_servers_tab.dart ROADMAP.md .github/workflows/automation-migrate-statistics-queries-error.yml .github/automation/migrate_statistics_queries_error.py
          git diff --cached --check
          git commit -m 'refactor: reuse shared error state in statistics queries'
          git push origin HEAD:dev
