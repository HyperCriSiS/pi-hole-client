name: Refresh fast-uri security lockfile

on:
  push:
    branches:
      - security/fast-uri-3.1.6
    paths:
      - 'website/package.json'
      - '.github/workflows/tmp-fast-uri-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm 10.30.1
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Regenerate lockfile from package manifest
        run: pnpm install --lockfile-only

      - name: Verify patched fast-uri resolution
        run: |
          grep -q '^  fast-uri: 3.1.6$' pnpm-lock.yaml
          grep -q '^  fast-uri@3.1.6:$' pnpm-lock.yaml
          if grep -q 'fast-uri@3.1.5' pnpm-lock.yaml; then
            echo '::error::Vulnerable fast-uri 3.1.5 remains in the lockfile.'
            exit 1
          fi

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Commit generated lockfile
        working-directory: .
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo '::error::Expected pnpm lockfile update was not generated.'
            exit 1
          fi
          git commit -m 'security: regenerate lockfile for fast-uri 3.1.6'
          git push origin HEAD:security/fast-uri-3.1.6
