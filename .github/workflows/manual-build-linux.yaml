name: Temporary root codegen reproducibility check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/root-codegen-reproducibility

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate root artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Require reproducible generated tree
        run: |
          git diff --check
          if ! git diff --quiet; then
            echo '::error::Root codegen is not reproducible:'
            git status --short
            git diff
            exit 1
          fi
