name: Temporary roadmap synchronization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Synchronize roadmap and upstream triage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          replacements = [
              (
                  '- [ ] Keep `/api/info/ftl` on the handwritten client for now: the generated schema models v6.3 domain/regex counters only as `{total, enabled}` objects, while the existing transport model intentionally accepts the v6.2 integer representation as well.',
                  '- [ ] Keep `/api/info/ftl` on the handwritten client for now: the generated schema models domain/regex counters only as `{total, enabled}` objects, while the existing transport model intentionally accepts the v6.2 integer representation as well; the pinned upstream FTL v6.7 spec was re-audited and still does not model that compatibility union.',
              ),
              (
                  '- [ ] Continue #639 only endpoint-by-endpoint where the generated schema preserves behavior. Keep `/api/info/client` on the handwritten client because the generated schema omits request metadata used by the current model, and keep authentication on the handwritten path while generated `POST /auth` lacks TOTP support.',
                  '- [x] Migrate `/api/info/client` to the generated service after verifying the generated response already preserves `remoteAddr`, HTTP version, method, headers and timing metadata; retain the proven legacy/domain mapping through generated-JSON roundtrip and shared SID renewal/retry coverage.\n- [ ] Keep authentication on the handwritten path while generated `POST /auth` lacks a TOTP request field.\n- [ ] Refresh the generated OpenAPI baseline reproducibly from the current Pi-hole API 6.4.1 snapshot to pinned FTL v6.7 before relying on newer schemas: pin the exact FTL commit plus Redocly/OpenAPI wrapper versions, regenerate with the already pinned OpenAPI Generator 7.19.0, and re-audit each remaining handwritten endpoint before migration.',
              ),
              (
                  '**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. #570 is implemented and CI-validated through the v6 repository and Local DNS UI layers. #134 remains the active distribution gate: secret-free unsigned packaging, Android scanner compliance and the download-free native-asset path are implemented and CI-validated; the required independent-fork package identity remains before downstream F-Droid metadata can be submitted. Deterministic #639 generated-client migration can continue in parallel only where schema and behavior parity are proven.',
                  '**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. #570 is implemented and CI-validated through the v6 repository and Local DNS UI layers. #134 remains the active distribution gate: secret-free unsigned packaging, Android scanner compliance and the download-free native-asset path are implemented and CI-validated; the required independent-fork package identity remains before downstream F-Droid metadata can be submitted. Deterministic #639 generated-client migration has now also moved `/api/info/client` to the generated service; the remaining migration work is limited to documented schema/behavior/encoding blockers plus a pinned FTL v6.7 OpenAPI refresh.',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected ROADMAP match count for: {old[:80]!r}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          triage = Path('UPSTREAM_TRIAGE.md')
          text = triage.read_text()
          replacements = [
              (
                  '| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration now covers the parity-verified info/history/stats paths, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions, DHCP, DNS blocking, DNS query-logging config reads, and Local DNS/CNAME config reads/updates. Keep `/api/info/ftl`, `/api/info/client`, auth, detailed network gateway, ARP/network fallback flushing, gravity streaming, and Local DNS add/delete on the handwritten path until their compatibility/schema/encoding gaps are resolved. |',
                  '| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration now covers the parity-verified info paths including `/api/info/client`, history/stats, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions, DHCP, DNS blocking, DNS query-logging config reads, and Local DNS/CNAME config reads/updates. Keep `/api/info/ftl`, auth, detailed network gateway, ARP/network fallback flushing, gravity streaming, and Local DNS add/delete handwritten until their compatibility/schema/encoding gaps are resolved. The generated snapshot is still Pi-hole API 6.4.1; a reproducible refresh to pinned FTL v6.7 is the next generator-level step. |',
              ),
              (
                  '6. #639/#352: incremental generated-v6 migration remains active on `main`; the current parity-safe info/history/stats/queries/network/DHCP/DNS/config slices are integrated and validated, while documented compatibility gaps stay handwritten. #570 is complete. #134 source-build work is CI-validated but downstream submission remains blocked on the required independent-fork package identity.',
                  '6. #639/#352: incremental generated-v6 migration remains active on `main`; `/api/info/client` is now generated as well, and the remaining handwritten paths are explicit compatibility/schema/encoding holds. Refresh the 6.4.1 generated snapshot reproducibly to pinned FTL v6.7 before re-auditing those holds. #570 is complete. #134 source-build work is CI-validated but downstream submission remains blocked on the required independent-fork package identity.',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected TRIAGE match count for: {old[:80]!r}')
              text = text.replace(old, new, 1)
          triage.write_text(text)
          PY
          git diff --check
          git diff -- ROADMAP.md UPSTREAM_TRIAGE.md

      - name: Commit docs synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md UPSTREAM_TRIAGE.md
          git diff --cached --quiet && { echo '::error::No documentation changes produced'; exit 1; }
          git commit -m 'docs: sync generated-v6 migration status'
          git push origin HEAD:${GITHUB_REF_NAME}
