name: Lockfile reproducibility diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Restore canonical main workflow before dependency resolution
        shell: bash
        run: git checkout origin/main -- .github/workflows/manual-build-linux.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Verify checked-in lockfile is reproducible
        shell: bash
        run: |
          flutter pub get
          if ! git diff --exit-code -- pubspec.lock; then
            echo '::error::pubspec.lock changes under canonical Flutter 3.44.1'
            exit 1
          fi
          echo 'pubspec.lock is reproducible with Flutter 3.44.1'
