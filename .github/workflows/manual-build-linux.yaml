name: Temporary root codegen normalization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/root-codegen-reproducibility
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate root artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify isolated generated drift
        run: |
          changed=$(git status --short | awk '{print $2}')
          echo "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(test/widgets/helpers\.mocks\.dart|macos/Flutter/GeneratedPluginRegistrant\.swift)$' || true)
          if [ -n "$unexpected" ]; then
            echo '::error::Root codegen changed unexpected paths:'
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff -- test/widgets/helpers.mocks.dart macos/Flutter/GeneratedPluginRegistrant.swift

      - name: Commit canonical generated artifacts
        run: |
          if git diff --quiet -- test/widgets/helpers.mocks.dart macos/Flutter/GeneratedPluginRegistrant.swift; then
            echo 'No generated drift to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widgets/helpers.mocks.dart macos/Flutter/GeneratedPluginRegistrant.swift
          git commit -m 'build: normalize generated root artifacts'
          git push origin HEAD:maintenance/root-codegen-reproducibility
