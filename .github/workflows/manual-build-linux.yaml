name: Temporary pinned OpenAPI v6.7 refresh v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/openapi-v6.7-refresh-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Bundle pinned FTL v6.7 spec
        shell: bash
        run: |
          bash tools/openapi/bundle-spec.sh
          cp tools/openapi/spec/upstream-bundled.yaml tools/openapi/spec/bundled.yaml
          rm -f tools/openapi/spec/upstream-bundled.yaml

      - name: Regenerate v6 client
        shell: bash
        run: bash tools/openapi/generate.sh

      - name: Verify refresh scope
        shell: bash
        run: |
          git diff --check
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(tools/openapi/spec/bundled\.yaml|lib/data/services/api/generated/v6(/.*)?)$' || true)
          if [ -n "$unexpected" ]; then
            echo '::error::OpenAPI refresh changed unexpected paths:'
            echo "$unexpected"
            exit 1
          fi
          git status --short

      - name: Commit generated refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/openapi/spec/bundled.yaml lib/data/services/api/generated/v6
          git diff --cached --quiet && { echo '::error::No OpenAPI refresh changes produced'; exit 1; }
          git commit -m 'api: refresh generated v6 client from pinned FTL v6.7'
          git push origin HEAD:maintenance/openapi-v6.7-refresh-v2
