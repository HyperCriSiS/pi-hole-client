name: Temporary canonical lockfile normalization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Regenerate canonical lockfile
        shell: bash
        run: |
          flutter pub get
          git diff --check
          git diff -- pubspec.lock

      - name: Commit canonical lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo 'No lockfile changes produced'
            exit 1
          fi
          git commit -m 'deps: normalize lockfile for Flutter 3.44.1'
          git push origin HEAD:${GITHUB_REF_NAME}
