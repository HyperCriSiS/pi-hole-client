name: Temporary lockfile refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Update Sentry constraint and regenerate lockfile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          old = '  sentry_flutter: ^9.26.0\n'
          new = '  sentry_flutter: ^9.28.0\n'
          if text.count(old) != 1:
              raise SystemExit('expected sentry_flutter 9.26.0 constraint exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          flutter pub get
          grep -A7 '^  sentry_flutter:' pubspec.lock
          git diff --check

      - name: Commit generated dependency state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock
          git diff --cached --exit-code && { echo 'No dependency changes produced'; exit 1; } || true
          git commit -m 'deps: bump sentry_flutter to 9.28.0'
          git push origin HEAD:${GITHUB_REF_NAME}
