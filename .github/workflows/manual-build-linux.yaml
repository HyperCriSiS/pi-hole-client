name: Root codegen reproducibility diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate root artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Inspect Mockito drift
        shell: bash
        run: |
          if git diff --quiet -- test/widgets/helpers.mocks.dart; then
            echo 'helpers.mocks.dart is reproducible on canonical main'
          else
            echo 'helpers.mocks.dart changes on canonical main:'
            git diff -- test/widgets/helpers.mocks.dart
            exit 1
          fi
