name: Temporary lockfile guard installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install lockfile guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('.github/workflows/test.yaml')
          text = test.read_text()
          old = "    - name: Get dependencies\n      run: flutter pub get\n\n    - name: Copy .env file\n"
          new = "    - name: Get dependencies\n      run: flutter pub get\n\n    - name: Verify lockfile stability\n      run: git diff --exit-code -- pubspec.lock\n\n    - name: Copy .env file\n"
          if text.count(old) != 1:
              raise SystemExit(f'Unexpected Dart workflow match count: {text.count(old)}')
          test.write_text(text.replace(old, new, 1))

          release = Path('.github/workflows/test-release.yaml')
          text = release.read_text()
          marker = "  build-android-source:\n    name: Build unsigned Android source APK\n"
          if text.count(marker) != 1:
              raise SystemExit(f'Unexpected Android source job match count: {text.count(marker)}')
          head, tail = text.split(marker, 1)
          old = "      - run: flutter clean\n      - run: flutter pub get\n\n      - name: Copy .env file\n"
          new = "      - run: flutter clean\n      - run: flutter pub get\n\n      - name: Verify lockfile stability\n        run: git diff --exit-code -- pubspec.lock\n\n      - name: Copy .env file\n"
          if tail.count(old) < 1:
              raise SystemExit('Unsigned Android dependency block not found')
          release.write_text(head + marker + tail.replace(old, new, 1))
          PY
          git diff --check
          git diff -- .github/workflows/test.yaml .github/workflows/test-release.yaml

      - name: Commit lockfile guards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/test.yaml .github/workflows/test-release.yaml
          git diff --cached --exit-code && { echo 'No workflow changes produced'; exit 1; } || true
          git commit -m 'ci: fail fast on lockfile drift'
          git push origin HEAD:${GITHUB_REF_NAME}
