name: automation-inspect-604
on:
  push:
    branches: [dev]
    paths: [.github/workflows/automation-inspect-604.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Implement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/ui/logs/widgets/log_details_screen.dart')
          s=p.read_text()
          if "package:flutter/services.dart" not in s:
              s=s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n", 1)
          anchor="""          IconButton(\n            onPressed: () => openUrl('${Urls.googleSearch}${log.url}'),\n            icon: const Icon(Icons.travel_explore_rounded),\n            tooltip: AppLocalizations.of(context)!.domainSearchOnline,\n          ),\n          blackWhiteListButton(),\n"""
          repl="""          IconButton(\n            onPressed: () {\n              logsViewModel.setSelectedDomain(log.url);\n              if (context.canPop()) context.pop();\n            },\n            icon: const Icon(Icons.filter_alt_rounded),\n          ),\n          IconButton(\n            onPressed: () => Clipboard.setData(ClipboardData(text: log.url)),\n            icon: const Icon(Icons.content_copy_rounded),\n          ),\n          IconButton(\n            onPressed: () => openUrl('${Urls.googleSearch}${log.url}'),\n            icon: const Icon(Icons.travel_explore_rounded),\n            tooltip: AppLocalizations.of(context)!.domainSearchOnline,\n          ),\n          blackWhiteListButton(),\n"""
          if anchor not in s: raise SystemExit('screen action anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s)

          t=Path('test/ui/logs/widgets/log_details_screen_test.dart')
          q=t.read_text()
          if "package:flutter/services.dart" not in q:
              q=q.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",1)
          anchor2="""    testWidgets('search online button is shown', (WidgetTester tester) async {\n      await tester.pumpWidget(_buildScreen(_forwardedLog));\n      expect(find.byIcon(Icons.travel_explore_rounded), findsOneWidget);\n    });\n"""
          repl2="""    testWidgets('filters logs by the selected domain', (WidgetTester tester) async {\n      final vm = FakeLogsViewModel();\n      await tester.pumpWidget(_buildScreen(_forwardedLog, viewModel: vm));\n\n      await tester.tap(find.byIcon(Icons.filter_alt_rounded));\n      await tester.pump();\n\n      expect(vm.selectedDomain, 'example.com');\n    });\n\n    testWidgets('copies the domain to the clipboard', (WidgetTester tester) async {\n      await tester.pumpWidget(_buildScreen(_forwardedLog));\n      String? clipboardText;\n      tester.binding.defaultBinaryMessenger.setMockMethodCallHandler(\n        SystemChannels.platform,\n        (call) async {\n          if (call.method == 'Clipboard.setData') {\n            clipboardText = (call.arguments as Map)['text'] as String?;\n          }\n          return null;\n        },\n      );\n\n      await tester.tap(find.byIcon(Icons.content_copy_rounded));\n      await tester.pump();\n\n      expect(clipboardText, 'example.com');\n      tester.binding.defaultBinaryMessenger.setMockMethodCallHandler(\n        SystemChannels.platform,\n        null,\n      );\n    });\n\n    testWidgets('search online button is shown', (WidgetTester tester) async {\n      await tester.pumpWidget(_buildScreen(_forwardedLog));\n      expect(find.byIcon(Icons.travel_explore_rounded), findsOneWidget);\n    });\n"""
          if anchor2 not in q: raise SystemExit('test anchor not found')
          q=q.replace(anchor2,repl2,1)
          t.write_text(q)
          PY
          touch .env
          flutter pub get
          dart format lib/ui/logs/widgets/log_details_screen.dart test/ui/logs/widgets/log_details_screen_test.dart
          flutter test test/ui/logs/widgets/log_details_screen_test.dart
          git diff --check
      - name: Update roadmap and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md'); s=p.read_text()
          old='- [ ] #604: add Domain Log Details actions for filtering by domain and copying the domain while retaining the browser action.'
          new='- [x] #604: add Domain Log Details actions for filtering by domain and copying the domain while retaining the browser action.'
          if old not in s: raise SystemExit('roadmap #604 anchor not found')
          s=s.replace(old,new,1)
          blocker='- The GitHub MCP currently returns `log_details_screen.dart` as blob metadata/SHA rather than the full current file body. Because `create_or_update_file` requires a complete replacement body, #604 must not be implemented by reconstructing and blindly overwriting the screen from historical patches. The route and regression surface are confirmed, but a safe source patch still requires complete current file content.\n'
          s=s.replace(blocker,'')
          s=s.replace('**Not fully completed.** #604 is still the next preferred implementation. Its exact integration/test surface is confirmed; the remaining blocker is safe access to the full current `LogDetailsScreen` source through the allowed MCP before applying the UI patch.', '**Not fully completed.** #604 is implemented and covered by widget tests. #404 is the next preferred deterministic item.')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/logs/widgets/log_details_screen.dart test/ui/logs/widgets/log_details_screen_test.dart ROADMAP.md
          git commit -m 'Add log detail domain actions'
          git pull --rebase origin dev
          git push origin HEAD:dev
