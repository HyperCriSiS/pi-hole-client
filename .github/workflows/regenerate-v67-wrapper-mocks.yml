name: Regenerate FTL 6.7 wrapper mocks

on:
  push:
    branches:
      - roadmap/openapi-v67-refresh

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: roadmap/openapi-v67-refresh
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Prepare dependencies
        shell: bash
        run: |
          flutter pub get
          cp .env.sample .env

      - name: Force wrapper mock regeneration
        shell: bash
        run: |
          rm -f test/data/services/api/wrappers/mocks.mocks.dart
          dart run build_runner build --delete-conflicting-outputs
          dart format \
            lib/data/services/api/wrappers/pihole_v6_service.dart \
            test/data/mapper/v6_generated/group_mapper_test.dart \
            test/data/services/api/wrappers/pihole_v6_service_test.dart \
            test/data/services/api/wrappers/mocks.mocks.dart

      - name: Commit generated mock and formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/data/services/api/wrappers/pihole_v6_service.dart \
            test/data/mapper/v6_generated/group_mapper_test.dart \
            test/data/services/api/wrappers/pihole_v6_service_test.dart \
            test/data/services/api/wrappers/mocks.mocks.dart
          git commit -m "test: regenerate v6 wrapper mocks for FTL 6.7"
          git push origin HEAD:roadmap/openapi-v67-refresh
