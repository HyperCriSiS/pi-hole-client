name: Regenerate FTL 6.7 wrapper mocks

on:
  push:
    branches:
      - roadmap/openapi-v67-refresh

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: roadmap/openapi-v67-refresh
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Temporarily enable Mockito generation for the v6 wrapper mocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('build.yaml')
          text = path.read_text()
          start = text.index('      mockito|mockBuilder:')
          replacement = '''      mockito|mockBuilder:\n        generate_for:\n          include:\n            - test/data/services/api/wrappers/mocks.dart\n'''
          path.write_text(text[:start] + replacement)
          PY
          git show 91fdf72e9a9ea534b6558eef1e972a4ead435578:test/data/services/api/wrappers/mocks.mocks.dart > test/data/services/api/wrappers/mocks.mocks.dart

      - name: Prepare dependencies
        shell: bash
        run: |
          flutter pub get
          cp .env.sample .env
          dart run tools/generate_git_commit.dart

      - name: Regenerate all root codegen including wrapper mocks
        shell: bash
        run: |
          dart run build_runner clean
          dart run build_runner build
          dart format \
            test/data/services/api/wrappers/mocks.mocks.dart \
            test/data/services/api/wrappers/pihole_v6_service_test.dart \
            lib/data/services/api/wrappers/pihole_v6_service.dart \
            test/data/mapper/v6_generated/group_mapper_test.dart

      - name: Verify regenerated mock and analyzer compatibility
        shell: bash
        run: |
          test -s test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'listGroups' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'post2' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'put2' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'getTypeKindDomains' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'listLists' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'post4' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'put4' test/data/services/api/wrappers/mocks.mocks.dart
          grep -q 'listClients' test/data/services/api/wrappers/mocks.mocks.dart
          dart analyze

      - name: Commit regenerated mock and formatting
        shell: bash
        run: |
          git checkout -- build.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f test/data/services/api/wrappers/mocks.mocks.dart
          git add \
            test/data/services/api/wrappers/pihole_v6_service_test.dart \
            lib/data/services/api/wrappers/pihole_v6_service.dart \
            test/data/mapper/v6_generated/group_mapper_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: regenerate v6 wrapper mocks for FTL 6.7"
          git push origin HEAD:roadmap/openapi-v67-refresh
