name: Fix dead v6 fake overrides

on:
  push:
    branches:
      - maintenance/remove-dead-v6-client-methods
    paths:
      - .github/workflows/fix-dead-v6-fake.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Remove stale fake overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('testing/fakes/services/fake_pihole_v6_api_client.dart')
          text = path.read_text()
          targets = [
              'postGroups', 'putGroups', 'postClients', 'putClients', 'deleteClients',
              'postDomains', 'putDomains', 'deleteDomains', 'postLists', 'putLists',
              'deleteInfoMessages', 'deleteNetworkDevices', 'postActionFlushArp',
              'postActionFlushNetwork', 'postActionFlushLogs', 'postActionRestartDns',
              'getConfigElement', 'putConfigElement', 'deleteConfigElement',
              'deleteDhcpLeases',
          ]

          def remove_method(source: str, name: str) -> str:
              match = re.search(
                  rf'(?m)^  (?:Future|Stream)<[^\n]+>\s+{re.escape(name)}\s*\(',
                  source,
              )
              if match is None:
                  raise SystemExit(f'method not found: {name}')
              start = match.start()
              prefix = source[:start].splitlines(keepends=True)
              if prefix and prefix[-1].strip() == '@override':
                  start -= len(prefix[-1])

              body_match = re.search(r'\)\s+async\*?\s*\{', source[match.start():])
              if body_match is None:
                  raise SystemExit(f'method body not found: {name}')
              brace = match.start() + body_match.end() - 1
              depth = 0
              in_single = False
              in_double = False
              escaped = False
              i = brace
              while i < len(source):
                  char = source[i]
                  if in_single:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == "'":
                          in_single = False
                  elif in_double:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_double = False
                  else:
                      if char == "'":
                          in_single = True
                      elif char == '"':
                          in_double = True
                      elif char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              if end < len(source) and source[end] == '\n':
                                  end += 1
                              if end < len(source) and source[end] == '\n':
                                  end += 1
                              return source[:start] + source[end:]
                  i += 1
              raise SystemExit(f'unclosed method: {name}')

          for target in targets:
              text = remove_method(text, target)

          text = text.replace(
              "import 'package:pi_hole_client/data/model/v6/action/action.dart' show Action;\n",
              '',
          )
          old = """import 'package:pi_hole_client/data/model/v6/metrics/query.dart' show Queries;\nimport 'package:pi_hole_client/data/model/v6/metrics/stats.dart'\n    show StatsSummary, StatsTopClients, StatsTopDomains, StatsUpstreams;\nimport 'package:pi_hole_client/data/model/v6/network/devices.dart' show Devices;\nimport 'package:pi_hole_client/data/model/v6/network/gateway.dart' show Gateway;\nimport 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\n"""
          new = """import 'package:pi_hole_client/data/model/v6/metrics/query.dart' show Queries;\nimport 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\nimport 'package:pi_hole_client/data/model/v6/metrics/stats.dart'\n    show StatsSummary, StatsTopClients, StatsTopDomains, StatsUpstreams;\nimport 'package:pi_hole_client/data/model/v6/network/devices.dart' show Devices;\nimport 'package:pi_hole_client/data/model/v6/network/gateway.dart' show Gateway;\n"""
          text = text.replace(old, new)
          path.write_text(text)

          for target in targets:
              if re.search(rf'\b{re.escape(target)}\s*\(', text):
                  raise SystemExit(f'stale fake method remains: {target}')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Validate fake
        shell: bash
        run: |
          set -euo pipefail
          cp .env.sample .env
          flutter pub get
          dart format testing/fakes/services/fake_pihole_v6_api_client.dart
          dart analyze testing/fakes/services/fake_pihole_v6_api_client.dart
      - name: Commit validated fake cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/fakes/services/fake_pihole_v6_api_client.dart
          git diff --cached --check
          git commit -m 'test: remove superseded v6 fake overrides'
          git push
