name: Enable v6 filter validation run

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/enable-v6-filter-run.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-v6-filter-repository-fix.yml')
          s = p.read_text()
          old = "on:\n  workflow_dispatch:\n"
          new = "on:\n  push:\n    branches: [dev]\n    paths:\n      - '.github/workflows/tmp-v6-filter-repository-fix.yml'\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/enable-v6-filter-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-v6-filter-repository-fix.yml
          git commit -m "chore: enable v6 filter validation workflow"
          git push origin HEAD:dev
