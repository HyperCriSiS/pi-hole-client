name: Stage v6 legacy client minimization

on:
  push:
    branches:
      - maintenance/minimize-v6-legacy-client
    paths:
      - .github/workflows/stage-v6-legacy-minimize.yml
      - tools/maintenance/minimize_v6_legacy_client.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply validated transform
        run: python3 tools/maintenance/minimize_v6_legacy_client.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Validate focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp .env.sample .env
          flutter pub get
          dart format lib/data/services/api/pihole_v6_api_client.dart testing/fakes/services/fake_pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          dart analyze lib/data/services/api/pihole_v6_api_client.dart testing/fakes/services/fake_pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          flutter test test/data/services/api/pihole_v6_api_client_test.dart
      - name: Commit validated product/test files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/services/api/pihole_v6_api_client.dart testing/fakes/services/fake_pihole_v6_api_client.dart test/data/services/api/pihole_v6_api_client_test.dart
          git diff --cached --check
          git commit -m 'refactor: minimize handwritten v6 client surface'
          git push
