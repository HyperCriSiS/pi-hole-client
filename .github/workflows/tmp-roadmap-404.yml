name: tmp update roadmap 404

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-roadmap-404.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Mark #404 complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          old = '- [ ] #404: complete the deterministic documentation/UI item tracked in `UPSTREAM_TRIAGE.md`.'
          new = '- [x] #404: document the current translation contribution workflow (`docs/translations.md`): existing languages are edited in `lib/ui/core/l10n/*.arb` and submitted by PR; new languages start with an issue; no Weblate/Crowdin project is currently in use.'
          if old not in s:
              raise SystemExit('expected #404 roadmap line not found')
          s = s.replace(old, new, 1)
          old2 = '**Not fully completed.** #604 is implemented and validated. #404 is the next preferred deterministic item.'
          new2 = '**Not fully completed.** #604 and #404 are implemented and validated. #638 is the next preferred deterministic item.'
          if old2 not in s:
              raise SystemExit('expected completion-status line not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Commit roadmap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs: mark translation contribution guide complete'
          git push origin HEAD:dev
