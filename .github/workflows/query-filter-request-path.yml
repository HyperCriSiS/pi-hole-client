name: Temporary v6 query filter migration

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/query-filter-request-path.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect v6 query request path
        shell: bash
        run: |
          set -euo pipefail
          echo '=== methods containing quer ==='
          grep -n -i -C 12 'quer' lib/data/services/api/pihole_v6_api_client.dart || true
          echo '=== repository v6 query call ==='
          grep -n -i -C 12 'quer' lib/data/repositories/api/v6/metrics_repository.dart || true
          echo '=== interface query signature ==='
          grep -n -i -C 12 'quer' lib/data/repositories/api/interfaces/metrics_repository.dart || true
          exit 1
