name: Temporary v6 query filter migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect v6 query API tests
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 35 'getQueries' test/data/services/api/pihole_v6_api_client_test.dart || true
          grep -n -C 35 '/api/queries' test/data/services/api/pihole_v6_api_client_test.dart || true
          exit 1
