name: Temporary v6 query filter migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply, test and commit
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/migrate.sh
          bash /tmp/migrate.sh
