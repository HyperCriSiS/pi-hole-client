name: Apply Local DNS 734 port

on:
  push:
    branches:
      - feat/local-dns-multi-hostnames
    paths:
      - .github/workflows/apply-local-dns-734.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply staged patches
        shell: bash
        run: |
          set -euo pipefail
          for encoded in .github/patches/local_dns_734_*.patch.b64; do
            patch="/tmp/$(basename "${encoded}" .b64)"
            base64 --decode "${encoded}" > "${patch}"
            git apply --check "${patch}"
            git apply "${patch}"
          done
          git diff --check

      - name: Commit fork-adapted upstream port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_TRIAGE.md lib test
          git commit -m "feat(local-dns): support multiple hostnames and duplicates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
