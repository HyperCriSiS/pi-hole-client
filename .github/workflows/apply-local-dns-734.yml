name: Apply Local DNS 734 port
on:
  push:
    branches: [feat/local-dns-multi-hostnames]
    paths: [.github/workflows/apply-local-dns-734.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fork-adapted upstream changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {n}: {old[:70]!r}")
              p.write_text(s.replace(old, new, 1))

          # validators
          p = "lib/utils/validators.dart"
          rep(p, "// Pure form-field validators for the add/edit server screen.",
                 "// Pure form-field validators.")
          rep(p,
              "final _subroute = RegExp(r'^\\/\\b([A-Za-z0-9_\\-~/]*)[^\\/|\\.|\\:]$');",
              "final _subroute = RegExp(r'^\\/\\b([A-Za-z0-9_\\-~/]*)[^\\/|\\.|\\:]$');\n"
              "final _hostname = RegExp(r'^[a-zA-Z0-9-_\\\\.]+$');\n"
              "final _whitespace = RegExp(r'\\\\s+');")
          q = Path(p)
          q.write_text(q.read_text() + """
          /// Trims Local DNS names and joins them with a single space.
          String normalizeLocalDnsNames(String value) {
            final trimmed = value.trim();
            if (trimmed.isEmpty) return '';
            return trimmed.split(_whitespace).join(' ');
          }

          /// Whether [value] contains one or more valid whitespace-separated hostnames.
          bool isValidLocalDnsNames(String value) {
            final normalized = normalizeLocalDnsNames(value);
            if (normalized.isEmpty) return false;
            return normalized.split(' ').every(_hostname.hasMatch);
          }
          """.replace("\n          ", "\n"))

          # view model
          p = "lib/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel.dart"
          rep(p,
              "import 'package:pi_hole_client/domain/model/network/network.dart';\n"
              "import 'package:result_dart/result_dart.dart';",
              "import 'package:pi_hole_client/domain/model/network/network.dart';\n"
              "import 'package:pi_hole_client/utils/exceptions.dart';\n"
              "import 'package:pi_hole_client/utils/validators.dart';\n"
              "import 'package:result_dart/result_dart.dart';")
          rep(p,
              "  Future<void> _addRecord(LocalDns record) async {\n"
              "    final result = await _localDnsRepository.addRecord(",
              "  Future<void> _addRecord(LocalDns record) async {\n"
              "    if (_data.records.any((r) => _isSameRecord(r, record))) {\n"
              "      throw AlreadyExistsException('Local DNS record already exists.');\n"
              "    }\n\n"
              "    final result = await _localDnsRepository.addRecord(")
          rep(p,
              "  Future<void> _updateRecord(\n"
              "    ({LocalDns oldRecord, LocalDns newRecord}) params,\n"
              "  ) async {\n"
              "    final result = await _localDnsRepository.updateRecord(",
              "  Future<void> _updateRecord(\n"
              "    ({LocalDns oldRecord, LocalDns newRecord}) params,\n"
              "  ) async {\n"
              "    final index = _data.records.indexOf(params.oldRecord);\n"
              "    final others = [..._data.records];\n"
              "    if (index != -1) others.removeAt(index);\n"
              "    if (others.any((r) => _isSameRecord(r, params.newRecord))) {\n"
              "      throw AlreadyExistsException('Local DNS record already exists.');\n"
              "    }\n\n"
              "    final result = await _localDnsRepository.updateRecord(")
          rep(p,
              """      case Success():
                  _data = LocalDnsData(
                    records: [
                      for (final r in _data.records)
                        if (r == params.oldRecord) params.newRecord else r,
                    ],
                    deviceOptions: _data.deviceOptions,
                    cnameRecords: _data.cnameRecords,
                  );
                  notifyListeners();""",
              """      case Success():
                  final records = [..._data.records];
                  if (index != -1) records[index] = params.newRecord;
                  _data = LocalDnsData(
                    records: records,
                    deviceOptions: _data.deviceOptions,
                    cnameRecords: _data.cnameRecords,
                  );
                  notifyListeners();""")
          rep(p,
              """      case Success():
                  _data = LocalDnsData(
                    records: _data.records.where((r) => r != record).toList(),
                    deviceOptions: _data.deviceOptions,
                    cnameRecords: _data.cnameRecords,
                  );
                  notifyListeners();""",
              """      case Success():
                  final records = [..._data.records]..remove(record);
                  _data = LocalDnsData(
                    records: records,
                    deviceOptions: _data.deviceOptions,
                    cnameRecords: _data.cnameRecords,
                  );
                  notifyListeners();""")
          rep(p,
              "  Future<void> _addCnameRecord(CnameRecord record) async {",
              """  bool _isSameRecord(LocalDns a, LocalDns b) {
                return a.ip.trim() == b.ip.trim() &&
                    normalizeLocalDnsNames(a.name) == normalizeLocalDnsNames(b.name);
              }

              Future<void> _addCnameRecord(CnameRecord record) async {""".replace("\n              ", "\n"))

          # add modal
          p = "lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/add_local_dns_modal.dart"
          rep(p,
              "import 'package:pi_hole_client/ui/core/ui/components/auto_complate_field.dart';",
              "import 'package:pi_hole_client/ui/core/ui/components/auto_complate_field.dart';\n"
              "import 'package:pi_hole_client/utils/validators.dart';")
          rep(p, "final address = InternetAddress.tryParse(value);",
                 "final address = InternetAddress.tryParse(value.trim());")
          rep(p,
              "  /// Validate the host name format\n"
              "  void validateHostName(String? value) {\n"
              "    final locale = AppLocalizations.of(context)!;\n"
              "    if (value != null && value != '') {\n"
              "      final hostNameRegex = RegExp(r'^[a-zA-Z0-9-_\\\\.]+$');\n"
              "      if (hostNameRegex.hasMatch(value) == true) {",
              "  /// Validate one or more host names separated by whitespace.\n"
              "  void validateHostName(String? value) {\n"
              "    final locale = AppLocalizations.of(context)!;\n"
              "    if (value != null && value != '') {\n"
              "      if (isValidLocalDnsNames(value)) {")
          rep(p,
              "                          widget.addLocalDns({\n"
              "                            'ip': ipController.text,\n"
              "                            'name': hostNameController.text,\n"
              "                          });",
              "                          widget.addLocalDns({\n"
              "                            'ip': ipController.text.trim(),\n"
              "                            'name': normalizeLocalDnsNames(\n"
              "                              hostNameController.text,\n"
              "                            ),\n"
              "                          });")

          # edit modal
          p = "lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/edit_local_dns_modal.dart"
          rep(p,
              "import 'package:pi_hole_client/ui/core/ui/components/auto_complate_field.dart';",
              "import 'package:pi_hole_client/ui/core/ui/components/auto_complate_field.dart';\n"
              "import 'package:pi_hole_client/utils/validators.dart';")
          rep(p, "    if (value == widget.localDns.name) {",
                 "    if (normalizeLocalDnsNames(value ?? '') ==\n"
                 "        normalizeLocalDnsNames(widget.localDns.name)) {")
          rep(p,
              "        final hostNameRegex = RegExp(r'^[a-zA-Z0-9-_\\\\.]+$');\n"
              "        if (hostNameRegex.hasMatch(value) == true) {",
              "        if (isValidLocalDnsNames(value)) {")
          rep(p, "    if (value == widget.localDns.ip) {",
                 "    if (value?.trim() == widget.localDns.ip.trim()) {")
          rep(p, "final address = InternetAddress.tryParse(value);",
                 "final address = InternetAddress.tryParse(value.trim());")
          rep(p, "                                  name: localDnsController.text,",
                 "                                  name: normalizeLocalDnsNames(\n"
                 "                                    localDnsController.text,\n"
                 "                                  ),")
          rep(p, "                                  ip: localDnsController.text,",
                 "                                  ip: localDnsController.text.trim(),")

          # screen
          p = "lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_screen.dart"
          rep(p,
              "import 'package:pi_hole_client/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_list_view.dart';",
              "import 'package:pi_hole_client/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_list_view.dart';\n"
              "import 'package:pi_hole_client/utils/exceptions.dart';")
          rep(p,
              """    } catch (_) {
                if (!mounted) return false;
                process.close();
                showErrorSnackBar(
                  context: context,
                  appConfigViewModel: appConfigViewModel,
                  label: locale.localDnsAddFailed,""",
              """    } catch (error) {
                if (!mounted) return false;
                process.close();
                showErrorSnackBar(
                  context: context,
                  appConfigViewModel: appConfigViewModel,
                  label: error is AlreadyExistsException
                      ? locale.localDnsAlreadyAdded
                      : locale.localDnsAddFailed,""")
          rep(p,
              """    } catch (_) {
                if (!mounted) return false;
                process.close();
                showErrorSnackBar(
                  context: context,
                  appConfigViewModel: appConfigViewModel,
                  label: locale.localDnsUpdateFailed,""",
              """    } catch (error) {
                if (!mounted) return false;
                process.close();
                showErrorSnackBar(
                  context: context,
                  appConfigViewModel: appConfigViewModel,
                  label: error is AlreadyExistsException
                      ? locale.localDnsAlreadyAdded
                      : locale.localDnsUpdateFailed,""")

          # ARB changes; generated files are rebuilt by flutter gen-l10n.
          translations = {
              "app_en.arb": (
                  "Invalid hostname: only letters (a–z, A–Z), numbers (0–9), hyphen (-), underscore (_), and dot (.) are allowed. Separate multiple hostnames with spaces",
                  "Local DNS record already added"),
              "app_de.arb": (
                  "Ungültiger Hostname: Es sind nur Buchstaben (a–z, A–Z), Zahlen (0–9), Bindestriche (-), Unterstriche (_) und Punkte (.) erlaubt. Mehrere Hostnamen durch Leerzeichen trennen",
                  "Lokaler DNS-Eintrag ist bereits vorhanden"),
              "app_es.arb": (
                  "Nombre de host no válido: solo se permiten letras (a–z, A–Z), números (0–9), guiones (-), guiones bajos (_) y puntos (.). Separe varios nombres de host con espacios",
                  "El registro DNS local ya existe"),
              "app_ja.arb": (
                  "無効なホスト名: 使用できるのは英字 (a–z、A–Z)、数字 (0–9)、ハイフン (-)、アンダースコア (_) 、ドット (.) のみです。複数のホスト名はスペースで区切ってください".replace("(_) 、", "(_)、"),
                  "このローカルDNSレコードはすでに登録されています"),
              "app_pl.arb": (
                  "Nieprawidłowa nazwa hosta: dozwolone są tylko litery (a–z, A–Z), cyfry (0–9), myślnik (-), podkreślenie (_) i kropka (.). Wiele nazw hostów oddziel spacjami",
                  "Rekord lokalnego DNS już istnieje"),
          }
          for name, (invalid, duplicate) in translations.items():
              f = Path("lib/ui/core/l10n") / name
              out = []
              a = b = 0
              for line in f.read_text().splitlines():
                  if line.startswith('  "invalidHostname":'):
                      line = f'  "invalidHostname": {json.dumps(invalid, ensure_ascii=False)},'
                      a += 1
                  out.append(line)
                  if line.startswith('  "localDnsAddSuccess":'):
                      out.append(f'  "localDnsAlreadyAdded": {json.dumps(duplicate, ensure_ascii=False)},')
                      b += 1
              if (a, b) != (1, 1):
                  raise SystemExit(f"{name}: ARB anchors {(a,b)}")
              f.write_text("\n".join(out) + "\n")

          # validator tests
          p = "test/utils/validators_test.dart"
          marker = "  group('isValidSubroute', () {"
          block = """  group('normalizeLocalDnsNames', () {
            test('trims and collapses whitespace', () {
              expect(normalizeLocalDnsNames(' test '), 'test');
              expect(normalizeLocalDnsNames('test   ok'), 'test ok');
              expect(normalizeLocalDnsNames('test\\tok'), 'test ok');
            });

            test('returns empty for whitespace only', () {
              expect(normalizeLocalDnsNames('   '), '');
            });
          });

          group('isValidLocalDnsNames', () {
            test('accepts one or more valid hostnames', () {
              expect(isValidLocalDnsNames('nas'), isTrue);
              expect(isValidLocalDnsNames('nas nas.local my_host-1'), isTrue);
              expect(isValidLocalDnsNames(' nas  ok '), isTrue);
            });

            test('rejects invalid or empty hostnames', () {
              expect(isValidLocalDnsNames('test o!k'), isFalse);
              expect(isValidLocalDnsNames(''), isFalse);
              expect(isValidLocalDnsNames('   '), isFalse);
            });
          });

          """.replace("\n          ", "\n")
          rep(p, marker, block + marker)

          # viewmodel tests
          p = "test/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel_test.dart"
          imp = "import 'package:pi_hole_client/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel.dart';"
          rep(p, imp, imp + "\nimport 'package:pi_hole_client/utils/exceptions.dart';")
          marker = "    test('add/update/delete failures do not call global handler', () async {"
          block = """    group('duplicate records', () {
            const duplicates = [
              LocalDns(ip: '192.168.1.10', name: 'nas'),
              LocalDns(ip: '192.168.1.10', name: 'nas'),
              LocalDns(ip: '192.168.1.20', name: 'printer'),
            ];

            test('add rejects a normalized duplicate', () async {
              fakeLocalDnsRepository.records = const [
                LocalDns(ip: '192.168.1.10', name: 'test  ok'),
              ];
              await viewModel.loadRecords.runAsync();
              await expectLater(
                viewModel.addRecord.runAsync(
                  const LocalDns(ip: ' 192.168.1.10 ', name: ' test\\tok '),
                ),
                throwsA(isA<AlreadyExistsException>()),
              );
              expect(fakeLocalDnsRepository.addRecordCallCount, 0);
            });

            test('update rejects a value used by another record', () async {
              await viewModel.loadRecords.runAsync();
              await expectLater(
                viewModel.updateRecord.runAsync((
                  oldRecord: const LocalDns(ip: '192.168.1.101', name: 'printer1'),
                  newRecord: const LocalDns(ip: '192.168.1.100', name: 'server1'),
                )),
                throwsA(isA<AlreadyExistsException>()),
              );
              expect(fakeLocalDnsRepository.updateRecordCallCount, 0);
            });

            test('update changes only first identical record', () async {
              fakeLocalDnsRepository.records = duplicates;
              await viewModel.loadRecords.runAsync();
              await viewModel.updateRecord.runAsync((
                oldRecord: const LocalDns(ip: '192.168.1.10', name: 'nas'),
                newRecord: const LocalDns(ip: '192.168.1.10', name: 'nas2'),
              ));
              expect(viewModel.data.records, const [
                LocalDns(ip: '192.168.1.10', name: 'nas2'),
                LocalDns(ip: '192.168.1.10', name: 'nas'),
                LocalDns(ip: '192.168.1.20', name: 'printer'),
              ]);
            });

            test('delete removes only first identical record', () async {
              fakeLocalDnsRepository.records = duplicates;
              await viewModel.loadRecords.runAsync();
              await viewModel.deleteRecord.runAsync(
                const LocalDns(ip: '192.168.1.10', name: 'nas'),
              );
              expect(viewModel.data.records, const [
                LocalDns(ip: '192.168.1.10', name: 'nas'),
                LocalDns(ip: '192.168.1.20', name: 'printer'),
              ]);
            });
          });

          """.replace("\n          ", "\n")
          rep(p, marker, block + marker)

          # widget tests
          p = "test/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_widgets_test.dart"
          marker = "    testWidgets('Cancel button closes without submitting', ("
          block = """    testWidgets('normalizes multiple hostnames and trims IP on add', (
            WidgetTester tester,
          ) async {
            Map<String, dynamic>? submitted;
            await tester.pumpWidget(
              buildTestApp(
                AddLocalDnsModal(
                  addLocalDns: (data) => submitted = data,
                  window: false,
                  devices: _testDevices,
                ),
              ),
            );
            await tester.enterText(
              find.widgetWithText(TextField, 'Hostname'),
              ' test   ok ',
            );
            await tester.pump();
            await tester.enterText(
              find.widgetWithText(TextField, 'IP Address'),
              ' 192.168.1.50 ',
            );
            await tester.pump();
            await tester.tap(find.widgetWithText(TextButton, 'Add'));
            await tester.pump();
            expect(submitted!['name'], 'test ok');
            expect(submitted!['ip'], '192.168.1.50');
          });

          """.replace("\n          ", "\n")
          rep(p, marker, block + marker)
          q = Path(p)
          s = q.read_text()
          anchor = "      expect(confirmedName, 'new.hostname');\n    });\n\n"
          if s.count(anchor) != 1:
              raise SystemExit("widget edit anchor mismatch")
          block = """    testWidgets('normalizes multiple hostnames on edit', (
            WidgetTester tester,
          ) async {
            String? confirmedName;
            await tester.pumpWidget(
              buildTestApp(
                EditLocalDnsModal(
                  localDns: _testDns,
                  keyItem: 'name',
                  title: 'Edit hostname',
                  icon: Icons.computer_rounded,
                  onConfirm: (dns, _) => confirmedName = dns.name,
                  window: false,
                ),
              ),
            );
            await tester.enterText(
              find.widgetWithText(TextField, 'Hostname'),
              'pi.hole   pihole ',
            );
            await tester.pump();
            await tester.tap(find.widgetWithText(TextButton, 'Edit'));
            await tester.pump();
            expect(confirmedName, 'pi.hole pihole');
          });

          testWidgets('keeps edit disabled for whitespace-only change', (
            WidgetTester tester,
          ) async {
            await tester.pumpWidget(
              buildTestApp(
                EditLocalDnsModal(
                  localDns: _testDns,
                  keyItem: 'name',
                  title: 'Edit hostname',
                  icon: Icons.computer_rounded,
                  onConfirm: (_, _) {},
                  window: false,
                ),
              ),
            );
            await tester.enterText(
              find.widgetWithText(TextField, 'Hostname'),
              ' pi.hole ',
            );
            await tester.pump();
            final editButton = tester.widget<TextButton>(
              find.widgetWithText(TextButton, 'Edit'),
            );
            expect(editButton.onPressed, isNull);
            expect(find.textContaining('Invalid hostname'), findsNothing);
          });

          """.replace("\n          ", "\n")
          q.write_text(s.replace(anchor, anchor + block, 1))

          # triage
          p = "UPSTREAM_TRIAGE.md"
          row = (
              "| #734 | Local DNS multi-hostname + duplicate guard | Imported / fork-adapted | "
              "Selectively ported using the existing generic AlreadyExistsException, preserving "
              "CNAME support and first-match edit/delete semantics. Added normalized multi-hostname "
              "input plus focused validator/ViewModel/widget coverage. |\n"
          )
          rep(p, "| #660 |", row + "| #660 |")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Generate localizations and format
        shell: bash
        run: |
          flutter gen-l10n
          dart format \
            lib/utils/validators.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/add_local_dns_modal.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/edit_local_dns_modal.dart \
            lib/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_screen.dart \
            test/utils/validators_test.dart \
            test/ui/settings/server_settings/advanced_settings/local_dns/view_models/local_dns_viewmodel_test.dart \
            test/ui/settings/server_settings/advanced_settings/local_dns/widgets/local_dns_widgets_test.dart
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_TRIAGE.md lib test
          git commit -m "feat(local-dns): support multiple hostnames and duplicates"
          git push origin "HEAD:$GITHUB_REF_NAME"
