name: automation inspect shared error-state candidates
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-error-states.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect client error-state test hook
        shell: bash
        run: |
          echo '=== clients imports + error block ==='
          sed -n '1,45p' lib/ui/settings/server_settings/group_client/widgets/clients_list.dart
          grep -n -A35 -B5 'errorGenerator' lib/ui/settings/server_settings/group_client/widgets/clients_list.dart
          echo '=== fake client repository ==='
          sed -n '1,300p' test/testing/fakes/repositories/api/fake_client_repository.dart
          echo '=== clients view model ==='
          sed -n '1,320p' lib/ui/settings/server_settings/group_client/view_models/clients_viewmodel.dart
          echo '=== clients tests ==='
          sed -n '420,570p' test/ui/settings/server_settings/group_client/group_client_screen_test.dart
