name: automation inspect GroupsList error state
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-error-states.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GroupsList and tests
        run: |
          echo '=== groups_list imports ==='
          sed -n '1,45p' lib/ui/settings/server_settings/group_client/widgets/groups_list.dart
          echo '=== groups_list error block ==='
          sed -n '220,275p' lib/ui/settings/server_settings/group_client/widgets/groups_list.dart
          echo '=== clients_list corresponding block ==='
          sed -n '180,225p' lib/ui/settings/server_settings/group_client/widgets/clients_list.dart
          echo '=== candidate tests ==='
          find test -type f | grep -E 'group_client|groups_list|clients_list' || true
          grep -R -n -E 'GroupsList|dataFetchFailed|group.*error|loadGroups' test/ui/settings/server_settings/group_client 2>/dev/null | head -n 160 || true
