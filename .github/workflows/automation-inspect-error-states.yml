name: automation inspect duplicate error states
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-error-states.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find duplicate error states
        run: |
          echo '=== candidates ==='
          grep -R -n -E 'colorScheme\.error|Colors\.red|errorMessage|hasError|ErrorMessage' lib/ui --include='*.dart' | head -n 240 || true
