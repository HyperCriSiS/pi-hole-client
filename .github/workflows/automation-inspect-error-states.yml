name: automation inspect shared error-state candidates
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-error-states.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect client list error state and tests
        shell: bash
        run: |
          echo '=== clients_list.dart ==='
          sed -n '1,320p' lib/ui/settings/server_settings/group_client/widgets/clients_list.dart
          echo '=== shared ErrorMessage ==='
          grep -R -n -A80 -B10 'class ErrorMessage' lib/ui/core || true
          echo '=== related test error assertions ==='
          grep -n -A12 -B12 -E 'error|Error|clients|Clients' test/ui/settings/server_settings/group_client/group_client_screen_test.dart | head -n 500 || true
