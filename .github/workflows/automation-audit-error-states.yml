name: Automation audit remaining error states
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-audit-error-states.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Print roadmap
        run: cat ROADMAP.md
      - name: Validate remaining direct error icons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          allowed = {
              'lib/ui/core/ui/components/error_data_chart.dart',
              'lib/ui/core/ui/components/error_message.dart',
              'lib/ui/settings/server_settings/adlists/widgets/adlist_tile.dart',
              'lib/ui/settings/server_settings/adlists/widgets/gravity_update.dart',
              'lib/ui/servers/widgets/transport_security_indicator.dart',
          }
          hits = []
          for path in sorted(Path('lib').rglob('*.dart')):
              text = path.read_text()
              if 'Icons.error' in text:
                  hits.append(str(path))
          print('Direct Icons.error hits:')
          for hit in hits:
              print(hit)
          unexpected = set(hits) - allowed
          if unexpected:
              raise SystemExit(f'Unexpected direct error icon implementations: {sorted(unexpected)}')
          PY
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD