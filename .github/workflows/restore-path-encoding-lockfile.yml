name: Restore path-encoding lockfile once

on:
  push:
    branches:
      - roadmap/generated-path-encoding
    paths:
      - .github/workflows/restore-path-encoding-lockfile.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: roadmap/generated-path-encoding
          fetch-depth: 0

      - name: Restore lockfile from main and self-remove
        run: |
          git fetch origin main
          git checkout origin/main -- pubspec.lock
          rm .github/workflows/restore-path-encoding-lockfile.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: restore unchanged dependency lockfile'
          git push origin HEAD:roadmap/generated-path-encoding
