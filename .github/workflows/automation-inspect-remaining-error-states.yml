name: Automation migrate legal shared error state
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-inspect-remaining-error-states.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Migrate LegalScreen to shared ErrorMessage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ui/settings/about/widgets/legal_screen.dart')
          source = path.read_text()
          import_anchor = "import 'package:pi_hole_client/ui/core/l10n/generated/app_localizations.dart';\n"
          import_line = "import 'package:pi_hole_client/ui/core/ui/components/error_message.dart';\n"

          condition = "snapshot.data!.isEmpty) {"
          condition_pos = source.find(condition)
          if condition_pos < 0:
              raise SystemExit('LegalScreen error condition not found')
          start = source.find('return Center(', condition_pos)
          end_marker = "\n              }\n\n              return Padding("
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('LegalScreen legacy error block boundaries not found')
          legacy = source[start:end]
          required = [
              'Icon(',
              'Icons.error',
              'AppLocalizations.of(context)!.noticeError',
              'AppLocalizations.of(context)!.noticeErrorDetail',
          ]
          missing = [needle for needle in required if needle not in legacy]
          if missing:
              raise SystemExit(f'unexpected LegalScreen error block; missing {missing}')
          if source.count('return Center(') < 1:
              raise SystemExit('expected legacy Center error state')

          indent = source[source.rfind('\n', 0, start) + 1:start]
          replacement = (
              'return ErrorMessage(\n'
              f'{indent}  message: AppLocalizations.of(context)!.noticeErrorDetail,\n'
              f'{indent});'
          )
          source = source[:start] + replacement + source[end:]
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('localization import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)
          path.write_text(source)

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          old_current = "The active maintenance branch is `dev` and is tracked by PR #2 into `main`. `UPSTREAM_TRIAGE.md` remains the detailed issue/PR triage reference; this file is the project-level execution roadmap and source of truth for future work. Work on #638 is underway: five duplicated error states have been migrated to the shared `ErrorMessage` component (Find Domains in Lists, ClientsList, GroupsList, StatisticsList, and DnsTab), while the broader incremental screen migration remains open."
          new_current = "The active maintenance branch is `dev` and is tracked by PR #2 into `main`. `UPSTREAM_TRIAGE.md` remains the detailed issue/PR triage reference; this file is the project-level execution roadmap and source of truth for future work. Work on #638 is underway with twelve verified migrations to the shared `ErrorMessage` component; the remaining specialized error presentations must be reviewed before closing the broader incremental migration."
          if old_current not in text:
              raise SystemExit('expected ROADMAP current-status text not found')
          text = text.replace(old_current, new_current, 1)

          anchor = '- [x] Migrate `QueriesLastHoursBar` to the shared `ErrorMessage` component and keep `home_charts_test.dart` green.\n'
          entry = '- [x] Migrate `LegalScreen` to the shared `ErrorMessage` component and keep `legal_screen_test.dart` green.\n'
          if entry not in text:
              if anchor not in text:
                  raise SystemExit('ROADMAP automation-maintenance insertion anchor not found')
              text = text.replace(anchor, anchor + entry, 1)

          old_status = '**Not fully completed.** #604 and #404 are implemented and validated. #638 is in progress with eleven verified shared-error-state migrations complete. `QueriesLastHoursLine` and `QueriesLastHoursBar` are migrated and validated; identify the next duplicated error-state candidate before the next refactor.'
          new_status = '**Not fully completed.** #604 and #404 are implemented and validated. #638 is in progress with twelve verified shared-error-state migrations complete. `LegalScreen` is migrated and validated; review the remaining specialized error presentations before closing #638.'
          if old_status not in text:
              raise SystemExit('expected ROADMAP completion status not found')
          text = text.replace(old_status, new_status, 1)
          roadmap.write_text(text)
          PY
          dart format lib/ui/settings/about/widgets/legal_screen.dart
      - name: Run focused Flutter test
        run: |
          cp .env.sample .env
          flutter pub get
          flutter test test/ui/settings/about/legal_screen_test.dart
      - name: Commit validated migration and self-remove
        run: |
          rm .github/workflows/automation-inspect-remaining-error-states.yml
          git checkout -- pubspec.lock analysis_options.yaml || true
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add lib/ui/settings/about/widgets/legal_screen.dart ROADMAP.md .github/workflows/automation-inspect-remaining-error-states.yml
          git diff --cached --check
          git commit -m 'refactor: reuse shared error state in legal screen'
          git push origin HEAD:dev
