name: Automation inspect roadmap error migration section
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-inspect-remaining-error-states.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Show roadmap shared-error section
        run: |
          grep -n -B 8 -A 45 "eleven verified\|QueriesLastHoursBar\|#638" ROADMAP.md | head -220
