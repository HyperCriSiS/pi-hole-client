name: Automation inspect legal error state migration
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-inspect-remaining-error-states.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Show legal screen and focused test
        run: |
          echo '=== legal_screen.dart ==='
          cat lib/ui/settings/about/widgets/legal_screen.dart
          echo '=== legal_screen_test.dart ==='
          cat test/ui/settings/about/legal_screen_test.dart
          echo '=== ErrorMessage imports/usages nearby ==='
          grep -R -n "error_message.dart\|ErrorMessage(" lib/ui/settings/about lib/ui/settings | head -80 || true
