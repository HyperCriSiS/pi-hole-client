name: Automation inspect remaining shared error candidates
"on":
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-inspect-remaining-error-states.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Find remaining custom error-state candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needles = (
              'Icons.error',
              'Icons.error_outline',
              'Colors.red',
          )
          found = 0
          for path in sorted(Path('lib/ui').rglob('*.dart')):
              lines = path.read_text().splitlines()
              hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
              if not hits:
                  continue
              found += len(hits)
              print(f'\n=== {path} ===')
              emitted = set()
              for hit in hits:
                  start = max(0, hit - 10)
                  end = min(len(lines), hit + 16)
                  for i in range(start, end):
                      if i in emitted:
                          continue
                      emitted.add(i)
                      print(f'{i + 1:4}: {lines[i]}')
          print(f'\nTOTAL_HITS={found}')
          PY
