name: Apply upstream v5 fallback navigation fix

on:
  push:
    branches:
      - upstream/v5-fallback-back-button-20260925

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/v5-fallback-back-button-20260925
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply exact upstream #751 diff
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit=34615fbff60fc60c1447a854630f219bfb729d9b
          git fetch --no-tags https://github.com/tsutsu3/pi-hole-client.git "$upstream_commit"
          git diff "$upstream_commit^" "$upstream_commit" --             lib/routing/app_router.dart             lib/routing/server_scoped_route.dart             test/routing/server_scoped_route_test.dart             > /tmp/upstream-751.patch
          git apply --3way /tmp/upstream-751.patch

      - name: Validate selective port
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          cp .env.sample .env
          dart format lib/routing/app_router.dart lib/routing/server_scoped_route.dart test/routing/server_scoped_route_test.dart
          flutter test test/routing/server_scoped_route_test.dart

      - name: Commit port and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-upstream-751.yml
          git add             lib/routing/app_router.dart             lib/routing/server_scoped_route.dart             test/routing/server_scoped_route_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(routing): restore back navigation on v5 fallbacks"
          git push origin HEAD:upstream/v5-fallback-back-button-20260925
