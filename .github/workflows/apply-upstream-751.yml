name: Apply upstream v5 fallback navigation fix

on:
  push:
    branches:
      - upstream/v5-fallback-back-button-20260925

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/v5-fallback-back-button-20260925

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply selective upstream #751 port
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block missing in {path}")
              file.write_text(text.replace(old, new, 1))

          scoped = "lib/routing/server_scoped_route.dart"
          replace_once(
              scoped,
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:go_router/go_router.dart';\n",
          )
          replace_once(
              scoped,
              "import 'package:pi_hole_client/domain/model/server/server.dart';\n",
              "import 'package:pi_hole_client/domain/model/server/server.dart';\nimport 'package:pi_hole_client/routing/routes.dart';\n",
          )
          replace_once(
              scoped,
              '''    required this.builder,
                  this.required = RequiredApiVersion.any,
                  super.key,
          ''',
              '''    required this.builder,
                  this.required = RequiredApiVersion.any,
                  this.showBackButton = false,
                  super.key,
          ''',
          )
          replace_once(
              scoped,
              '''  /// Minimum API version required by the wrapped screen.
                final RequiredApiVersion required;

          ''',
              '''  /// Minimum API version required by the wrapped screen.
                final RequiredApiVersion required;

                /// Always show an explicit back button on fallback scaffolds.
                final bool showBackButton;

          ''',
          )
          replace_once(
              scoped,
              '''    if (bundle == null || server == null) {
                    return Scaffold(
                      appBar: AppBar(title: Text(title)),
                      body: const SafeArea(child: EmptyDataScreen()),
                    );
                  }

                  if (required == RequiredApiVersion.v6Only &&
                      server.apiVersion == SupportedApiVersions.v5) {
                    return Scaffold(
                      appBar: AppBar(title: Text(title)),
                      body: const SafeArea(child: PiHoleV5NotSupportedScreen()),
                    );
                  }

                  return KeyedSubtree(key: ObjectKey(server), child: builder(bundle, server));
                }
          ''',
              '''    if (bundle == null || server == null) {
                    return _fallbackScaffold(context, const EmptyDataScreen());
                  }

                  if (required == RequiredApiVersion.v6Only &&
                      server.apiVersion == SupportedApiVersions.v5) {
                    return _fallbackScaffold(context, const PiHoleV5NotSupportedScreen());
                  }

                  return KeyedSubtree(key: ObjectKey(server), child: builder(bundle, server));
                }

                Widget _fallbackScaffold(BuildContext context, Widget body) {
                  return Scaffold(
                    appBar: AppBar(
                      automaticallyImplyLeading: !showBackButton,
                      leading: showBackButton
                          ? BackButton(
                              onPressed: () {
                                if (context.canPop()) {
                                  context.pop();
                                  return;
                                }
                                context.goNamed(Routes.home);
                              },
                            )
                          : null,
                      title: Text(title),
                    ),
                    body: SafeArea(child: body),
                  );
                }
          ''',
          )

          router = "lib/routing/app_router.dart"
          for title in ("adlists", "advancedSetup", "network"):
              replace_once(
                  router,
                  f"                          title: AppLocalizations.of(context)!.{title},\n"
                  "                          required: RequiredApiVersion.v6Only,\n",
                  f"                          title: AppLocalizations.of(context)!.{title},\n"
                  "                          required: RequiredApiVersion.v6Only,\n"
                  "                          showBackButton: true,\n",
              )

          test = "test/routing/server_scoped_route_test.dart"
          replace_once(
              test,
              "import 'package:flutter/material.dart';\n",
              "import 'dart:async';\n\nimport 'package:flutter/material.dart';\n",
          )
          replace_once(
              test,
              "import 'package:flutter_test/flutter_test.dart';\n",
              "import 'package:flutter_test/flutter_test.dart';\nimport 'package:go_router/go_router.dart';\n",
          )
          replace_once(
              test,
              "import 'package:pi_hole_client/domain/model/server/server.dart';\n",
              "import 'package:pi_hole_client/domain/model/server/server.dart';\nimport 'package:pi_hole_client/routing/routes.dart';\n",
          )
          replace_once(
              test,
              '''  );
                }

                void main() async {
          ''',
              '''  );
                }

                Widget _wrapWithRouter({
                  required GoRouter router,
                  required FakeServersViewModel serversViewModel,
                  required RepositoryBundle? bundle,
                }) {
                  return MultiProvider(
                    providers: [
                      ChangeNotifierProvider<ServersViewModel>.value(value: serversViewModel),
                      Provider<RepositoryBundle?>.value(value: bundle),
                    ],
                    child: MaterialApp.router(
                      theme: lightTheme(null),
                      locale: const Locale('en'),
                      supportedLocales: AppLocalizations.supportedLocales,
                      localizationsDelegates: AppLocalizations.localizationsDelegates,
                      routerConfig: router,
                    ),
                  );
                }

                GoRouter _router({required String initialLocation, required Widget page}) {
                  return GoRouter(
                    initialLocation: initialLocation,
                    routes: [
                      GoRoute(
                        path: '/home',
                        name: Routes.home,
                        builder: (_, _) => const Text('HOME'),
                      ),
                      GoRoute(path: '/page', builder: (_, _) => page),
                    ],
                  );
                }

                void main() async {
          ''',
          )
          file = Path(test)
          text = file.read_text()
          marker = "  });\n}\n"
          if not text.endswith(marker):
              raise SystemExit("unexpected server_scoped_route_test.dart ending")
          tests = '''    group('showBackButton', () {
                    Widget unused(RepositoryBundle _, Server _) => const Text('DUMMY');

                    testWidgets('falls back to home when there is nothing to pop', (tester) async {
                      final vm = FakeServersViewModel()..selectedServer = _v5Server;
                      final bundle = createFakeRepositoryBundle(apiVersion: 'v5');
                      final page = ServerScopedRoute(
                        title: 'Adlists',
                        required: RequiredApiVersion.v6Only,
                        showBackButton: true,
                        builder: unused,
                      );
                      final router = _router(initialLocation: '/page', page: page);

                      await tester.pumpWidget(
                        _wrapWithRouter(router: router, serversViewModel: vm, bundle: bundle),
                      );

                      expect(find.byType(PiHoleV5NotSupportedScreen), findsOneWidget);
                      expect(find.byType(BackButton), findsOneWidget);

                      await tester.tap(find.byType(BackButton));
                      await tester.pumpAndSettle();

                      expect(find.text('HOME'), findsOneWidget);
                      expect(router.canPop(), isFalse);
                    });

                    testWidgets('pops to the previous page when possible', (tester) async {
                      final vm = FakeServersViewModel()..selectedServer = _v5Server;
                      final bundle = createFakeRepositoryBundle(apiVersion: 'v5');
                      final page = ServerScopedRoute(
                        title: 'Adlists',
                        required: RequiredApiVersion.v6Only,
                        showBackButton: true,
                        builder: unused,
                      );
                      final router = _router(initialLocation: '/home', page: page);

                      await tester.pumpWidget(
                        _wrapWithRouter(router: router, serversViewModel: vm, bundle: bundle),
                      );
                      unawaited(router.push('/page'));
                      await tester.pumpAndSettle();

                      await tester.tap(find.byType(BackButton));
                      await tester.pumpAndSettle();

                      expect(find.text('HOME'), findsOneWidget);
                      expect(router.canPop(), isFalse);
                    });

                    testWidgets('keeps legacy fallback behavior when disabled', (tester) async {
                      final vm = FakeServersViewModel()..selectedServer = _v5Server;
                      final bundle = createFakeRepositoryBundle(apiVersion: 'v5');
                      final page = ServerScopedRoute(
                        title: 'Adlists',
                        required: RequiredApiVersion.v6Only,
                        builder: unused,
                      );
                      final router = _router(initialLocation: '/page', page: page);

                      await tester.pumpWidget(
                        _wrapWithRouter(router: router, serversViewModel: vm, bundle: bundle),
                      );

                      expect(find.byType(BackButton), findsNothing);
                    });
                  });

          '''
          file.write_text(text[:-len(marker)] + tests + marker)

      - name: Validate selective port
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          cp .env.sample .env
          dart format lib/routing/app_router.dart lib/routing/server_scoped_route.dart test/routing/server_scoped_route_test.dart
          flutter test test/routing/server_scoped_route_test.dart

      - name: Commit port and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-upstream-751.yml
          git add             lib/routing/app_router.dart             lib/routing/server_scoped_route.dart             test/routing/server_scoped_route_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(routing): restore back navigation on v5 fallbacks"
          git push origin HEAD:upstream/v5-fallback-back-button-20260925
