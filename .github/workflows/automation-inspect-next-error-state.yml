name: automation inspect next shared error state
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-next-error-state.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect remaining custom error states
        run: |
          echo '=== custom Icons.error uses ==='
          grep -R -n -E 'Icons\.error|Colors\.red' lib/ui --include='*.dart' || true
          echo '=== shared ErrorMessage uses ==='
          grep -R -n 'ErrorMessage' lib/ui --include='*.dart' || true
          echo '=== candidate files ==='
          for f in lib/ui/statistics/widgets/dns_tab.dart lib/ui/statistics/widgets/statistics_queries_servers_tab.dart; do
            if [ -f "$f" ]; then echo "--- $f"; sed -n '1,240p' "$f"; fi
          done
      - name: Remove helper
        run: |
          rm .github/workflows/automation-inspect-next-error-state.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add .github/workflows/automation-inspect-next-error-state.yml
          git commit -m 'ci: remove error-state inspection helper'
          git push origin HEAD:dev
