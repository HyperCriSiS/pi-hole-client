name: Repair v6 client-name filter branch

on:
  push:
    branches:
      - roadmap/v6-client-name-filter

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/v6-client-name-filter
          fetch-depth: 0

      - name: Restore overwritten files and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            lib/ui/logs/view_models/logs_viewmodel.dart \
            test/ui/logs/view_models/logs_viewmodel_test.dart \
            test/data/model/v6/metrics/query_filter_test.dart \
            test/data/repositories/api/v6/metrics_repository_test.dart

          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/ui/logs/view_models/logs_viewmodel.dart')
          s = p.read_text()
          old = '''    String? clientIp;\n    final hasActiveClientFilter =\n        selectedClients.isNotEmpty &&\n        selectedClients.length < totalClients.length;\n    if (hasActiveClientFilter && selectedClients.length == 1) {\n      final selectedClient = selectedClients.single;\n      if (InternetAddress.tryParse(selectedClient) != null) {\n        clientIp = selectedClient;\n      }\n    }\n\n    final filter = V6QueryFilter(\n      domain: selectedDomain,\n      clientIp: clientIp,\n      status: status,\n    );\n'''
          new = '''    String? clientIp;\n    String? clientName;\n    final hasActiveClientFilter =\n        selectedClients.isNotEmpty &&\n        selectedClients.length < totalClients.length;\n    if (hasActiveClientFilter && selectedClients.length == 1) {\n      final selectedClient = selectedClients.single;\n      if (InternetAddress.tryParse(selectedClient) != null) {\n        clientIp = selectedClient;\n      } else {\n        clientName = selectedClient;\n      }\n    }\n\n    final filter = V6QueryFilter(\n      domain: selectedDomain,\n      clientIp: clientIp,\n      clientName: clientName,\n      status: status,\n    );\n'''
          if old not in s:
              raise SystemExit('logs_viewmodel patch anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/ui/logs/view_models/logs_viewmodel_test.dart')
          s = p.read_text()
          old = '''    test('v6 hostname client retains client-side semantics', () async {\n      final vm = _buildVm(\n        apiVersion: 'v6',\n        overrideFactory: ({required MetricsRepository repository}) => service,\n      );\n      await _initAndLoad(vm);\n      vm.setClients(['router.lan', '192.168.1.11']);\n      vm.setSelectedClients(['router.lan']);\n      await vm.applyFilterAndLoad();\n      expect(service.lastFilter?.clientIp, isNull);\n      vm.dispose();\n    });\n'''
          new = '''    test('v6 single hostname client is pushed server-side', () async {\n      final vm = _buildVm(\n        apiVersion: 'v6',\n        overrideFactory: ({required MetricsRepository repository}) => service,\n      );\n      await _initAndLoad(vm);\n      vm.setClients(['router.lan', '192.168.1.11']);\n      vm.setSelectedClients(['router.lan']);\n      await vm.applyFilterAndLoad();\n      expect(service.lastFilter?.clientIp, isNull);\n      expect(service.lastFilter?.clientName, 'router.lan');\n      vm.dispose();\n    });\n'''
          if old not in s:
              raise SystemExit('hostname test anchor not found')
          s = s.replace(old, new, 1)
          old = '''      expect(service.lastFilter?.clientIp, isNull);\n      vm.dispose();\n    });\n\n    test('v6 all-selected single client is not pushed server-side', () async {\n'''
          new = '''      expect(service.lastFilter?.clientIp, isNull);\n      expect(service.lastFilter?.clientName, isNull);\n      vm.dispose();\n    });\n\n    test('v6 all-selected single client is not pushed server-side', () async {\n'''
          if old not in s:
              raise SystemExit('multiple-client test anchor not found')
          s = s.replace(old, new, 1)
          old = '''      expect(service.lastFilter?.clientIp, isNull);\n      vm.dispose();\n    });\n\n    test(\n      'v6 chip reset reloads after clearing a server-side domain filter',\n'''
          new = '''      expect(service.lastFilter?.clientIp, isNull);\n      expect(service.lastFilter?.clientName, isNull);\n      vm.dispose();\n    });\n\n    test(\n      'v6 chip reset reloads after clearing a server-side domain filter',\n'''
          if old not in s:
              raise SystemExit('all-selected test anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/data/model/v6/metrics/query_filter_test.dart')
          s = p.read_text()
          s = s.replace("        clientIp: '127.0.0.1',\n", "        clientIp: '127.0.0.1',\n        clientName: 'router.lan',\n", 1)
          s = s.replace("        'client_ip': '127.0.0.1',\n", "        'client_ip': '127.0.0.1',\n        'client_name': 'router.lan',\n", 1)
          s = s.replace("      const filter = V6QueryFilter(domain: '  ', status: '', clientIp: null);\n", "      const filter = V6QueryFilter(\n        domain: '  ',\n        status: '',\n        clientIp: null,\n        clientName: ' ',\n      );\n", 1)
          s = s.replace("        clientIp: ' 192.0.2.1 ',\n", "        clientIp: ' 192.0.2.1 ',\n        clientName: ' router.lan ',\n", 1)
          s = s.replace("        'client_ip': '192.0.2.1',\n", "        'client_ip': '192.0.2.1',\n        'client_name': 'router.lan',\n", 1)
          p.write_text(s)

          p = Path('test/data/repositories/api/v6/metrics_repository_test.dart')
          s = p.read_text()
          s = s.replace("          clientIp: ' 192.0.2.10 ',\n", "          clientIp: ' 192.0.2.10 ',\n          clientName: ' router.lan ',\n", 1)
          s = s.replace("      expect(service.lastQueriesClientIp, '192.0.2.10');\n", "      expect(service.lastQueriesClientIp, '192.0.2.10');\n      expect(service.lastQueriesClientName, 'router.lan');\n", 1)
          s = s.replace("      expect(service.lastQueriesClientName, isNull);\n", '', 1)
          s = s.replace("        filter: const V6QueryFilter(domain: ' ', clientIp: ''),\n", "        filter: const V6QueryFilter(\n          domain: ' ',\n          clientIp: '',\n          clientName: '  ',\n        ),\n", 1)
          anchor = "      expect(service.lastQueriesClientIp, isNull);\n    });\n"
          if anchor not in s:
              raise SystemExit('empty-filter test anchor not found')
          s = s.replace(anchor, "      expect(service.lastQueriesClientIp, isNull);\n      expect(service.lastQueriesClientName, isNull);\n    });\n", 1)
          p.write_text(s)
          PY

          if grep -R --line-number --fixed-strings 'PLACEHOLDER' \
            lib/ui/logs/view_models/logs_viewmodel.dart \
            test/ui/logs/view_models/logs_viewmodel_test.dart \
            test/data/model/v6/metrics/query_filter_test.dart \
            test/data/repositories/api/v6/metrics_repository_test.dart; then
            echo 'placeholder content still present' >&2
            exit 1
          fi

          git rm .github/workflows/repair-v6-client-name-filter.yml
          git diff --check

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/ui/logs/view_models/logs_viewmodel.dart \
            test/ui/logs/view_models/logs_viewmodel_test.dart \
            test/data/model/v6/metrics/query_filter_test.dart \
            test/data/repositories/api/v6/metrics_repository_test.dart \
            .github/workflows/repair-v6-client-name-filter.yml
          git commit -m 'fix: restore and apply v6 client-name filter patch'
          git push origin HEAD:roadmap/v6-client-name-filter
