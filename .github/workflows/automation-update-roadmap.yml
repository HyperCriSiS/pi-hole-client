name: automation update client error-state roadmap
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-update-roadmap.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev}
      - name: Update roadmap
        shell: python
        run: |
          from pathlib import Path
          p=Path('ROADMAP.md'); s=p.read_text()
          needle='## Blockers / dependencies\n'
          line='- [x] Migrate the group/client `ClientsList` load failure to the shared `ErrorMessage` widget; focused `group_client_screen_test.dart` passes (`280cf3d2`).\n'
          if line not in s:
              if needle not in s: raise SystemExit('roadmap section anchor missing')
              s=s.replace(needle,line+'\n'+needle,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record client list error-state migration'
            git push origin HEAD:dev
          fi
