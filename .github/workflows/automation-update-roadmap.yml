name: automation update shared error-state roadmap
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-update-roadmap.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Record validated first migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          note = '- [x] Migrate the Find Domains in Lists error result to the shared `ErrorMessage` component and keep the focused screen test green (`809ba6cc`).'
          if note not in s:
              lines = s.splitlines()
              idx = next((i for i, line in enumerate(lines) if '#638' in line), None)
              if idx is None:
                  raise SystemExit('Could not find #638 roadmap marker')
              lines.insert(idx + 1, note)
              s = '\n'.join(lines) + '\n'
          p.write_text(s)
          PY
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add ROADMAP.md
          git commit -m "docs: record first shared error-state migration"
          git push origin HEAD:dev
