name: Repair v6 filter migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch files
        shell: bash
        run: |
          set -euo pipefail
          git show 7319bd7594db29408068562adb904ddd62e4d9fe:lib/ui/logs/view_models/logs_viewmodel.dart > lib/ui/logs/view_models/logs_viewmodel.dart
          git show 7319bd7594db29408068562adb904ddd62e4d9fe:test/domain/services/logs_pagination_service_test.dart > test/domain/services/logs_pagination_service_test.dart
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/ui/logs/view_models/logs_viewmodel.dart')
          s = p.read_text()
          s = s.replace(
              "import 'package:pi_hole_client/data/repositories/api/interfaces/domain_repository.dart';",
              "import 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';\nimport 'package:pi_hole_client/data/repositories/api/interfaces/domain_repository.dart';",
          )
          anchor = "  // ------------------------------------------\n  // Load management\n  // ------------------------------------------\n"
          helper = """  V6QueryFilter? _buildServerQueryFilter() {\n    if (_apiVersion != SupportedApiVersions.v6) return null;\n\n    String? status;\n    if (statusSelected.length == 1) {\n      final selectedIndex = statusSelected.single;\n      status = queryStatusesV6\n          .firstWhere((entry) => entry.index == selectedIndex)\n          .key;\n    }\n\n    final filter = V6QueryFilter(domain: selectedDomain, status: status);\n    return filter.isEmpty ? null : filter;\n  }\n\n"""
          assert anchor in s
          s = s.replace(anchor, helper + anchor)
          old = """    final now = DateTime.now();\n    final start = _getWindowStart(now);\n    _paginationService!.reset(start, now);"""
          new = """    final now = DateTime.now();\n    final start = _getWindowStart(now);\n    _paginationService!\n      ..setFilter(_buildServerQueryFilter())\n      ..reset(start, now);"""
          assert old in s
          s = s.replace(old, new)
          old = """    if (inStartTime != null || inEndTime != null) {\n      _enableNextWindow = false;\n      _paginationService!.reset(startTime, endTime);\n      _resetLogsCache();\n\n      final newLogs = await _paginationService!.loadNextPage();\n      if (!_isCurrentServerEpoch(serverEpoch)) return;\n      logger.d('Loaded ${newLogs.length} logs from $startTime to $endTime');\n\n      _addLogs(newLogs);\n    }"""
          new = """    final serverFilter = _buildServerQueryFilter();\n    final hasExplicitTimeRange = inStartTime != null || inEndTime != null;\n    final shouldReloadFromServer =\n        hasExplicitTimeRange || _apiVersion == SupportedApiVersions.v6;\n\n    if (shouldReloadFromServer) {\n      _enableNextWindow = !hasExplicitTimeRange;\n      _paginationService!\n        ..setFilter(serverFilter)\n        ..reset(startTime, endTime);\n      _resetLogsCache();\n\n      final newLogs = await _paginationService!.loadNextPage();\n      if (!_isCurrentServerEpoch(serverEpoch)) return;\n      logger.d('Loaded ${newLogs.length} logs from $startTime to $endTime');\n\n      _addLogs(newLogs);\n    }"""
          assert old in s
          s = s.replace(old, new)
          old = """  void resetLogs() {\n    _enableNextWindow = true;"""
          new = """  void resetLogs() {\n    _paginationService?.setFilter(null);\n    _enableNextWindow = true;"""
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('test/domain/services/logs_pagination_service_test.dart')
          s = p.read_text()
          s = s.replace(
              "import 'package:flutter_test/flutter_test.dart';",
              "import 'package:flutter_test/flutter_test.dart';\nimport 'package:pi_hole_client/data/model/v6/metrics/query_filter.dart';",
          )
          anchor = "/// Builds a minimal [Log] with the given id.\n"
          fake = """class _FakeFilteredMetricsRepository extends _FakeMetricsRepository\n    implements FilteredMetricsRepository {\n  _FakeFilteredMetricsRepository(List<Result<Logs>> responses)\n    : super(responses);\n\n  V6QueryFilter? lastFilter;\n\n  @override\n  Future<Result<Logs>> fetchQueriesFiltered({\n    required DateTime from,\n    required DateTime until,\n    int? length = 100,\n    int? cursor,\n    int? start,\n    V6QueryFilter? filter,\n  }) {\n    lastFilter = filter;\n    return fetchQueries(\n      from: from,\n      until: until,\n      length: length,\n      cursor: cursor,\n      start: start,\n    );\n  }\n}\n\n"""
          assert anchor in s
          s = s.replace(anchor, fake + anchor)
          group = """\n  group('LogsPaginationService – optional server filter capability', () {\n    test('forwards filter to repositories that support server filtering', () async {\n      final repo = _FakeFilteredMetricsRepository([\n        Success(_v6Logs([_log(1)], cursor: 42)),\n      ]);\n      final svc = LogsPaginationService(repository: repo);\n      const filter = V6QueryFilter(domain: 'example.com', status: 'FORWARDED');\n\n      svc.setFilter(filter);\n      svc.reset(start, end);\n      await svc.loadNextPage();\n\n      expect(repo.lastFilter, same(filter));\n    });\n\n    test('keeps the existing path for repositories without filter support', () async {\n      final repo = _FakeMetricsRepository([Success(_v5Logs([_log(1)]))]);\n      final svc = LogsPaginationService(repository: repo);\n\n      svc.setFilter(const V6QueryFilter(domain: 'example.com'));\n      svc.reset(start, end);\n      final logs = await svc.loadNextPage();\n\n      expect(logs, hasLength(1));\n      expect(svc.finished, LoadStatus.loaded);\n    });\n  });\n"""
          pos = s.rfind('\n}')
          assert pos != -1
          s = s[:pos] + group + s[pos:]
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/logs/view_models/logs_viewmodel.dart test/domain/services/logs_pagination_service_test.dart
          git commit -m "fix: restore v6 filter migration files"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-v6-filter-migration.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
