name: Compile and release production build

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-version:
    name: Extract Version from pubspec.yaml
    runs-on: ubuntu-latest
    if: (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-v')) || github.event_name == 'workflow_dispatch'
    outputs:
      VERSION_NAME: ${{ steps.extract_version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ steps.extract_version.outputs.VERSION_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION_FULL | cut -d '+' -f 1)
          VERSION_NUMBER=$(echo $VERSION_FULL | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "Extracted Version Name: $VERSION_NAME"
          echo "Extracted Version Number: $VERSION_NUMBER"

  build-android:
    name: Build Android .apk and .aab
    runs-on: ubuntu-latest
    needs: get-version
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
      ANDROID_AAB_RELEASE_PATH: build/app/outputs/bundle/release
      ANDROID_APK_RELEASE_PATH: build/app/outputs/apk/release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - run: flutter clean
      - run: flutter pub get

      - name: Copy .env file
        run: cp .env.sample .env

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_JKS_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: mv $ANDROID_APK_RELEASE_PATH/app-release.apk PiHoleClient_${{ env.VERSION_NAME }}_Android.apk

      - name: Rename AAB
        run: mv $ANDROID_AAB_RELEASE_PATH/app-release.aab PiHoleClient_${{ env.VERSION_NAME }}_Android.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            PiHoleClient_${{ env.VERSION_NAME }}_Android.apk
            PiHoleClient_${{ env.VERSION_NAME }}_Android.aab

  build-linux:
    name: Build Linux .tar.gz and .deb
    runs-on: ubuntu-latest
    needs: get-version
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
      LINUX_RELEASE_PATH: build/linux/x64/release/bundle
      DEBIAN_RELEASE_PATH: build/linux/x64/release/debian

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - run: flutter clean
      - run: flutter pub get

      - name: Copy .env file
        run: cp .env.sample .env

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Prepare .tar.gz package
        run: |
          cp assets/img/pi-hole-client-icon.png $LINUX_RELEASE_PATH
          cp linux/io.github.tsutsu3.pi_hole_client.desktop $LINUX_RELEASE_PATH
          tar czf PiHoleClient_${{ env.VERSION_NAME }}_Linux_x64.tar.gz -C $LINUX_RELEASE_PATH .

      - name: Prepare Debian package
        run: |
          mkdir -p $DEBIAN_RELEASE_PATH/DEBIAN
          mkdir -p $DEBIAN_RELEASE_PATH/usr/bin
          mkdir -p $DEBIAN_RELEASE_PATH/usr/lib/pi-hole-client
          mkdir -p $DEBIAN_RELEASE_PATH/usr/share/applications
          mkdir -p $DEBIAN_RELEASE_PATH/usr/share/icons/hicolor/512x512/apps

          cp -r $LINUX_RELEASE_PATH/* $DEBIAN_RELEASE_PATH/usr/lib/pi-hole-client
          ln -s /usr/lib/pi-hole-client/pi-hole-client $DEBIAN_RELEASE_PATH/usr/bin/pi-hole-client
          cp linux/io.github.tsutsu3.pi_hole_client.desktop $DEBIAN_RELEASE_PATH/usr/share/applications
          cp assets/img/pi-hole-client-icon.png $DEBIAN_RELEASE_PATH/usr/share/icons/hicolor/512x512/apps/io.github.tsutsu3.pi_hole_client.png

          cat > $DEBIAN_RELEASE_PATH/DEBIAN/control <<EOF
          Package: pi-hole-client
          Version: ${{ env.VERSION_NAME }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0, libjsoncpp25
          Maintainer: tsutsu3 <tsutsu3@example.com>
          Description: A cross-platform Pi-hole client
          EOF

          dpkg-deb --build $DEBIAN_RELEASE_PATH PiHoleClient_${{ env.VERSION_NAME }}_Linux_x64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            PiHoleClient_${{ env.VERSION_NAME }}_Linux_x64.tar.gz
            PiHoleClient_${{ env.VERSION_NAME }}_Linux_x64.deb

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: get-version
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - run: flutter clean
      - run: flutter pub get

      - name: Copy .env file
        shell: pwsh
        run: Copy-Item .env.sample .env

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ env.VERSION_NAME }}" windows\installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/windows/PiHoleClient_${{ env.VERSION_NAME }}_Windows_x64.exe

  release-builds-github:
    permissions:
      contents: write
    name: Release builds to GitHub
    runs-on: ubuntu-latest
    needs: [get-version, build-android, build-linux, build-windows]
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create builds directory
        run: mkdir releases

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android
          path: releases/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: releases/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: releases/

      - name: Extract latest release notes from CHANGELOG.md
        run: |
          awk '/^## \[/ {if (p) exit; p=1} p' CHANGELOG.md > latest_changelog.md
          cat latest_changelog.md

      - name: Release to GitHub
        uses: ncipollo/release-action@v1
        with:
          artifacts: "releases/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: '${{ env.VERSION_NAME }}_(${{ env.VERSION_NUMBER }})'
          name: v${{ env.VERSION_NAME }}
          draft: true
          prerelease: false
          commit: ${{ github.sha }}
          bodyFile: "latest_changelog.md"

  release-build-google-play:
    name: Release Android build to the Google Play Store
    runs-on: ubuntu-latest
    needs: [get-version, build-android, build-linux, build-windows]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION_NAME: ${{ needs.get-version.outputs.VERSION_NAME }}
      VERSION_NUMBER: ${{ needs.get-version.outputs.VERSION_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Release app to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.tsutsu3.pi_hole_client
          releaseFiles: PiHoleClient_${{ env.VERSION_NAME }}_Android.aab
          track: production # Available tracks are: production,beta,alpha,internal,test
          status: draft
          releaseName: ${{ env.VERSION_NAME }}
