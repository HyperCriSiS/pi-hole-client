name: automation inspect error state
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-errorstate.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current error-state patterns
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== shared ErrorMessage ==='
          cat lib/ui/core/ui/components/error_message.dart
          echo '=== ServerInfo ==='
          sed -n '1,180p' lib/ui/settings/server_info/server_info_screen.dart
          echo '=== Interface ==='
          sed -n '1,230p' lib/ui/settings/interface/interface_screen.dart
          echo '=== relevant tests ==='
          find test -type f | grep -E 'server_info|interface|error_message' | sort
          for f in $(find test -type f | grep -E 'server_info|interface|error_message' | sort | head -n 20); do echo "--- $f"; sed -n '1,280p' "$f"; done
