name: automation inspect error state
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-errorstate.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current error-state patterns
        run: |
          set +e
          echo '=== ErrorMessage usages ==='
          grep -RIn -B8 -A18 'ErrorMessage(' lib/ui
          echo '=== error_message imports ==='
          grep -RIl 'error_message.dart' lib/ui | sort
          echo '=== inline error UI candidates ==='
          grep -RIn -B8 -A22 -E 'Icons\.error|noticeError|errorMessage|error\.toString|state\.error|hasError' lib/ui | head -n 900
          echo '=== screen tree ==='
          find lib/ui -type f -name '*screen.dart' | sort
