name: Migrate generated v6 metrics

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/migrate-v6-metrics.yaml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply metrics migration and roadmap sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path('lib/data/repositories/api/v6/ftl_repository.dart')
          s = repo.read_text()
          import_anchor = "import 'package:pi_hole_client/data/model/v6/ftl/sensors.dart' as legacy_sensors;\n"
          if s.count(import_anchor) != 1:
              raise SystemExit('FTL metrics import anchor mismatch')
          s = s.replace(
              import_anchor,
              "import 'package:pi_hole_client/data/model/v6/ftl/metrics.dart' as legacy_metrics;\n" + import_anchor,
              1,
          )
          pattern = r"  @override\n  Future<Result<FtlDnsMetrics>> fetchInfoMetrics\(\) \{.*?\n  \}\n\n  @override\n  Future<Result<FtlSensor>>"
          replacement = """  @override
          Future<Result<FtlDnsMetrics>> fetchInfoMetrics() {
            return runWithResultRetry(
              action: () async {
                final sid = await getSid();
                _service.setSid(sid);
                final result = await _service.getInfoMetrics();
                return result.map(
                  (e) => legacy_metrics.InfoMetrics.fromJson(e.toJson()).toDomain(),
                );
              },
              onRetry: (_, e) => renewSidIfExpired(e),
            );
          }

          @override
          Future<Result<FtlSensor>>"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit('FTL fetchInfoMetrics regex mismatch')
          repo.write_text(s)

          test = Path('test/data/repositories/api/v6/ftl_repository_test.dart')
          s = test.read_text()
          flag_anchor = '  bool shouldFail = false;\n'
          if s.count(flag_anchor) != 1:
              raise SystemExit('Fake service flag anchor mismatch')
          s = s.replace(flag_anchor, flag_anchor + '  bool shouldFailMetrics = false;\n', 1)

          method_anchor = '''  @override
          Future<Result<GetSensors200Response>> getInfoSensors() async {
          '''
          metrics_method = '''  @override
          Future<Result<GetMetricsinfo200Response>> getInfoMetrics() async {
            if (shouldFailMetrics) {
              return Failure(Exception('Forced getInfoMetrics failure'));
            }
            return Success(GetMetricsinfo200Response.fromJson(kSrvGetInfoMetrics.toJson()));
          }

          ''' + method_anchor
          if s.count(method_anchor) != 1:
              raise SystemExit('Fake service sensor anchor mismatch')
          s = s.replace(method_anchor, metrics_method, 1)

          metrics_pattern = r"  group\('fetchInfoMetrics', \(\) \{.*?\n  \}\);\n\n  group\('fetchInfoSensors'"
          metrics_replacement = """  group('fetchInfoMetrics', () {
            setUp(() {
              client = FakePiholeV6ApiClient();
              creds = FakeSessionCredentialService();
              service = _FakePiholeV6Service();
              repository = FtlRepositoryV6(
                client: client,
                service: service,
                sessionCache: V6SessionCache(creds: creds, client: client),
              );
            });

            test('should fetch info metrics successfully through generated service', () async {
              final result = await repository.fetchInfoMetrics();
              expect(result.getOrNull(), kRepoFetchFtlMetrics);
              expect(service.lastSid, 'sid123');
            });

            test('should fail when generated metrics request fails', () async {
              service.shouldFailMetrics = true;

              final result = await repository.fetchInfoMetrics();
              expectError(result, messageContains: 'Forced getInfoMetrics failure');
            });
          });

          group('fetchInfoSensors'"""
          s, n = re.subn(metrics_pattern, metrics_replacement, s, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit('Metrics test group regex mismatch')
          test.write_text(s)

          roadmap = Path('ROADMAP.md')
          s = roadmap.read_text()
          old = '- [x] Migrate `/api/info/sensors` to the same generated service after verifying JSON contract parity; focused FTL/service/SID regression coverage is green before commit, with the clean full-suite gate still required on the resulting head.\n'
          new = '- [x] Migrate `/api/info/sensors` to the same generated service after verifying JSON contract parity; focused FTL/service/SID regression coverage and the full Dart suite are green.\n- [x] Migrate `/api/info/metrics` after verifying DNS cache/reply and DHCP payload parity; focused generated-service/FTL regression coverage is green before commit, with the clean full-suite gate still required on the resulting head.\n'
          if s.count(old) != 1:
              raise SystemExit('ROADMAP sensor validation anchor mismatch')
          roadmap.write_text(s.replace(old, new, 1))

          triage = Path('UPSTREAM_TRIAGE.md')
          s = triage.read_text()
          old = '| #639 | Pi-hole v6 API | **In progress in `dev`.** `/api/info/version` is the first full-suite-validated production path on the generated OpenAPI service, preserving TLS/pinning, shared SID injection and generated-401 renewal. `/api/info/sensors` is the next parity-safe read-only migration with focused regression coverage. Keep `/api/info/client` handwritten because its generated schema omits current request metadata, and keep auth handwritten until generated `POST /auth` supports TOTP. |'
          new = '| #639 | Pi-hole v6 API | **In progress in `dev`.** `/api/info/version` and `/api/info/sensors` are full-suite-validated production paths on the generated OpenAPI service, preserving TLS/pinning, shared SID injection and generated-401 renewal. `/api/info/metrics` is the next parity-verified read-only migration with focused regression coverage. Keep `/api/info/client` handwritten because its generated schema omits current request metadata, and keep auth handwritten until generated `POST /auth` supports TOTP. |'
          if s.count(old) != 1:
              raise SystemExit('UPSTREAM_TRIAGE #639 anchor mismatch')
          triage.write_text(s.replace(old, new, 1))
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Format migrated Dart files
        run: dart format lib/data/repositories/api/v6/ftl_repository.dart test/data/repositories/api/v6/ftl_repository_test.dart

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare env file
        run: cp .env.sample .env

      - name: Generate Git commit hash
        run: dart run tools/generate_git_commit.dart

      - name: Run focused generated-v6 tests
        run: >-
          flutter test --reporter expanded
          test/data/services/api/wrappers/pihole_v6_service_test.dart
          test/data/repositories/api/v6/base_v6_sid_repository_test.dart
          test/data/repositories/api/v6/ftl_repository_test.dart

      - name: Commit validated metrics migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/repositories/api/v6/ftl_repository.dart test/data/repositories/api/v6/ftl_repository_test.dart ROADMAP.md UPSTREAM_TRIAGE.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor: migrate FTL metrics to generated v6 service"
          git push origin HEAD:dev
