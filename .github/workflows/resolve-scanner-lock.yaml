name: Resolve scanner lockfile

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: scanner-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
