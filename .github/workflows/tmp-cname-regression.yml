name: Temporary CNAME regression completion

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-cname-regression.yml'

permissions:
  contents: write

jobs:
  complete-cname-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare env file
        run: touch .env

      - name: Extend fake client and CNAME regression coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          fake_path = Path('testing/fakes/services/fake_pihole_v6_api_client.dart')
          fake = fake_path.read_text()

          marker = re.search(r'(?m)^(\s*)bool shouldFail\s*=\s*false;\s*$', fake)
          if not marker:
              raise SystemExit('Could not locate shouldFail field in fake client')
          indent = marker.group(1)
          if 'ConfigData? getConfigElementConfig;' not in fake:
              fields = f'''\n{indent}ConfigData? getConfigElementConfig;\n{indent}ConfigData? lastPatchConfigBody;\n{indent}bool? lastPatchConfigRestart;\n{indent}String? lastPutConfigElement;\n{indent}String? lastPutConfigValue;\n{indent}bool? lastPutConfigRestart;\n{indent}String? lastDeleteConfigElement;\n{indent}String? lastDeleteConfigValue;\n{indent}bool? lastDeleteConfigRestart;'''
              fake = fake[:marker.end()] + fields + fake[marker.end():]

          old = "    return Success(kSrvGetConfigElement);"
          new = """    if (getConfigElementConfig != null) {
      return Success(kSrvGetConfigElement.copyWith(config: getConfigElementConfig));
    }
    return Success(kSrvGetConfigElement);"""
          if 'getConfigElementConfig != null' not in fake:
              if fake.count(old) != 1:
                  raise SystemExit(f'Expected one getConfigElement success return, found {fake.count(old)}')
              fake = fake.replace(old, new, 1)

          replacements = [
              (
                  """    if (shouldFail) {
      return Failure(Exception('Forced patchConfig failure'));
    }
    return Success(kSrvPatchConfig);""",
                  """    lastPatchConfigBody = body;
    lastPatchConfigRestart = isRestart;
    if (shouldFail) {
      return Failure(Exception('Forced patchConfig failure'));
    }
    return Success(kSrvPatchConfig);""",
                  'lastPatchConfigBody = body;',
              ),
              (
                  """    if (shouldFail) {
      return Failure(Exception('Forced putConfigElement failure'));
    }
    return const Success(unit);""",
                  """    lastPutConfigElement = element;
    lastPutConfigValue = value;
    lastPutConfigRestart = isRestart;
    if (shouldFail) {
      return Failure(Exception('Forced putConfigElement failure'));
    }
    return const Success(unit);""",
                  'lastPutConfigElement = element;',
              ),
              (
                  """    if (shouldFail) {
      return Failure(Exception('Forced deleteConfigElement failure'));
    }
    return const Success(unit);""",
                  """    lastDeleteConfigElement = element;
    lastDeleteConfigValue = value;
    lastDeleteConfigRestart = isRestart;
    if (shouldFail) {
      return Failure(Exception('Forced deleteConfigElement failure'));
    }
    return const Success(unit);""",
                  'lastDeleteConfigElement = element;',
              ),
          ]
          for before, after, sentinel in replacements:
              if sentinel not in fake:
                  if before not in fake:
                      raise SystemExit(f'Could not locate fake method block for {sentinel}')
                  fake = fake.replace(before, after, 1)

          fake_path.write_text(fake)

          test_path = Path('test/data/repositories/api/v6/local_dns_repository_test.dart')
          tests = test_path.read_text()
          config_import = "import 'package:pi_hole_client/data/model/v6/config/config.dart';\n"
          if config_import not in tests:
              anchor = "import 'package:pi_hole_client/data/repositories/api/v6/local_dns_repository.dart';\n"
              if anchor not in tests:
                  raise SystemExit('Could not locate repository import anchor')
              tests = tests.replace(anchor, config_import + anchor, 1)

          sentinel = "should update CNAME record and preserve other TTL values"
          if sentinel not in tests:
              addition = r'''

    test('should parse CNAME TTL values from config', () async {
      client.getConfigElementConfig = ConfigData(
        dns: Dns(
          cnameRecords: [
            'printer.example.test, printer.lan, 300',
            'nas.example.test,nas.lan',
          ],
        ),
      );

      final result = await repository.fetchCnameRecords();

      expect(result.isSuccess(), true);
      expect(
        result.getOrNull(),
        const [
          CnameRecord(
            alias: 'printer.example.test',
            target: 'printer.lan',
            ttl: 300,
          ),
          CnameRecord(alias: 'nas.example.test', target: 'nas.lan'),
        ],
      );
    });

    test('should update CNAME record and preserve other TTL values', () async {
      const oldRecord = CnameRecord(
        alias: 'old.example.test',
        target: 'old.lan',
        ttl: 300,
      );
      const newRecord = CnameRecord(
        alias: 'new.example.test',
        target: 'new.lan',
        ttl: 450,
      );
      client.getConfigElementConfig = ConfigData(
        dns: Dns(
          cnameRecords: [
            'old.example.test,old.lan,300',
            'keep.example.test,keep.lan,600',
          ],
        ),
      );

      final result = await repository.updateCnameRecord(oldRecord, newRecord);

      expect(result.isSuccess(), true);
      expect(client.lastPatchConfigRestart, true);
      expect(
        client.lastPatchConfigBody?.dns?.cnameRecords,
        ['new.example.test,new.lan,450', 'keep.example.test,keep.lan,600'],
      );
    });

    test('should request DNS restart for CNAME add and delete', () async {
      const record = CnameRecord(
        alias: 'printer.example.test',
        target: 'printer.lan',
        ttl: 300,
      );

      final addResult = await repository.addCnameRecord(record);

      expect(addResult.isSuccess(), true);
      expect(client.lastPutConfigElement, 'dns/cnameRecords');
      expect(client.lastPutConfigValue, 'printer.example.test,printer.lan,300');
      expect(client.lastPutConfigRestart, true);

      final deleteResult = await repository.deleteCnameRecord(record);

      expect(deleteResult.isSuccess(), true);
      expect(client.lastDeleteConfigElement, 'dns/cnameRecords');
      expect(client.lastDeleteConfigValue, 'printer.example.test,printer.lan,300');
      expect(client.lastDeleteConfigRestart, true);
    });
'''
              closing = '  });\n}\n'
              if not tests.endswith(closing):
                  raise SystemExit('Unexpected local_dns_repository_test.dart ending')
              tests = tests[:-len(closing)] + addition + closing

          test_path.write_text(tests)

      - name: Format changed Dart files
        run: dart format testing/fakes/services/fake_pihole_v6_api_client.dart test/data/repositories/api/v6/local_dns_repository_test.dart

      - name: Run focused Local DNS repository tests
        run: flutter test test/data/repositories/api/v6/local_dns_repository_test.dart

      - name: Update roadmap after successful focused tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text()
          old = "  - [ ] Add focused v6 API/repository regression tests for reading, adding, updating and deleting CNAME records, including restart/error handling. Basic fetch/add/delete success and CRUD error paths were added in `3b9d9ac`; successful update/TTL parsing and explicit restart assertions remain before this item can be closed."
          new = "  - [x] Add focused v6 API/repository regression tests for reading, adding, updating and deleting CNAME records, including restart/error handling; fetch/add/update/delete, TTL parsing/preservation, explicit restart behavior, and CRUD error paths are covered."
          if old not in text:
              raise SystemExit('Expected CNAME regression roadmap line was not found')
          text = text.replace(old, new, 1)
          old_status = "**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. The next unblocked prioritized work is #570: complete focused CNAME repository regression coverage (successful update/TTL parsing and explicit restart assertions), then integrate the tested v6 contract into the Local DNS UI."
          new_status = "**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. The next unblocked prioritized work is #570: integrate the now-tested v6 CNAME repository contract into the Local DNS UI."
          if old_status not in text:
              raise SystemExit('Expected roadmap completion-status line was not found')
          text = text.replace(old_status, new_status, 1)
          path.write_text(text)

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-cname-regression.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit and push verified changes
        run: |
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add testing/fakes/services/fake_pihole_v6_api_client.dart test/data/repositories/api/v6/local_dns_repository_test.dart ROADMAP.md .github/workflows/tmp-cname-regression.yml
          git commit -m 'test: complete v6 CNAME repository regression coverage'
          git push origin dev
