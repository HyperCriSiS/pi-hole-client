name: Dart Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'

env:
  api_level: 35

# Avoid duplicate PR test runs when new commits arrive while keeping main push runs intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y lcov libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        flutter-version: 3.44.1

    - name: Get dependencies
      run: flutter pub get

    - name: Get mock API dependencies
      working-directory: mock_api_server
      run: dart pub get

    - name: Copy .env file
      run: cp .env.sample .env

    - name: Generate git commit file
      run: dart run tools/generate_git_commit.dart

    - name: Generate files
      run: |
        dart run build_runner build --delete-conflicting-outputs
        dart format .
        dart analyze

    - name: Run full coverage tool
      run: dart run full_coverage

    - name: Run tests
      run: xvfb-run flutter test --coverage

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-coverage
        path: coverage/lcov.info

