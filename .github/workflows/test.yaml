  codecov:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download unit test coverage artifact
      uses: actions/download-artifact@v8
      with:
        name: unit-test-coverage
        path: coverage/unit

    # - name: Download integration test coverage artifact
    #   uses: actions/download-artifact@v8
    #   with:
    #     name: integration-test-coverage
    #     path: coverage/integration

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage/unit/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: |
          sudo apt update
          sudo apt install -y lcov libsecret-1-0 libjsoncpp-dev libsecret-1-dev xvfb

      - name: Setup Flutter
        if: env.SONAR_TOKEN != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.44.1

      - name: Get dependencies
        if: env.SONAR_TOKEN != ''
        run: flutter pub get

      - name: Copy .env file
        if: env.SONAR_TOKEN != ''
        run: cp .env.sample .env

      - name: Generate git commit file
        if: env.SONAR_TOKEN != ''
        run: dart run tools/generate_git_commit.dart

      - name: Generate files
        if: env.SONAR_TOKEN != ''
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Download unit test coverage artifact
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: unit-test-coverage
          path: coverage/unit

      # - name: Download integration test coverage artifact
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: integration-test-coverage
      #     path: coverage/integration

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
