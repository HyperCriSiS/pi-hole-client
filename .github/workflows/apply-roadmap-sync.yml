name: Apply roadmap sync

on:
  push:
    branches:
      - roadmap/sync-generated-auth

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact roadmap and triage updates
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          lines = roadmap.read_text().splitlines()
          out = []
          for line in lines:
              if line.startswith('- [ ] #639 / #352:'):
                  out.append('- [ ] #639 / #352: incrementally improve Pi-hole v6 API support and server-side log filtering with parity tests; retain handwritten transport only for explicit compatibility/schema/behavior gaps that the generated client cannot yet preserve.')
              elif line.startswith('- [ ] Keep `/api/network/gateway`'):
                  out.append('- [ ] Keep `/api/network/gateway` on the handwritten client for now: the pinned FTL v6.7 generated gateway response omits `interfaces` and `routes`, while the standalone generated `/api/network/interfaces` model also omits detailed fields already exposed by the app (for example `index`, `family`, `ifname`, MTU/queue/carrier details). `InterfaceViewModel` explicitly requests `detailed=true`, so migrating to the current generated models would lose supported data.')
              elif line.startswith('- [ ] Keep ARP/network flushing'):
                  out.append('- [x] Migrate `/api/action/flush/network` with the existing HTTP 404 fallback to deprecated `/api/action/flush/arp` onto generated actions; preserve shared SID injection, 401 renewal/retry behavior and pre-v6.3 compatibility.')
                  out.append('- [ ] Keep gravity update handwritten for now because the current client exposes the streaming progress contract while the generated endpoint does not.')
              elif line.startswith('- [ ] Keep only authentication session creation/renewal'):
                  out.append('- [x] Migrate the remaining auth transport to the generated client. Authenticated reads/deletes already use generated APIs; the unauthenticated capability probe now uses an isolated generated Dio clone with no shared SID mutation, and session creation/automatic renewal use generated `POST /auth`. Because pinned FTL v6.7 still omits TOTP from the request schema, an isolated compatibility interceptor injects numeric TOTP only after generated password serialization and preserves the existing Required/Invalid/Reused/RateLimit exception semantics without forking the pinned spec.')
              elif line.startswith('- [x] Refresh the generated OpenAPI baseline reproducibly'):
                  out.append(line.replace('The remaining handwritten paths are explicit compatibility/schema/behavior holds rather than unreviewed migration work.', 'The remaining handwritten production paths are the explicit `/api/info/ftl` compatibility hold, detailed `/api/network/gateway` schema hold and gravity streaming behavior hold rather than unreviewed migration work.'))
              elif line.startswith('**Not fully completed.**'):
                  out.append('**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. #570 is implemented and CI-validated through the v6 repository and Local DNS UI layers. #134 remains the active distribution gate: secret-free unsigned packaging, Android scanner compliance and the download-free native-asset path are implemented and CI-validated, and the package-identity rename surface is now mechanically audited; the actual independent-fork application ID/name/icon decision and migration remain before downstream F-Droid metadata can be submitted. Deterministic #639 generated-client migration now runs on a reproducibly pinned FTL v6.7 OpenAPI baseline with deterministic generated-code formatting and URI-component-safe path parameters; Local DNS/CNAME CRUD and all auth/session transport including TOTP-compatible session creation/renewal and the unauthenticated capability probe are generated-client based. Remaining handwritten production transport is limited to `/api/info/ftl`, detailed `/api/network/gateway`, and gravity streaming because of documented compatibility/schema/behavior blockers. #352 now pushes exact domain, single concrete status, one literal client IP, or one hostname (`client_name`) server-side while multi-value/grouped filters remain local.')
              else:
                  out.append(line)
          roadmap.write_text('\n'.join(out) + '\n')

          triage = Path('UPSTREAM_TRIAGE.md')
          lines = triage.read_text().splitlines()
          out = []
          for line in lines:
              if line.startswith('| #639 | Pi-hole v6 API |'):
                  out.append('| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration covers the parity-verified info paths including `/api/info/client`, history/stats, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions including the pre-v6.3 network→ARP fallback, DHCP, DNS blocking, DNS query-logging config reads, complete Local DNS/CNAME config CRUD, and all auth/session transport. The unauthenticated auth capability probe uses an isolated generated transport without mutating shared SID state; generated `POST /auth` session creation/renewal preserves TOTP through an isolated compatibility interceptor because pinned FTL v6.7 omits TOTP from the request schema. The generated client is reproducibly refreshed to pinned FTL v6.7 (`fa65a88f8cdef1013594d4de14108077954faea4`) with pinned Redocly/OpenAPI Generator tooling, deterministic formatting and URI-component-safe generated path parameters. Keep only `/api/info/ftl`, detailed network gateway and gravity streaming handwritten: the FTL counter union remains absent from the schema, generated gateway/interface models still lose detailed interface/route fields required by the app, and gravity\'s generated endpoint does not preserve the current streaming progress contract. |')
              elif line.startswith('6. #639/#352:'):
                  out.append('6. #639/#352: incremental generated-v6 migration remains active on `main`; #352 now includes exact single-hostname transport via `client_name` in addition to domain/status/IP filters, while #639 has generated auth/session transport and generated network→ARP fallback in addition to the earlier migrations. The reproducibly pinned FTL v6.7 snapshot uses deterministic formatting and URI-component-safe generated path parameters; only `/api/info/ftl`, detailed network gateway and gravity streaming remain handwritten compatibility/schema/behavior holds. #570 is complete with generated v6 Local DNS/CNAME CRUD. #134 source-build work is CI-validated but downstream submission remains blocked on the required independent-fork package identity.')
              else:
                  out.append(line)
          triage.write_text('\n'.join(out) + '\n')
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-roadmap-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md UPSTREAM_TRIAGE.md .github/workflows/apply-roadmap-sync.yml
          git diff --cached --check
          git commit -m "docs: sync generated v6 roadmap status"
          git push
