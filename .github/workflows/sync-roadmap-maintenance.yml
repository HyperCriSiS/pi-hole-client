name: Sync maintenance roadmap status

on:
  push:
    branches:
      - roadmap/sync-maintenance-2026-09-11-final

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: roadmap/sync-maintenance-2026-09-11-final
      - name: Synchronize roadmap and upstream triage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          road = Path('ROADMAP.md')
          s = road.read_text()
          needle = '- [x] Extend Dependabot coverage to the Docusaurus/pnpm website dependency tree so website security and version updates are maintained alongside Dart and GitHub Actions dependencies.\n'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '- [x] Replace the stale upstream ESLint 8→9 path with a validated direct migration to ESLint 10.10.0: use native flat config, an explicit current TypeScript parser, and preserve the Docusaurus recommended rules; lint, typecheck and production docs deployment are green.\n- [x] Update the QR-scanner camera dependency to 0.12.1 with a lockfile regenerated by the repository-pinned Flutter 3.44.1 toolchain, avoiding unrelated Dependabot resolver churn while keeping Dart tests and the unsigned Android source build green.\n')

          needle = '- [x] Refresh the generated OpenAPI baseline reproducibly to pinned FTL v6.7:'
          pos = s.index(needle)
          end = s.index('\n', pos)
          s = s[:end + 1] + '- [x] Enforce that bounded handwritten-v6 boundary in CI: only Actions (gravity streaming), FTL compatibility and detailed Network may receive the legacy `PiholeV6ApiClient`; `V6SessionCache`/`V6SessionCacheStore` retain only their nullable compatibility test seam while production factory wiring is asserted to bind the generated service. The path-filtered architecture audit fails if the legacy client boundary expands again.\n' + s[end + 1:]

          needle = '  - [x] Inventory and guard the Android package-identity migration surface without choosing branding prematurely:'
          pos = s.index(needle)
          end = s.index('\n', pos)
          s = s[:end + 1] + '  - [x] Add and CI-validate a dry-run-by-default Android identity migrator for the eventual fork rename. `--apply` atomically updates Gradle/application identity, manifest/widget action prefixes, Android display strings, Google Play package metadata and Kotlin package paths/declarations, records the previous application ID as forbidden, and runs the identity audit afterward; the actual new ID/name/icon choice remains intentionally external to the helper.\n' + s[end + 1:]

          old = '- #134 scanner compliance is resolved: Android no longer uses `mobile_scanner`/Google ML Kit. The source-build path is also isolated from private signing material and from `sqlite3` precompiled-binary downloads and is CI-validated, including an `apksigner` check that the produced release APK is unsigned. The package-identity migration surface is now inventoried and guarded in the unsigned Android PR build; a separate F-Droid publication still requires choosing and applying a fresh application ID plus corresponding name/icon/string changes before downstream metadata submission.\n'
          new = '- #134 scanner compliance is resolved: Android no longer uses `mobile_scanner`/Google ML Kit, and the current `camera` 0.12.1 dependency is locked reproducibly with Flutter 3.44.1. The source-build path is also isolated from private signing material and from `sqlite3` precompiled-binary downloads and is CI-validated, including an `apksigner` check that the produced release APK is unsigned. The package-identity migration surface is inventoried and guarded, and a dry-run/`--apply` migrator is CI-validated; a separate F-Droid publication still requires choosing the fresh application ID plus corresponding name/icon/string changes before running the migration and submitting downstream metadata.\n'
          assert s.count(old) == 1
          s = s.replace(old, new)

          start = s.index('**Not fully completed.**')
          s = s[:start] + '**Not fully completed.** #442 remains blocked on a fresh Android 16 reproduction/current stack. #570 is implemented and CI-validated through the v6 repository and Local DNS UI layers. #134 remains the active distribution gate: secret-free unsigned packaging, Android scanner compliance and the download-free native-asset path are implemented and CI-validated, the scanner camera dependency is reproducibly updated to 0.12.1, and the package-identity rename surface now has both a mechanical audit and a dry-run/`--apply` migration helper; the actual independent-fork application ID/name/icon decision remains before the migration can be applied and downstream F-Droid metadata submitted. Deterministic #639 generated-client migration runs on a reproducibly pinned FTL v6.7 OpenAPI baseline with deterministic generated-code formatting and URI-component-safe path parameters; Local DNS/CNAME CRUD and all auth/session transport including TOTP-compatible session creation/renewal and the unauthenticated capability probe are generated-client based. A path-filtered architecture guard now prevents the handwritten-client boundary from expanding beyond the documented holds. Remaining handwritten production transport is limited to `/api/info/ftl`, detailed `/api/network/gateway`, and gravity streaming because of documented compatibility/schema/behavior blockers. #352 now pushes exact domain, single concrete status, one literal client IP, or one hostname (`client_name`) server-side while multi-value/grouped filters remain local.\n'
          road.write_text(s)

          triage = Path('UPSTREAM_TRIAGE.md')
          t = triage.read_text()
          replacements = {
              '| #646 | TLS certificate inspection/cache refactor | Hold / rework | Upstream PR is still a draft, based on an older `main`, with coverage gates failing. Do not merge wholesale. Rebase/rework before adoption. |': '| #646 | TLS certificate inspection/cache refactor | Hold / rework | Re-audited 2026-09-11: upstream is still a draft with a 25-file / ~2.2k-line refactor; its Dart test job is green but Codecov project+patch and SonarCloud remain red. Do not merge wholesale; rebase/rework and validate the transport/cache semantics independently before adoption. |',
              '| #484 | ESLint 8 -> 9 | Hold / fix first | Upstream website deployment check fails. Requires ESLint/Docusaurus compatibility work before import. |': '| #484 | ESLint 8 -> 9 | Superseded / implemented | Do not import the stale upstream PR. Fork PR #76 moved directly from ESLint 8 to ESLint 10.10.0 with native flat config plus the current TypeScript parser; lint, typecheck, production build, docs deployment, CodeQL and static-analysis gates are green. |',
              '| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration covers the parity-verified info paths including `/api/info/client`, history/stats, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions including the pre-v6.3 network→ARP fallback, DHCP, DNS blocking, DNS query-logging config reads, complete Local DNS/CNAME config CRUD, and all auth/session transport. The unauthenticated auth capability probe uses an isolated generated transport without mutating shared SID state; generated `POST /auth` session creation/renewal preserves TOTP through an isolated compatibility interceptor because pinned FTL v6.7 omits TOTP from the request schema. The generated client is reproducibly refreshed to pinned FTL v6.7 (`fa65a88f8cdef1013594d4de14108077954faea4`) with pinned Redocly/OpenAPI Generator tooling, deterministic formatting and URI-component-safe generated path parameters. Keep only `/api/info/ftl`, detailed network gateway and gravity streaming handwritten: the FTL counter union remains absent from the schema, generated gateway/interface models still lose detailed interface/route fields required by the app, and gravity\'s generated endpoint does not preserve the current streaming progress contract. |': '| #639 | Pi-hole v6 API | **In progress in `main`.** Generated-client migration covers the parity-verified info paths including `/api/info/client`, history/stats, `/api/queries` with legacy `start` pagination preserved, network-device reads/deletion, DNS actions including the pre-v6.3 network→ARP fallback, DHCP, DNS blocking, DNS query-logging config reads, complete Local DNS/CNAME config CRUD, and all auth/session transport. The unauthenticated auth capability probe uses an isolated generated transport without mutating shared SID state; generated `POST /auth` session creation/renewal preserves TOTP through an isolated compatibility interceptor because pinned FTL v6.7 omits TOTP from the request schema. The generated client is reproducibly refreshed to pinned FTL v6.7 (`fa65a88f8cdef1013594d4de14108077954faea4`) with pinned Redocly/OpenAPI Generator tooling, deterministic formatting and URI-component-safe generated path parameters. A path-filtered CI architecture guard now enforces the remaining handwritten boundary: only Actions, FTL and detailed Network may receive `PiholeV6ApiClient`, while the session cache retains only its nullable compatibility test seam and production wiring is asserted to use the generated service. Keep only `/api/info/ftl`, detailed network gateway and gravity streaming handwritten: the FTL counter union remains absent from the schema, generated gateway/interface models still lose detailed interface/route fields required by the app, and gravity\'s generated endpoint does not preserve the current streaming progress contract. |',
              '| #134 | F-Droid | **In progress in `main`.** Secret-free unsigned Android packaging is isolated from private release signing. `mobile_scanner`/Google ML Kit has been removed and replaced by `camera` + pure-Dart `zxing2`; the F-Droid source-build checkout also switches `sqlite3` to Android system SQLite so it does not fetch a precompiled native library during the build. The download-free unsigned build and `apksigner` unsigned-artifact verification are CI-validated on `3d3e3d74`. The Android identity migration surface is now inventoried and guarded in the existing unsigned PR build (Gradle ID/namespace, Kotlin package paths, widget actions, display strings/assets, and release metadata). F-Droid policy still requires choosing and applying a fresh Android ID plus corresponding name/icon/string changes for an independent submission, so the actual package identity remains the final product-level gate before downstream `fdroiddata` metadata. |': '| #134 | F-Droid | **In progress in `main`.** Secret-free unsigned Android packaging is isolated from private release signing. `mobile_scanner`/Google ML Kit has been removed and replaced by `camera` + pure-Dart `zxing2`; the F-Droid source-build checkout also switches `sqlite3` to Android system SQLite so it does not fetch a precompiled native library during the build. The download-free unsigned build and `apksigner` unsigned-artifact verification are CI-validated on `3d3e3d74`. The Android identity migration surface is inventoried and guarded in the existing unsigned PR build (Gradle ID/namespace, Kotlin package paths, widget actions, display strings/assets, and release metadata), and a dry-run-by-default migration helper can atomically apply the eventual ID/name changes, move Kotlin package paths, record the old ID as forbidden and rerun the audit. The scanner\'s `camera` dependency is now reproducibly locked at 0.12.1 with Flutter 3.44.1. F-Droid policy still requires choosing the fresh Android ID plus corresponding name/icon/string changes for an independent submission, so that product identity remains the final gate before applying the helper and drafting downstream `fdroiddata` metadata. |',
              '6. #639/#352: incremental generated-v6 migration remains active on `main`; #352 now includes exact single-hostname transport via `client_name` in addition to domain/status/IP filters, while #639 has generated auth/session transport and generated network→ARP fallback in addition to the earlier migrations. The reproducibly pinned FTL v6.7 snapshot uses deterministic formatting and URI-component-safe generated path parameters; only `/api/info/ftl`, detailed network gateway and gravity streaming remain handwritten compatibility/schema/behavior holds. #570 is complete with generated v6 Local DNS/CNAME CRUD. #134 source-build work is CI-validated but downstream submission remains blocked on the required independent-fork package identity.': '6. #639/#352: incremental generated-v6 migration remains active on `main`; #352 now includes exact single-hostname transport via `client_name` in addition to domain/status/IP filters, while #639 has generated auth/session transport and generated network→ARP fallback in addition to the earlier migrations. The reproducibly pinned FTL v6.7 snapshot uses deterministic formatting and URI-component-safe generated path parameters, and CI guards the handwritten boundary from expanding; only `/api/info/ftl`, detailed network gateway and gravity streaming remain compatibility/schema/behavior holds. #570 is complete with generated v6 Local DNS/CNAME CRUD. #134 source-build work and the identity migration helper are CI-validated, but downstream submission remains blocked on choosing the required independent-fork product identity.'
          }
          for old, new in replacements.items():
              assert t.count(old) == 1, old[:80]
              t = t.replace(old, new)
          triage.write_text(t)
          PY
          git diff --check
          git diff -- ROADMAP.md UPSTREAM_TRIAGE.md
      - name: Commit synchronized status
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP.md UPSTREAM_TRIAGE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: sync September maintenance roadmap status'
          git push origin HEAD:roadmap/sync-maintenance-2026-09-11-final
