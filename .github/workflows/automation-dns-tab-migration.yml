name: Validate DnsTab shared error-state migration
on: [push]
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply focused migration
        run: python3 tools/automation_migrate_dns_tab.py
      - name: Prepare environment
        run: cp .env.sample .env
      - name: Install dependencies
        run: flutter pub get
      - name: Validate formatting and tests
        run: |
          dart format --output=none --set-exit-if-changed lib/ui/statistics/widgets/dns_tab.dart
          flutter test test/ui/statistics/statistics_test.dart
          git diff --check
      - name: Commit verified migration
        run: |
          rm -f .github/workflows/automation-dns-tab-migration.yml tools/automation_migrate_dns_tab.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: reuse shared error state in DNS statistics'
          git push origin HEAD:dev
