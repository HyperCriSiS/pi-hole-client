name: Temporary verified FTL migration

on:
  workflow_dispatch:
  push:
    branches:
      - roadmap/generated-ftl-info-compat
    paths:
      - .github/workflows/tmp-ftl-info-migration-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: roadmap/generated-ftl-info-compat
          fetch-depth: 0

      - name: Verify and apply FTL migration patch
        run: |
          cat .tmp/ftl_patch_0.b64 .tmp/ftl_patch_1.b64 > /tmp/ftl_migration.patch.gz.b64
          echo "db09bc2d41cbe019fb3682df8962de08008d5f5bdddafd1b5b1615b3e85e3367  /tmp/ftl_migration.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/ftl_migration.patch.gz.b64 | gzip -d > /tmp/ftl_migration.patch
          echo "fb3fb6001b7157537a14f3ce0fd6a87b98d6bf659ea1868bd9888be0f419a6a6  /tmp/ftl_migration.patch" | sha256sum -c -
          git apply --check /tmp/ftl_migration.patch
          git apply /tmp/ftl_migration.patch

          rm -f .tmp/ftl_patch_0.b64 .tmp/ftl_patch_1.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/tmp-ftl-info-migration.yml
          rm -f .github/workflows/tmp-ftl-info-migration-fix.yml
          rm -f .github/workflows/tmp-ftl-info-migration-run.yml

          python3 tools/openapi/audit_legacy_v6_boundary.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate FTL info off handwritten v6 transport"
          git push
