name: automation inspect next error
on:
  push:
    paths:
      - '.github/workflows/automation-inspect-next-error.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect DnsTab and shared ErrorMessage usage
        run: |
          echo '=== dns_tab.dart ==='
          sed -n '1,280p' lib/ui/statistics/widgets/dns_tab.dart
          echo '=== shared ErrorMessage examples ==='
          grep -R -n -C 5 'ErrorMessage(' lib/ui | head -n 260 || true
          echo '=== statistics tests ==='
          grep -n -C 8 -E 'DnsTab|error|ErrorMessage' test/ui/statistics/statistics_test.dart | head -n 260 || true
      - name: Remove helper
        run: |
          rm -f .github/workflows/automation-inspect-next-error.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary DnsTab probe' || exit 0
          git push origin HEAD:dev
